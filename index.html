<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<link rel="icon" type="image/png" href="icons/MSSO.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<title>澳門民間氣象台 - 首頁</title>
<style>
/* ========== 1. 深太空 (Deep Space) 全域主題基礎 ========== */
:root {
  --bg-dark: #0b0f19;
  --card-bg: rgba(22, 30, 46, 0.75);
  --card-bg-light: rgba(255, 255, 255, 0.03);
  --card-border: rgba(255, 255, 255, 0.08);
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  
  --accent-blue: #38bdf8;
  --accent-teal: #2dd4bf;
  --accent-green: #34d399;
  --accent-yellow: #facc15;
  --accent-orange: #f59e0b;
  --accent-red: #ef4444;
  --accent-purple: #a855f7;
  
  --transition-speed: 0.3s;
  --border-radius: 16px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
  background-color: var(--bg-dark);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 800px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* Header */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--card-border);
}

.logo-area {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-area img {
  width: 40px;
  height: 40px;
  object-fit: contain;
}

.logo-area h1 {
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.update-time {
  font-size: 0.85rem;
  color: var(--text-muted);
}

/* Cards */
.card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--border-radius);
  padding: 20px;
  backdrop-filter: blur(12px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}

.card-title {
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Current Weather */
.current-weather-main {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 15px;
}

.temp-display {
  display: flex;
  align-items: center;
  gap: 15px;
}

.current-icon {
  width: 80px;
  height: 80px;
  object-fit: contain;
}

.temp-value {
  font-size: 3.5rem;
  font-weight: 800;
  line-height: 1;
}

.temp-unit {
  font-size: 1.5rem;
  vertical-align: super;
}

.weather-details {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 0.95rem;
  color: var(--text-muted);
}

.weather-details span strong {
  color: var(--text-main);
}

/* Next 1 hour weather transition display */
.weather-change-container {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(56, 189, 248, 0.1);
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid rgba(56, 189, 248, 0.2);
}

.weather-change-arrow {
  font-size: 1.2rem;
  color: var(--accent-blue);
  font-weight: bold;
}

.next-hour-icon {
  width: 42px;
  height: 42px;
  object-fit: contain;
}

/* 臨近降雨提示 Box */
.precipitation-prompt-box {
  background: rgba(239, 68, 68, 0.15);
  border: 1px solid rgba(239, 68, 68, 0.4);
  border-radius: 12px;
  padding: 14px 18px;
  margin-top: 15px;
  display: none;
  align-items: center;
  gap: 12px;
  animation: pulse-alert 2s infinite;
}

.precipitation-prompt-box.active {
  display: flex;
}

.prompt-icon {
  font-size: 1.5rem;
}

.prompt-text {
  font-size: 0.95rem;
  color: #fca5a5;
  font-weight: 500;
}

@keyframes pulse-alert {
  0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
  70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
  100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
}

/* 整點天氣 (Hourly Forecast) */
.hourly-scroll {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 8px;
  scrollbar-width: thin;
  scrollbar-color: var(--accent-blue) var(--card-bg-light);
}

.hourly-scroll::-webkit-scrollbar {
  height: 6px;
}

.hourly-scroll::-webkit-scrollbar-thumb {
  background: var(--accent-blue);
  border-radius: 3px;
}

.hourly-card {
  min-width: 80px;
  background: var(--card-bg-light);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 12px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
}

.hourly-time {
  font-size: 0.85rem;
  color: var(--text-muted);
}

/* Requirement 2: Make 24H weather icon in 整點天氣 larger */
.hourly-icon {
  width: 52px;
  height: 52px;
  object-fit: contain;
}

.hourly-temp {
  font-size: 1rem;
  font-weight: 600;
}

.hourly-pop {
  font-size: 0.75rem;
  color: var(--accent-blue);
}

/* 7-Day Forecast */
.forecast-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
  gap: 10px;
}

.forecast-card-mini {
  background: var(--card-bg-light);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 12px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
}

.card-top {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-muted);
}

.card-middle {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.card-icon-large {
  width: 44px;
  height: 44px;
  object-fit: contain;
}

.temp-range-text {
  font-size: 0.9rem;
  font-weight: 600;
}

.humid-range-text {
  font-size: 0.75rem;
  color: var(--text-muted);
}

.card-bottom {
  font-size: 0.8rem;
  color: var(--accent-teal);
}

/* Radar & Map Container */
.map-container {
  width: 100%;
  height: 300px;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--card-border);
}

/* Loading & Error */
.loading, .error-msg {
  text-align: center;
  padding: 20px;
  color: var(--text-muted);
  font-size: 0.9rem;
}

.error-msg {
  color: var(--accent-red);
  display: none;
}
</style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-area">
            <img src="icons/MSSO.png" alt="Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1163/1163657.png'">
            <h1>澳門民間氣象台</h1>
        </div>
        <div class="update-time" id="update-time">更新中...</div>
    </header>

    <div class="card">
        <div class="card-title">
            <span>當前實況</span>
            <span id="location-name">澳門</span>
        </div>
        <div class="current-weather-main">
            <div class="temp-display">
                <img id="current-icon" class="current-icon" src="" alt="天氣圖示">
                <div id="weather-change-box" class="weather-change-container" style="display: none;">
                    <span class="weather-change-arrow">➔</span>
                    <img id="next-hour-icon" class="next-hour-icon" src="" alt="下一小時天氣圖示">
                </div>
                <div>
                    <span class="temp-value" id="current-temp">--</span><span class="temp-unit">°C</span>
                </div>
            </div>
            <div class="weather-details">
                <span id="current-condition">狀態載入中...</span>
                <span id="today-temp-range">今日氣溫：-- ~ -- °C</span>
                <span id="current-humidity">相對濕度：--%</span>
                <span id="current-wind">風向風速：--</span>
            </div>
        </div>

        <div id="precipitation-prompt-box" class="precipitation-prompt-box">
            <div class="prompt-icon">🌧️</div>
            <div class="prompt-text" id="precipitation-prompt-text">臨近降雨提示：預計短期內有雨，請留意天氣變化。</div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">整點天氣 (未來 24 小時)</div>
        <div id="hourly-loading" class="loading">載入整點數據中...</div>
        <div id="hourly-error" class="error-msg">整點數據載入失敗</div>
        <div class="hourly-scroll" id="hourly-container"></div>
    </div>

    <div class="card">
        <div class="card-title" id="forecast-section-title">七日天氣預報</div>
        <div id="forecast-loading" class="loading">載入預報數據中...</div>
        <div id="forecast-error" class="error-msg">預報數據載入失敗</div>
        <div class="forecast-grid" id="forecast-container"></div>
    </div>

    <div class="card">
        <div class="card-title">澳門降雨雷達</div>
        <div class="map-container" id="map"></div>
    </div>
</div>

<script>
// Open-Meteo API for Macau (Latitude: 22.1987, Longitude: 113.5439)
const LAT = 22.1987;
const LON = 113.5439;

// WMO Weather interpretation codes
function getWmoWeatherText(code) {
    const weatherMap = {
        0: '晴朗',
        1: '大致晴朗',
        2: '部分多雲',
        3: '陰天',
        45: '有霧',
        48: '霧凇',
        51: '輕微毛毛雨',
        53: '毛毛雨',
        55: '強毛毛雨',
        56: '凍毛毛雨',
        57: '強凍毛毛雨',
        61: '小雨',
        63: '中雨',
        65: '大雨',
        66: '凍雨',
        67: '強凍雨',
        71: '小雪',
        73: '中雪',
        75: '大雪',
        77: '雪粒',
        80: '微陣雨',
        81: '陣雨',
        82: '強陣雨',
        85: '小雪陣雨',
        86: '大雪陣雨',
        95: '雷雨',
        96: '雷雨伴有冰雹',
        99: '強烈雷雨伴有冰雹'
    };
    return weatherMap[code] || '未知';
}

function getOpenMeteoIcon(code, hour) {
    // Determine day or night (simplistic: 6 to 18 is day)
    const isDay = (hour >= 6 && hour < 18) ? 1 : 0;
    
    // Mapping to standard weather icons or open-meteo assets
    const iconBase = "https://basmilius.github.io/weather-icons/production/fill/all/";
    
    switch (code) {
        case 0: return isDay ? `${iconBase}clear-day.svg` : `${iconBase}clear-night.svg`;
        case 1:
        case 2: return isDay ? `${iconBase}partly-cloudy-day.svg` : `${iconBase}partly-cloudy-night.svg`;
        case 3: return `${iconBase}overcast.svg`;
        case 45:
        case 48: return `${iconBase}fog.svg`;
        case 51:
        case 53:
        case 55:
        case 56:
        case 57: return `${iconBase}drizzle.svg`;
        case 61:
        case 63:
        case 80: return `${iconBase}rain.svg`;
        case 65:
        case 81:
        case 82: return `${iconBase}extreme-rain.svg`;
        case 71:
        case 73:
        case 75:
        case 77:
        case 85:
        case 86: return `${iconBase}snow.svg`;
        case 95:
        case 96:
        case 99: return `${iconBase}thunderstorms.svg`;
        default: return isDay ? `${iconBase}clear-day.svg` : `${iconBase}clear-night.svg`;
    }
}

// Initialize Leaflet Map
function initMap() {
    const map = L.map('map', {
        zoomControl: false,
        attributionControl: false
    }).setView([LAT, LON], 12);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19
    }).addTo(map);

    // Add marker for Macau
    L.marker([LAT, LON]).addTo(map)
        .bindPopup('<b>澳門</b><br>民間氣象台觀測點')
        .openPopup();
}

async function fetchWeatherData() {
    try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,relative_humidity_2m,precipitation_probability,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,relative_humidity_2m_max,relative_humidity_2m_min&timezone=Asia/Macau`;
        
        const response = await fetch(url);
        if (!response.ok) throw new Error('網絡請求失敗');
        const data = await response.json();

        updateCurrentWeather(data);
        updateHourlyWeather(data);
        updateDailyForecast(data);

        // Update Header Time
        const now = new Date();
        document.getElementById('update-time').innerText = `最後更新: ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

    } catch (err) {
        console.error("獲取天氣數據出錯：", err);
        document.getElementById('current-condition').innerText = '天氣數據載入失敗';
    }
}

function updateCurrentWeather(data) {
    const current = data.current;
    const hourly = data.hourly;
    const daily = data.daily;

    const temp = Math.round(current.temperature_2m);
    const code = current.weather_code;
    const isDay = current.is_day;
    const humidity = current.relative_humidity_2m;
    const windSpeed = current.wind_speed_10m;

    document.getElementById('current-temp').innerText = temp;
    document.getElementById('current-condition').innerText = getWmoWeatherText(code);
    document.getElementById('current-icon').src = getOpenMeteoIcon(code, new Date().getHours());
    document.getElementById('current-humidity').innerText = `相對濕度：${humidity}%`;
    document.getElementById('current-wind').innerText = `風速：${windSpeed} km/h`;

    // Requirement 4: Show today's temperature range instead of feels-like temperature
    if (daily && daily.temperature_2m_max && daily.temperature_2m_min) {
        const todayMax = Math.round(daily.temperature_2m_max[0]);
        const todayMin = Math.round(daily.temperature_2m_min[0]);
        document.getElementById('today-temp-range').innerText = `今日氣溫：${todayMin} ~ ${todayMax} °C`;
    }

    // Find current hour index to check next 1 hour weather change and precipitation probability
    const nowIso = new Date().toISOString().slice(0, 13); // e.g. "2026-08-30T13"
    let currentIndex = hourly.time.findIndex(t => t.startsWith(nowIso));
    if (currentIndex === -1) currentIndex = 0;

    // Requirement 5: Weather change in the next 1 hour (arrow + next forecast weather icon)
    const changeBox = document.getElementById('weather-change-box');
    const nextHourIcon = document.getElementById('next-hour-icon');
    if (currentIndex + 1 < hourly.weather_code.length) {
        const nextCode = hourly.weather_code[currentIndex + 1];
        const nextHourTime = new Date(hourly.time[currentIndex + 1]).getHours();
        if (nextCode !== code) {
            nextHourIcon.src = getOpenMeteoIcon(nextCode, nextHourTime);
            changeBox.style.display = 'flex';
        } else {
            changeBox.style.display = 'none';
        }
    }

    // Requirement 1: 臨近降雨提示 box if probability >= 中等
    // We check precipitation probability in the next 1-3 hours
    let maxNextProb = 0;
    for (let i = currentIndex; i < Math.min(currentIndex + 3, hourly.precipitation_probability.length); i++) {
        if (hourly.precipitation_probability[i] > maxNextProb) {
            maxNextProb = hourly.precipitation_probability[i];
        }
    }

    const promptBox = document.getElementById('precipitation-prompt-box');
    const promptText = document.getElementById('precipitation-prompt-text');

    // In Open-Meteo, precipitation_probability ranges from 0 to 100%. 
    // "中等" probability threshold can be defined as >= 40% or 50%
    if (maxNextProb >= 40) {
        let levelStr = maxNextProb >= 70 ? '高' : '中等';
        promptText.innerText = `臨近降雨提示：未來數小時降雨機率達 ${maxNextProb}% (${levelStr})，請攜帶雨具。`;
        promptBox.classList.add('active');
    } else {
        promptBox.classList.remove('active');
    }
}

function updateHourlyWeather(data) {
    const container = document.getElementById('hourly-container');
    const loadingEl = document.getElementById('hourly-loading');
    const errorEl = document.getElementById('hourly-error');

    try {
        const hourly = data.hourly;
        const nowIso = new Date().toISOString().slice(0, 13);
        let startIndex = hourly.time.findIndex(t => t.startsWith(nowIso));
        if (startIndex === -1) startIndex = 0;

        let html = '';
        // Show next 24 hours
        for (let i = startIndex; i < startIndex + 24 && i < hourly.time.length; i++) {
            const timeStr = hourly.time[i];
            const dateObj = new Date(timeStr);
            const hourLabel = `${dateObj.getHours().toString().padStart(2, '0')}:00`;
            const temp = Math.round(hourly.temperature_2m[i]);
            const code = hourly.weather_code[i];
            const pop = hourly.precipitation_probability ? hourly.precipitation_probability[i] : 0;
            const iconUrl = getOpenMeteoIcon(code, dateObj.getHours());

            html += `
                <div class="hourly-card">
                    <div class="hourly-time">${hourLabel}</div>
                    <img class="hourly-icon" src="${iconUrl}" alt="weather-icon">
                    <div class="hourly-temp">${temp}°C</div>
                    <div class="hourly-pop">${pop}%</div>
                </div>
            `;
        }

        if (loadingEl) loadingEl.style.display = 'none';
        container.innerHTML = html;
    } catch (err) {
        console.error("整點數據載入失敗：", err);
        if (loadingEl) loadingEl.style.display = 'none';
        if (errorEl) errorEl.style.display = 'block';
    }
}

function updateDailyForecast(data) {
    const containerEl = document.getElementById('forecast-container');
    const loadingEl = document.getElementById('forecast-loading');
    const errorEl = document.getElementById('forecast-error');

    try {
        const daily = data.daily;
        let html = '';

        const todayDate = new Date();

        for (let i = 0; i < daily.time.length; i++) {
            const dateStr = daily.time[i];
            const targetDate = new Date(dateStr);
            
            // Requirement 3: Show exact date instead of general labels
            const month = targetDate.getMonth() + 1;
            const day = targetDate.getDate();
            
            let labelStr = `${month}月${day}日`;
            const diffDays = Math.round((targetDate - new Date(todayDate.toDateString())) / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) {
                labelStr += ' (今日)';
            } else if (diffDays === 1) {
                labelStr += ' (明日)';
            }

            const maxT = Math.round(daily.temperature_2m_max[i]);
            const minT = Math.round(daily.temperature_2m_min[i]);
            const maxH = daily.relative_humidity_2m_max ? Math.round(daily.relative_humidity_2m_max[i]) : 95;
            const minH = daily.relative_humidity_2m_min ? Math.round(daily.relative_humidity_2m_min[i]) : 60;
            const code = daily.weather_code[i];

            const conditionStr = getWmoWeatherText(code);
            const iconUrl = getOpenMeteoIcon(code, 12);

            html += `
                <div class="forecast-card-mini">
                    <div class="card-top">${labelStr}</div>
                    <div class="card-middle">
                        <img class="card-icon-large" src="${iconUrl}" alt="weather-icon">
                        <div class="temp-range-text">${minT} - ${maxT} °C</div>
                        <div class="humid-range-text">${minH} - ${maxH} %</div>
                    </div>
                    <div class="card-bottom">
                        <div class="card-condition">${conditionStr}</div>
                    </div>
                </div>
            `;
        }

        if (loadingEl) loadingEl.style.display = 'none';
        containerEl.innerHTML = html;

    } catch (err) {
        console.error("七日預報數據載入失敗：", err);
        if (loadingEl) loadingEl.style.display = 'none';
        if (errorEl) errorEl.style.display = 'block';
    }
}

window.addEventListener('DOMContentLoaded', () => {
    initMap();
    fetchWeatherData();
});
</script>

</body>
</html>
