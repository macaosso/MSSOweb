<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時天氣 - SMG Style</title>
  <style>
    :root {
      --bg-color: #f2f4f7;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-sub: #7f8c8d;
      --accent-blue: #eef7fe;
      --accent-orange: #fdf2e9;
      --border-radius: 16px;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    /* Main Weather Section */
    .header-location {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .header-condition {
      color: var(--text-sub);
      font-size: 14px;
      margin-bottom: 12px;
    }

    .temp-display {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 16px;
    }

    .temp-current {
      font-size: 56px;
      font-weight: 300;
      line-height: 1;
    }

    .temp-range {
      color: var(--text-sub);
      font-size: 13px;
    }

    .grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .metric-box {
      background: #f8fafc;
      border-radius: 12px;
      padding: 12px;
    }

    .metric-label {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .metric-val {
      font-size: 16px;
      font-weight: 600;
    }

    /* Forecast Summary Box */
    .summary-card {
      background: var(--accent-blue);
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.6;
      color: #34495e;
    }

    /* Sun & Moon Grid */
    .sun-moon-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .astro-box {
      background: var(--accent-orange);
      border-radius: 12px;
      padding: 12px;
    }

    .astro-title {
      font-size: 12px;
      color: #d35400;
      margin-bottom: 4px;
    }

    .astro-time {
      font-size: 20px;
      font-weight: bold;
      color: #e67e22;
    }

    /* 7-Day Forecast Table */
    .forecast-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #edf2f7;
      font-size: 14px;
    }

    .forecast-row:last-child {
      border-bottom: none;
    }

    .forecast-date {
      width: 90px;
      font-weight: 500;
    }

    .forecast-temp {
      color: var(--text-sub);
    }
  </style>
</head>
<body>

<div class="app-container">

  <div class="card">
    <div class="header-location" id="location">望德堂區</div>
    <div class="header-condition" id="weather-desc">載入中...</div>
    
    <div class="temp-display">
      <div class="temp-current" id="current-temp">--°</div>
      <div class="temp-range">
        最低 <span id="min-temp">--</span>° · 最高 <span id="max-temp">--</span>°
      </div>
    </div>

    <div class="grid-2x2">
      <div class="metric-box">
        <div class="metric-label">濕度</div>
        <div class="metric-val" id="humidity">--%</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">風速</div>
        <div class="metric-val" id="wind-speed">-- km/h</div>
      </div>
    </div>

    <div class="summary-card" style="margin-top: 12px;">
      <strong>今日天氣概況</strong><br>
      預測今日氣溫介乎 <span id="summary-min">--</span> 至 <span id="summary-max">--</span> 度之間。相對濕度為 <span id="summary-humidity">--</span>%。
    </div>
  </div>

  <div class="card">
    <div style="font-weight: bold; margin-bottom: 12px; font-size: 15px;">日出日落</div>
    <div class="sun-moon-grid">
      <div class="astro-box">
        <div class="astro-title">日出</div>
        <div class="astro-time" id="sunrise">--:--</div>
      </div>
      <div class="astro-box">
        <div class="astro-title">日落</div>
        <div class="astro-time" id="sunset">--:--</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div style="font-weight: bold; margin-bottom: 8px; font-size: 15px;">七日預報</div>
    <div id="forecast-list"></div>
  </div>

</div>

<script>
  // Macao Coordinates (São Lazaro / 望德堂區)
  const LAT = 22.1982;
  const LON = 113.5439;

  const WMO_CODES = {
    0: '晴朗', 1: '大致天晴', 2: '多雲', 3: '密雲',
    45: '有霧', 48: '霧',
    51: '微雨', 53: '毛毛雨', 55: '密雨',
    61: '小雨', 63: '中雨', 65: '大雨',
    80: '陣雨', 81: '局部地區陣雨', 82: '暴雨',
    95: '雷暴', 96: '雷暴伴隨小雹', 99: '雷暴伴隨大雹'
  };

  async function fetchWeatherData() {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=Asia%2FMacau`;

    try {
      const response = await fetch(url);
      const data = await response.json();
      
      // Update Current Weather
      document.getElementById('current-temp').innerText = Math.round(data.current.temperature_2m) + '°';
      document.getElementById('humidity').innerText = data.current.relative_humidity_2m + '%';
      document.getElementById('wind-speed').innerText = Math.round(data.current.wind_speed_10m) + ' km/h';
      document.getElementById('weather-desc').innerText = WMO_CODES[data.current.weather_code] || '多雲';

      // Update Today's Extremes
      const todayMin = Math.round(data.daily.temperature_2m_min[0]);
      const todayMax = Math.round(data.daily.temperature_2m_max[0]);
      document.getElementById('min-temp').innerText = todayMin;
      document.getElementById('max-temp').innerText = todayMax;
      document.getElementById('summary-min').innerText = todayMin;
      document.getElementById('summary-max').innerText = todayMax;
      document.getElementById('summary-humidity').innerText = data.current.relative_humidity_2m;

      // Update Astronomy
      document.getElementById('sunrise').innerText = data.daily.sunrise[0].split('T')[1];
      document.getElementById('sunset').innerText = data.daily.sunset[0].split('T')[1];

      // Render 7-Day Forecast
      const forecastContainer = document.getElementById('forecast-list');
      forecastContainer.innerHTML = '';

      for (let i = 0; i < 7; i++) {
        const dateStr = data.daily.time[i];
        const dateObj = new Date(dateStr);
        const monthDay = `${(dateObj.getMonth() + 1).toString().padStart(2, '0')}-${dateObj.getDate().toString().padStart(2, '0')}`;
        const dayName = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'][dateObj.getDay()];
        
        const min = Math.round(data.daily.temperature_2m_min[i]);
        const max = Math.round(data.daily.temperature_2m_max[i]);
        const code = data.daily.weather_code[i];

        const row = document.createElement('div');
        row.className = 'forecast-row';
        row.innerHTML = `
          <div class="forecast-date">${monthDay} ${dayName}</div>
          <div>${WMO_CODES[code] || '多雲'}</div>
          <div class="forecast-temp">${min}° - ${max}°</div>
        `;
        forecastContainer.appendChild(row);
      }

    } catch (err) {
      console.error('Error fetching weather data:', err);
      document.getElementById('weather-desc').innerText = '無法載入天氣數據';
    }
  }

  fetchWeatherData();
</script>

</body>
</html>
