<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<title>熱帶氣旋路徑追蹤器 - MET WARN x MSSO</title>
<style>
:root {
  --bg-dark: #0b0f19;
  --bg-panel: #121826;
  --card-bg: #1a2235;
  --card-border: rgba(255, 255, 255, 0.08);
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --accent-blue: #38bdf8;
  
  /* 風暴強度顏色 */
  --c-low: #94a3b8;
  --c-td: #38bdf8;
  --c-ts: #2dd4bf;
  --c-sts: #facc15;
  --c-t: #f59e0b;
  --c-st: #ef4444;
  --c-supert: #c084fc;
  --c-extc: #64748b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-main);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ========== 1. 頂部工具列 ========== */
.top-header {
  background: #0f1523;
  border-bottom: 1px solid var(--card-border);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 2000;
  gap: 12px;
}
.brand-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--accent-blue);
  white-space: nowrap;
}
.brand-title span { font-size: 0.75rem; color: var(--text-muted); font-weight: normal; }

.header-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.ctrl-btn, .ctrl-select {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--card-border);
  color: var(--text-main);
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 0.82rem;
  cursor: pointer;
  outline: none;
}
.ctrl-btn:hover, .ctrl-select:hover { background: rgba(255, 255, 255, 0.12); }
.ctrl-btn.active { background: #0284c7; border-color: var(--accent-blue); }

/* ========== 2. 主區域佈局 ========== */
.main-container {
  display: flex;
  flex: 1;
  position: relative;
  overflow: hidden;
}

/* 左側地圖容器 */
#map-wrapper {
  flex: 1;
  position: relative;
  height: 100%;
}
#map {
  width: 100%;
  height: 100%;
  background: #090d16;
}

/* 地圖右上角：活躍風暴快速切換框 */
.map-overlay-topright {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 1000;
  background: rgba(15, 21, 35, 0.88);
  backdrop-filter: blur(8px);
  border: 1px solid var(--card-border);
  border-radius: 8px;
  padding: 10px;
  width: 280px;
}
.overlay-storm-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
  font-size: 0.82rem;
}
.overlay-storm-item:last-child { margin-bottom: 0; }
.btn-mini {
  background: var(--accent-blue);
  color: #000;
  border: none;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: bold;
  cursor: pointer;
}

/* 地圖左下角：強度圖例 */
.map-legend {
  position: absolute;
  bottom: 24px;
  left: 12px;
  z-index: 1000;
  background: rgba(15, 21, 35, 0.88);
  backdrop-filter: blur(8px);
  border: 1px solid var(--card-border);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 0.78rem;
}
.legend-title { font-weight: bold; margin-bottom: 6px; color: var(--text-muted); }
.legend-grid { display: flex; flex-direction: column; gap: 3px; }
.legend-item { display: flex; align-items: center; gap: 8px; }
.legend-color { width: 14px; height: 3px; border-radius: 2px; }

/* 右側側邊欄 ========== */
.sidebar {
  width: 360px;
  background: var(--bg-panel);
  border-left: 1px solid var(--card-border);
  display: flex;
  flex-direction: column;
  z-index: 1000;
  overflow-y: auto;
}
.sidebar-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--card-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.9rem;
  font-weight: bold;
  background: rgba(0,0,0,0.15);
}
.sidebar-content { padding: 12px; display: flex; flex-direction: column; gap: 12px; }

/* 颱風卡片 */
.tc-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 8px;
  padding: 12px;
}
.tc-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.tc-title { font-size: 1.05rem; font-weight: bold; display: flex; align-items: center; gap: 6px; }

.badge-tag {
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 0.72rem;
  font-weight: bold;
  color: #fff;
}

.tc-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  background: rgba(0,0,0,0.2);
  padding: 8px;
  border-radius: 6px;
  font-size: 0.8rem;
  margin-bottom: 8px;
}
.tc-grid-item label { color: var(--text-muted); display: block; font-size: 0.72rem; }
.tc-grid-item val { font-weight: 600; }

/* 預測時間軸 */
.forecast-list { font-size: 0.78rem; display: flex; flex-direction: column; gap: 4px; }
.forecast-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 3px 6px;
  background: rgba(255,255,255,0.02);
  border-radius: 4px;
}

/* 地圖標記自訂風格 */
.tc-map-label {
  background: #ef4444;
  color: #fff;
  font-weight: bold;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  border: 1px solid #ffffff;
  box-shadow: 0 0 10px rgba(0,0,0,0.5);
  white-space: nowrap;
}
</style>
</head>

<body>

<!-- 1. 頂部導航列 -->
<div class="top-header">
  <div class="brand-title">
    ⚡ 熱帶氣旋路徑追蹤器
    <span>MET WARN × MSSO</span>
  </div>
  <div class="header-controls">
    <select class="ctrl-select" id="yearSelect"><option>2026</option></select>
    <button class="ctrl-btn active" id="btnRing" onclick="toggleDistanceRing()">500公里圈</button>
    <button class="ctrl-btn" onclick="resetView()">重置視角</button>
    <button class="ctrl-btn" onclick="loadTCData()">立即刷新</button>
  </div>
</div>

<!-- 2. 主內容區 -->
<div class="main-container">
  
  <!-- 左側地圖 -->
  <div id="map-wrapper">
    <div id="map"></div>

    <!-- 地圖右上：風暴快捷選單 -->
    <div class="map-overlay-topright" id="mapQuickSelect">
      <div style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: 6px;">活躍熱帶氣旋</div>
      <div id="quickSelectList">載入中...</div>
    </div>

    <!-- 地圖左下：圖例 -->
    <div class="map-legend">
      <div class="legend-title">熱帶氣旋強度</div>
      <div class="legend-grid">
        <div class="legend-item"><div class="legend-color" style="background:var(--c-low)"></div>低壓區 LOW</div>
        <div class="legend-item"><div class="legend-color" style="background:var(--c-td)"></div>熱帶低氣壓 TD</div>
        <div class="legend-item"><div class="legend-color" style="background:var(--c-ts)"></div>熱帶風暴 TS</div>
        <div class="legend-item"><div class="legend-color" style="background:var(--c-sts)"></div>強烈熱帶風暴 STS</div>
        <div class="legend-item"><div class="legend-color" style="background:var(--c-t)"></div>颱風 T</div>
        <div class="legend-item"><div class="legend-color" style="background:var(--c-st)"></div>強颱風 ST</div>
        <div class="legend-item"><div class="legend-color" style="background:var(--c-supert)"></div>超強颱風 SuperT</div>
      </div>
    </div>
  </div>

  <!-- 右側詳細資訊欄 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span>風暴追蹤</span>
      <span id="updateClock" style="font-size: 0.75rem; color: var(--text-muted);">更新中...</span>
    </div>
    <div class="sidebar-content" id="sidebarCards">
      <!-- 動態插入熱帶氣旋卡片 -->
    </div>
  </div>

</div>

<script>
// ========== 全局變量與香港/澳門座標 ==========
const HK_COORDS = [22.3193, 114.1694];
let map, distanceRingLayer = null;
let mapLayers = [];

// 強度顏色映射表
const INTENSITY_CONFIG = {
  'LOW': { name: '低壓區', color: 'var(--c-low)' },
  'TD': { name: '熱帶低氣壓', color: 'var(--c-td)' },
  'TS': { name: '熱帶風暴', color: 'var(--c-ts)' },
  'STS': { name: '強烈熱帶風暴', color: 'var(--c-sts)' },
  'T': { name: '颱風', color: 'var(--c-t)' },
  'ST': { name: '強颱風', color: 'var(--c-st)' },
  'SuperT': { name: '超強颱風', color: 'var(--c-supert)' }
};

// ========== 初始化地圖 ==========
function initMap() {
  map = L.map('map', { zoomControl: false }).setView([20.0, 118.0], 6);
  
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap &copy; CARTO'
  }).addTo(map);

  L.control.zoom({ position: 'topleft' }).addTo(map);
  toggleDistanceRing();
}

function toggleDistanceRing() {
  const btn = document.getElementById('btnRing');
  if (distanceRingLayer) {
    map.removeLayer(distanceRingLayer);
    distanceRingLayer = null;
    btn.classList.remove('active');
  } else {
    distanceRingLayer = L.circle(HK_COORDS, {
      radius: 500000,
      color: '#ffffff',
      weight: 1,
      dashArray: '4, 6',
      fill: false,
      opacity: 0.4
    }).addTo(map);
    btn.classList.add('active');
  }
}

function resetView() {
  map.setView([20.0, 118.0], 6);
}

function calcDistance(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

// 解析帶有字母方向的座標字串（如 "19.50N", "144.90E"）
function parseCoord(valStr) {
  if (!valStr) return NaN;
  const cleanStr = valStr.trim();
  let num = parseFloat(cleanStr);
  if (isNaN(num)) return NaN;
  if (cleanStr.endsWith('S') || cleanStr.endsWith('W')) {
    num = -Math.abs(num);
  }
  return num;
}

function getCategoryKey(catStr) {
  if (!catStr) return 'TD';
  const upper = catStr.toUpperCase();
  if (upper.includes('SUPER')) return 'SuperT';
  if (upper.includes('SEVERE TYPHOON') || upper.includes('ST')) return 'ST';
  if (upper.includes('SEVERE TROPICAL') || upper.includes('STS')) return 'STS';
  if (upper.includes('TYPHOON') || upper.includes('T')) return 'T';
  if (upper.includes('TROPICAL STORM') || upper.includes('TS')) return 'TS';
  if (upper.includes('LOW')) return 'LOW';
  return 'TD';
}

function clearMapLayers() {
  mapLayers.forEach(l => map.removeLayer(l));
  mapLayers = [];
}

// ========== 兩階段數據讀取與 XML 解析 ==========
async function loadTCData() {
  const updateClock = document.getElementById('updateClock');
  updateClock.textContent = "更新時間：" + new Date().toLocaleTimeString('zh-HK', {hour: '2-digit', minute:'2-digit'});

  const indexUrl = "https://www.weather.gov.hk/wxinfo/currwx/tc_list.xml";
  const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(indexUrl)}`;

  try {
    const res = await fetch(proxyUrl, { cache: 'no-store' });
    if (!res.ok) throw new Error("tc_list.xml 獲取失敗");
    const xmlText = await res.text();
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xmlText, "text/xml");

    const cyclones = Array.from(xmlDoc.querySelectorAll("TropicalCyclone"));

    if (cyclones.length === 0) {
      renderEmptyState();
      return;
    }

    clearMapLayers();
    const parsedTCList = [];

    for (const tc of cyclones) {
      const cName = tc.querySelector("TropicalCycloneChineseName")?.textContent || "";
      const eName = tc.querySelector("TropicalCycloneEnglishName")?.textContent || "";
      let trackUrl = tc.querySelector("TropicalCycloneURL")?.textContent || "";

      if (trackUrl.startsWith("http://")) trackUrl = trackUrl.replace("http://", "https://");

      try {
        const trackRes = await fetch(`https://corsproxy.io/?url=${encodeURIComponent(trackUrl)}`, { cache: 'no-store' });
        if (!trackRes.ok) continue;
        const trackXmlText = await trackRes.text();
        const trackXml = parser.parseFromString(trackXmlText, "text/xml");

        const xmlNameNode = trackXml.querySelector("TropicalCycloneName");
        const stormName = cName || eName || (xmlNameNode ? xmlNameNode.textContent.trim() : "熱帶氣旋");

        // 1. 解析歷史定位 (PastInformation)
        const pastNodes = Array.from(trackXml.querySelectorAll("PastInformation, PointData, TrackPoint"));
        const pastPoints = [];
        pastNodes.forEach(pt => {
          const lat = parseCoord(pt.querySelector("Latitude, lat, Lat")?.textContent);
          const lon = parseCoord(pt.querySelector("Longitude, lon, Long, Lng")?.textContent);
          const wind = pt.querySelector("MaximumWind, MaxWind, WindSpeed")?.textContent || "--";
          const cat = pt.querySelector("Intensity, IntensityCategory, Category")?.textContent || "TD";
          const time = pt.querySelector("Time")?.textContent || "";

          if (!isNaN(lat) && !isNaN(lon)) {
            pastPoints.push({ lat, lon, wind, cat: getCategoryKey(cat), time });
          }
        });

        // 2. 解析預測定位 (ForecastInformation)
        const forecastNodes = Array.from(trackXml.querySelectorAll("ForecastInformation"));
        const forecastPoints = [];
        const lastPastCat = pastPoints.length > 0 ? pastPoints[pastPoints.length - 1].cat : "TD";

        forecastNodes.forEach(pt => {
          const lat = parseCoord(pt.querySelector("Latitude, lat, Lat")?.textContent);
          const lon = parseCoord(pt.querySelector("Longitude, lon, Long, Lng")?.textContent);
          const wind = pt.querySelector("MaximumWind, MaxWind, WindSpeed")?.textContent || "--";
          const rawCat = pt.querySelector("Intensity, IntensityCategory, Category")?.textContent;
          const cat = rawCat ? getCategoryKey(rawCat) : lastPastCat;
          const time = pt.querySelector("Time")?.textContent || "";

          if (!isNaN(lat) && !isNaN(lon)) {
            forecastPoints.push({ lat, lon, wind, cat, time });
          }
        });

        parsedTCList.push({
          name: stormName,
          englishName: eName,
          pastPoints,
          forecastPoints
        });

      } catch (e) {
        console.error("個別風暴路徑解析失敗:", e);
      }
    }

    if (parsedTCList.length > 0) {
      renderTCs(parsedTCList);
    } else {
      renderEmptyState();
    }

  } catch (err) {
    console.error("實時數據更新失敗:", err);
    document.getElementById('quickSelectList').innerHTML = "<div style='font-size:0.78rem; color:#ef4444;'>連線中斷或獲取失敗</div>";
    document.getElementById('sidebarCards').innerHTML = "<div style='text-align:center; padding:20px; color:#ef4444; font-size:0.88rem;'>無法連線至香港天文台數據源</div>";
  }
}

// 渲染熱帶氣旋（地圖繪製與側邊欄卡片生成）
function renderTCs(tcList) {
  clearMapLayers();
  
  const quickSelectEl = document.getElementById('quickSelectList');
  const sidebarEl = document.getElementById('sidebarCards');
  quickSelectEl.innerHTML = "";
  sidebarEl.innerHTML = "";

  tcList.forEach(tc => {
    const currentPt = tc.pastPoints[tc.pastPoints.length - 1] || tc.forecastPoints[0];
    if (!currentPt) return;

    const catInfo = INTENSITY_CONFIG[currentPt.cat] || INTENSITY_CONFIG['TD'];
    const dist = calcDistance(currentPt.lat, currentPt.lon, HK_COORDS[0], HK_COORDS[1]);

    // 1. 右上角風暴快選欄
    const qsItem = document.createElement('div');
    qsItem.className = 'overlay-storm-item';
    qsItem.innerHTML = `
      <span><strong style="color:${catInfo.color}">● ${catInfo.name}</strong> ${tc.name}</span>
      <button class="btn-mini" onclick="focusStorm(${currentPt.lat}, ${currentPt.lon})">聚焦</button>
    `;
    quickSelectEl.appendChild(qsItem);

    // 2. 側邊欄卡片 (展示預測終點/主要預測節點)
    const displayFcstPoints = tc.forecastPoints.filter(fp => fp.wind !== '--' || fp.time !== '');
    const sidebarFcstList = displayFcstPoints.length > 0 ? displayFcstPoints : tc.forecastPoints.slice(-4);

    const card = document.createElement('div');
    card.className = 'tc-card';
    card.innerHTML = `
      <div class="tc-card-header">
        <div class="tc-title">
          <span class="badge-tag" style="background:${catInfo.color}">${catInfo.name}</span>
          ${tc.name} ${tc.englishName ? `(${tc.englishName})` : ''}
        </div>
      </div>
      <div class="tc-grid">
        <div class="tc-grid-item"><label>最新位置</label><val>${currentPt.lat.toFixed(2)}°N ${currentPt.lon.toFixed(2)}°E</val></div>
        <div class="tc-grid-item"><label>與香港距離</label><val>${dist} km</val></div>
        <div class="tc-grid-item"><label>中心風速</label><val>${currentPt.wind}</val></div>
        <div class="tc-grid-item"><label>預計最近距離</label><val>${dist} km</val></div>
      </div>
      <div class="forecast-list">
        ${sidebarFcstList.map((fp) => {
          const fCat = INTENSITY_CONFIG[fp.cat] || INTENSITY_CONFIG['TD'];
          const timeLabel = fp.time ? new Date(fp.time).toLocaleDateString('zh-HK', {month:'numeric', day:'numeric', hour:'2-digit'}) : '預測點';
          return `
            <div class="forecast-row">
              <span>${timeLabel}</span>
              <span class="badge-tag" style="background:${fCat.color}">${fCat.name}</span>
              <span>${fp.wind}</span>
            </div>
          `;
        }).join('')}
      </div>
    `;
    sidebarEl.appendChild(card);

    // 3. 地圖繪製 - 歷史路徑 (實線 + 圓點)
    if (tc.pastPoints.length > 0) {
      const pastCoords = tc.pastPoints.map(p => [p.lat, p.lon]);
      const pastLine = L.polyline(pastCoords, { color: '#ffffff', weight: 2, opacity: 0.8 }).addTo(map);
      mapLayers.push(pastLine);

      tc.pastPoints.forEach(p => {
        const pCat = INTENSITY_CONFIG[p.cat] || INTENSITY_CONFIG['TD'];
        const circle = L.circleMarker([p.lat, p.lon], {
          radius: 4,
          fillColor: pCat.color,
          color: '#fff',
          weight: 1,
          fillOpacity: 1
        }).addTo(map);
        mapLayers.push(circle);
      });
    }

    // 預測路徑 (黃色虛線 + 亮點)
    if (tc.forecastPoints.length > 0) {
      const fcCoords = [ [currentPt.lat, currentPt.lon], ...tc.forecastPoints.map(p => [p.lat, p.lon]) ];
      const fcLine = L.polyline(fcCoords, { color: '#facc15', weight: 2, dashArray: '5, 8' }).addTo(map);
      mapLayers.push(fcLine);

      tc.forecastPoints.forEach(p => {
        const fCat = INTENSITY_CONFIG[p.cat] || INTENSITY_CONFIG['TD'];
        const fcCircle = L.circleMarker([p.lat, p.lon], {
          radius: 3,
          fillColor: fCat.color,
          color: '#facc15',
          weight: 1,
          fillOpacity: 0.8
        }).addTo(map);
        mapLayers.push(fcCircle);
      });
    }

    // 最新中心位置亮點
    const currentMarker = L.circleMarker([currentPt.lat, currentPt.lon], {
      radius: 7,
      fillColor: catInfo.color,
      color: '#ffffff',
      weight: 2,
      fillOpacity: 1
    }).addTo(map);
    mapLayers.push(currentMarker);

    // 地圖風暴名稱標籤
    const nameLabel = L.marker([currentPt.lat, currentPt.lon], {
      icon: L.divIcon({
        className: 'tc-map-label',
        html: tc.name,
        iconAnchor: [-10, 10]
      })
    }).addTo(map);
    mapLayers.push(nameLabel);
  });
}

function focusStorm(lat, lon) {
  map.flyTo([lat, lon], 7, { duration: 1.2 });
}

function renderEmptyState() {
  document.getElementById('quickSelectList').innerHTML = "<div style='font-size:0.78rem;'>當前無活躍熱帶氣旋</div>";
  document.getElementById('sidebarCards').innerHTML = "<div style='text-align:center; padding:20px; color:var(--text-muted); font-size:0.88rem;'>西北太平洋及南海當前無活躍熱帶氣旋系統</div>";
}

// ========== 頁面初始化與自動更新 (Auto-Update) ==========
window.addEventListener('DOMContentLoaded', () => {
  initMap();
  loadTCData();

  // 每 5 分鐘 (300,000 毫秒) 自動重新讀取實時數據
  setInterval(loadTCData, 300000);
});
</script>
</body>
</html>
