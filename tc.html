<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<link rel="icon" type="image/png" href="icons/MSSO.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<title>澳門民間氣象台 - 首頁</title>
<style>
/* ========== 1. 深太空 (Deep Space) 全域主題基礎 ========== */
:root {
  --bg-dark: #0b0f19;
  --card-bg: rgba(22, 30, 46, 0.75);
  --card-bg-light: rgba(255, 255, 255, 0.03);
  --card-border: rgba(255, 255, 255, 0.08);
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  
  --accent-blue: #38bdf8;
  --accent-teal: #2dd4bf;
  --accent-green: #34d399;
  --accent-yellow: #facc15;
  --accent-orange: #f59e0b;
  --accent-red: #ef4444;
  --accent-purple: #c084fc;

  --bg-red: rgba(239, 68, 68, 0.12);
  --border-red: rgba(239, 68, 68, 0.35);
  --bg-orange: rgba(245, 158, 11, 0.12);
  --border-orange: rgba(245, 158, 11, 0.35);
}

/* ========== 明亮主題 (Light Theme) ========== */
body.light-theme {
  --bg-dark: #f8fafc;
  --card-bg: rgba(255, 255, 255, 0.85);
  --card-bg-light: rgba(0, 0, 0, 0.04);
  --card-border: rgba(0, 0, 0, 0.12);
  --text-main: #0f172a;
  --text-muted: #64748b;

  --accent-blue: #0284c7;
  --accent-teal: #0d9488;
  --accent-green: #059669;
  --accent-yellow: #d97706;
  --accent-orange: #d97706;
  --accent-red: #dc2626;
  --accent-purple: #9333ea;

  --bg-red: rgba(239, 68, 68, 0.08);
  --border-red: rgba(239, 68, 68, 0.25);
  --bg-orange: rgba(245, 158, 11, 0.08);
  --border-orange: rgba(245, 158, 11, 0.25);
}

html {
  scroll-behavior: smooth;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-main);
  line-height: 1.6;
  transition: background-color 0.3s ease, color 0.3s ease;
}

/* 頁面最大寬度容器 */
.page-wrapper {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 15px 80px 15px;
}

/* ========== 2. 頁頭 Header & 頂欄導航 ========== */
.header-nav-container {
  position: sticky;
  top: 0;
  z-index: 3000;
  background: rgba(11, 15, 25, 0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--card-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 1.5rem;
  margin-bottom: 20px;
  transition: background 0.3s ease;
}
body.light-theme .header-nav-container {
  background: rgba(248, 250, 252, 0.88);
}

.header {
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo {
  height: 38px;
  width: auto;
  filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.3));
}
.title {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--accent-blue);
  letter-spacing: 0.5px;
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.header-clock {
  font-size: 0.88rem;
  font-weight: 500;
  color: var(--accent-teal);
  font-variant-numeric: tabular-nums;
  opacity: 0.9;
}

.menu-container {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* 主題切換按鈕 */
.theme-toggle-btn {
  background: var(--card-bg-light);
  border: 1px solid var(--card-border);
  color: var(--text-main);
  padding: 8px 12px;
  border-radius: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.25s ease;
  outline: none;
}
.theme-toggle-btn:hover {
  border-color: var(--accent-blue);
  color: var(--accent-blue);
  transform: translateY(-1px);
}
.sun-icon {
  display: block;
}
.moon-icon {
  display: none;
}
body.light-theme .sun-icon {
  display: none;
}
body.light-theme .moon-icon {
  display: block;
}

.menu-toggle {
  display: none;
  font-size: 22px;
  padding: 6px 12px;
  cursor: pointer;
  background: var(--card-bg-light);
  border: 1px solid var(--card-border);
  color: var(--text-main);
  border-radius: 8px;
  transition: all 0.2s;
}
.menu-toggle:hover {
  border-color: var(--accent-blue);
}
.menu-toggle.active {
  border-color: var(--accent-blue);
  background: rgba(56, 189, 248, 0.12);
}

.nav {
  display: flex;
  gap: 8px;
  align-items: center;
}
.nav a {
  color: var(--text-muted);
  padding: 8px 14px;
  font-size: 0.92rem;
  font-weight: 500;
  text-decoration: none;
  border-radius: 20px;
  transition: all 0.2s ease;
  display: block;
}
.nav a:hover {
  color: var(--text-main);
  background: rgba(255, 255, 255, 0.05);
}
body.light-theme .nav a:hover {
  background: rgba(0, 0, 0, 0.05);
}

/* ========== 下拉選單樣式 (Dropdown Style) ========== */
.dropdown {
  position: relative;
  display: inline-block;
}

.dropdown-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  padding: 8px 14px;
  font-size: 0.92rem;
  font-weight: 500;
  font-family: inherit;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 6px;
}

.dropdown-btn .arrow {
  font-size: 0.7rem;
  transition: transform 0.2s ease;
}

.dropdown:hover .dropdown-btn,
.dropdown.active .dropdown-btn {
  color: var(--text-main);
  background: rgba(255, 255, 255, 0.05);
}
body.light-theme .dropdown:hover .dropdown-btn,
body.light-theme .dropdown.active .dropdown-btn {
  background: rgba(0, 0, 0, 0.05);
}

.dropdown:hover .arrow,
.dropdown.active .arrow {
  transform: rotate(180deg);
}

.dropdown-content {
  position: absolute;
  top: 100%;
  left: 0;
  min-width: 190px;
  background: rgba(15, 23, 42, 0.95);
  backdrop-filter: blur(16px);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 6px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  z-index: 3100;
  margin-top: 4px;

  opacity: 0;
  visibility: hidden;
  transition: opacity 0.25s ease, visibility 0s linear 0.4s;
}

.dropdown-content::before {
  content: "";
  position: absolute;
  top: -8px;
  left: 0;
  width: 100%;
  height: 8px;
}

body.light-theme .dropdown-content {
  background: rgba(255, 255, 255, 0.98);
}

.dropdown:hover .dropdown-content,
.dropdown.active .dropdown-content {
  opacity: 1;
  visibility: visible;
  transition: opacity 0.25s ease, visibility 0s linear 0s;
}

.dropdown-content a {
  padding: 8px 12px;
  border-radius: 8px;
  white-space: nowrap;
  font-size: 0.88rem;
}

/* ========== 3. 首頁快捷鏈接模塊 ========== */
.quick-links {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin: 15px 0 25px 0;
  width: 100%;
}
.link-box {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px 10px;
  border-radius: 14px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  color: var(--text-main);
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  transition: all 0.25s ease;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.link-box.weather {
  background: linear-gradient(135deg, rgba(20, 83, 116, 0.35), rgba(15, 23, 42, 0.6));
  border-color: rgba(56, 189, 248, 0.3);
}
.link-box.flood {
  background: linear-gradient(135deg, rgba(13, 110, 110, 0.35), rgba(15, 23, 42, 0.6));
  border-color: rgba(45, 212, 191, 0.3);
}
.link-box.map {
  background: linear-gradient(135deg, rgba(88, 28, 135, 0.35), rgba(15, 23, 42, 0.6));
  border-color: rgba(192, 132, 252, 0.3);
}
body.light-theme .link-box.weather {
  background: linear-gradient(135deg, rgba(186, 230, 253, 0.5), rgba(255, 255, 255, 0.9));
}
body.light-theme .link-box.flood {
  background: linear-gradient(135deg, rgba(153, 246, 228, 0.5), rgba(255, 255, 255, 0.9));
}
body.light-theme .link-box.map {
  background: linear-gradient(135deg, rgba(233, 213, 255, 0.5), rgba(255, 255, 255, 0.9));
}
.link-box:hover {
  transform: translateY(-3px);
  border-color: var(--accent-blue);
  box-shadow: 0 6px 20px rgba(56, 189, 248, 0.2);
}

/* ========== 4. 警告卡片 ========== */
.warning-card {
  margin: 20px 0;
  border-radius: 16px;
  background: var(--bg-red);
  border: 1px solid var(--border-red);
  box-shadow: 0 6px 20px rgba(239, 68, 68, 0.1);
  overflow: hidden;
}
.warning-header {
  background: rgba(239, 68, 68, 0.25);
  color: #fca5a5;
  padding: 14px 20px;
  font-size: 16px;
  font-weight: 700;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-red);
}
body.light-theme .warning-header {
  color: #991b1b;
  background: rgba(239, 68, 68, 0.15);
}
.warning-title-text {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.warning-item {
  display: flex;
  gap: 18px;
  padding: 20px;
  align-items: center;
}
.icon-box {
  width: 70px;
  height: 70px;
  background: rgba(0, 0, 0, 0.3);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border: 1px solid rgba(239, 68, 68, 0.2);
  padding: 8px;
}
body.light-theme .icon-box {
  background: rgba(255, 255, 255, 0.6);
}
.icon-box img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.text-box {
  flex: 1;
  font-size: 14.5px;
  line-height: 1.7;
  color: #fecfcf;
  text-align: left;
}
body.light-theme .text-box {
  color: #7f1d1d;
}
.divider {
  height: 1px;
  background: rgba(239, 68, 68, 0.2);
  margin: 0 20px;
}
.tc-btn {
  background: var(--accent-red);
  color: #ffffff;
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 13px;
  text-decoration: none;
  font-weight: 600;
  transition: all 0.2s;
  border: none;
}
.tc-btn:hover {
  background: #dc2626;
  box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
}

.tc-forecast-header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.tc-forecast-title {
  white-space: nowrap;
}
.tc-update-time {
  font-size: 13px;
  font-weight: normal;
  color: #fca5a5;
  opacity: 0.85;
  text-align: right;
}
body.light-theme .tc-update-time {
  color: #991b1b;
}
.tc-table-wrap {
  padding: 16px 20px;
}
.tc-warning-table {
  width: 100%;
  border-collapse: collapse;
  color: #fecfcf;
}
body.light-theme .tc-warning-table {
  color: #7f1d1d;
}
.tc-warning-table th,
.tc-warning-table td {
  border: 1px solid rgba(239, 68, 68, 0.2);
  padding: 12px 10px;
  text-align: center;
  font-size: 14px;
}
.tc-warning-table th {
  background-color: rgba(239, 68, 68, 0.2);
  color: #ffffff;
  font-weight: 600;
}
body.light-theme .tc-warning-table th {
  background-color: rgba(239, 68, 68, 0.15);
  color: #991b1b;
}
.tc-warning-table tr:nth-child(even) {
  background-color: rgba(0, 0, 0, 0.15);
}
body.light-theme .tc-warning-table tr:nth-child(even) {
  background-color: rgba(0, 0, 0, 0.03);
}

/* ========== 5. 橙色提示框 ========== */
.box {
  margin: 20px 0;
  border-radius: 16px;
  background: var(--bg-orange);
  border: 1px solid var(--border-orange);
  box-shadow: 0 6px 20px rgba(245, 158, 11, 0.08);
  overflow: hidden;
}
.header-orange {
  background: rgba(245, 158, 11, 0.25);
  color: var(--accent-yellow);
  padding: 14px 20px;
  font-size: 16px;
  font-weight: 700;
  border-bottom: 1px solid var(--border-orange);
  display: flex;
  align-items: center;
  gap: 8px;
}
body.light-theme .header-orange {
  color: #9a3412;
  background: rgba(245, 158, 11, 0.15);
}
.content-yellow {
  padding: 20px;
  font-size: 14.5px;
  line-height: 1.7;
  color: #fef08a;
}
body.light-theme .content-yellow {
  color: #78350f;
}
.box-divider {
  height: 1px;
  background: rgba(245, 158, 11, 0.25);
  margin: 14px 0;
}
body.light-theme .box-divider {
  background: rgba(245, 158, 11, 0.35);
}

/* ========== 9. 底部固定導航欄 (Bottom Fixed Bar) ========== */
.bottom-fixed-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: rgba(11, 15, 25, 0.9);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--card-border);
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 8px 0;
  z-index: 2999;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
}
body.light-theme .bottom-fixed-bar {
  background: rgba(248, 250, 252, 0.92);
}
.bottom-bar-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  flex: 1;
  padding: 4px;
  outline: none;
}
.bottom-bar-btn svg {
  width: 20px;
  height: 20px;
}
.bottom-bar-btn:hover,
.bottom-bar-btn.active {
  color: var(--accent-blue);
}

/* ========== 10. 響應式適配 ========== */
@media (max-width: 768px) {
  .header-nav-container {
    padding: 0.75rem 1rem;
  }
  .menu-toggle {
    display: block;
  }
  .nav {
    display: none;
    flex-direction: column;
    width: 230px;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    align-items: stretch;
  }
  body.light-theme .nav {
    background: rgba(255, 255, 255, 0.98);
  }
  .nav a {
    width: 100%;
    padding: 10px 14px;
    border-radius: 8px;
  }
  .nav.active {
    display: flex;
  }

  .dropdown {
    width: 100%;
  }
  .dropdown-btn {
    width: 100%;
    justify-content: space-between;
    padding: 10px 14px;
    border-radius: 8px;
  }
  .dropdown-content {
    position: static;
    display: none;
    opacity: 1;
    visibility: visible;
    box-shadow: none;
    border: none;
    background: rgba(255, 255, 255, 0.03);
    margin-top: 4px;
    padding-left: 10px;
    border-left: 2px solid var(--accent-blue);
    border-radius: 0 8px 8px 0;
    transition: none;
  }
  body.light-theme .dropdown-content {
    background: rgba(0, 0, 0, 0.03);
  }

  .dropdown.active .dropdown-content {
    display: block;
  }

  .forecast-chart-row {
    grid-template-columns: 1fr;
  }
  .chart-wrap {
    height: 380px;
  }
  .quick-links {
    grid-template-columns: 1fr;
  }
  .tc-forecast-header-row {
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
  }
  .tc-update-time {
    text-align: left;
  }
}

@media (min-width: 769px) {
  .nav {
    display: flex !important;
  }
  .menu-toggle {
    display: none !important;
  }
}

@media (max-width: 375px) {
  .link-box {
    padding: 14px 6px;
    font-size: 12px;
  }
  .nav {
    width: calc(100vw - 30px);
  }
}
</style>
</head>

<body>

<div class="header-nav-container">
  <div class="header">
    <img src="icons/MSSO.png" class="logo" alt="MSSO Logo">
    <div class="title">
      澳門民間氣象台 MSSO
      <span id="headerClock" class="header-clock"></span>
    </div>
  </div>

  <div class="menu-container">

      </div>
      
      <div class="dropdown">
        <button class="dropdown-btn">氣候 <span class="arrow">▼</span></button>
        <div class="dropdown-content">
            <a href="https://macaosso.github.io/MSSOweb/climate.html">澳門氣候</a>
            <a href="https://macaosso.github.io/MSSOweb/24.html">(NEW)二十四節氣專頁</a>

      </div>

      <div class="dropdown">

        <div class="dropdown-content">
          <a href="earthquake.html" class="active">(NEW)地震</a>
          <a href="https://macaosso.github.io/MSSOweb/tsunami.html">(NEW)海嘯</a>
          <a href="https://macaosso.github.io/MSSOweb/time.html">(NEW)授時</a>

<script src="webdata.js"></script>
<script>
function applyTheme(theme) {
  if (theme === 'light') {
    document.body.classList.add('light-theme');
  } else {
    document.body.classList.remove('light-theme');
  }
  updateChartColors();
}

function toggleTheme() {
  const isLight = document.body.classList.contains('light-theme');
  const newTheme = isLight ? 'dark' : 'light';
  localStorage.setItem('msso_theme', newTheme);
  applyTheme(newTheme);
}

(function initTheme() {
  const savedTheme = localStorage.getItem('msso_theme');
  if (savedTheme) {
    if (savedTheme === 'light') document.body.classList.add('light-theme');
  } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
    document.body.classList.add('light-theme');
  }
})();

function toggleMenu() {
  const nav = document.getElementById("navMenu");
  const btn = document.querySelector(".menu-toggle");
  nav.classList.toggle("active");
  btn.innerHTML = nav.classList.contains("active") ? "✕" : "☰";
}

function updateHeaderClock() {
  const clockEl = document.getElementById('headerClock');
  if (clockEl) {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const date = String(now.getDate()).padStart(2, '0');
    const hrs = String(now.getHours()).padStart(2, '0');
    const mins = String(now.getMinutes()).padStart(2, '0');
    const secs = String(now.getSeconds()).padStart(2, '0');
    clockEl.textContent = ` ${year}年${month}月${date}日 ${hrs}:${mins}:${secs} MST`;
  }
}

function resolveIcon(iconKey) {
  if (!iconKey) return "";
  const key = iconKey.trim();
  if (typeof ICON_PRESETS !== 'undefined' && ICON_PRESETS[key]) {
    return ICON_PRESETS[key];
  }
  if (key.includes('/') || key.includes('.')) {
    return key;
  }
  return `icons/${key.toLowerCase()}.jpg`;
}

function renderTcForecastTable(data) {
  const tableCard = document.getElementById('tcForecastTableCard');
  const tableContent = document.getElementById('tcTableContent');
  const mainTitleEl = document.getElementById('tableMainTitle');
  const updateTimeEl = document.getElementById('tableUpdateTime');

  if (!tableCard || !tableContent || !data || !Array.isArray(data.tableRows)) {
    if (tableCard) tableCard.style.display = 'none';
    return;
  }

  const validRows = data.tableRows.filter(row => row.probability && row.probability.trim() !== '');

  if (validRows.length === 0) {
    tableCard.style.display = 'none';
    return;
  }

  if (mainTitleEl) mainTitleEl.textContent = data.mainTitle || '';
  if (updateTimeEl) updateTimeEl.textContent = data.updateTimeText || '';

  let html = `
    <table class="tc-warning-table">
      <thead>
        <tr>
          <th>警報</th>
          <th>發佈時段</th>
          <th>機率</th>
        </tr>
      </thead>
      <tbody>
  `;

  validRows.forEach(row => {
    html += `
      <tr>
        <td>${row.signal || ''}</td>
        <td>${row.period || '-'}</td>
        <td>${row.probability || ''}</td>
      </tr>
    `;
  });

  html += `
      </tbody>
    </table>
  `;

  tableContent.innerHTML = html;
  tableCard.style.display = 'block';
}

function scrollToSection(sectionId, btn) {
  document.querySelectorAll('.bottom-bar-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');

  const element = document.getElementById(sectionId);
  if (element) {
    element.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}
  
function formatTextBoxContent(data) {
  if (Array.isArray(data)) {
    const validItems = data.filter(item => item && typeof item === 'string' && item.trim() !== '');
    if (validItems.length === 0) return "";
    return validItems.map(item => item.trim()).join('<div class="box-divider"></div>');
  }
  return typeof data === 'string' && data.trim() !== '' ? data.trim() : "";
}

function renderTextBox(boxId, contentId, data) {
  const box = document.getElementById(boxId);
  const content = document.getElementById(contentId);
  if (!box || !content) return;

  const htmlContent = formatTextBoxContent(data);
  if (htmlContent) {
    box.style.display = 'block';
    content.innerHTML = htmlContent;
  } else {
    box.style.display = 'none';
  }
}

function renderWarnings(data, containerId, cardId) {
  const container = document.getElementById(containerId);
  const card = document.getElementById(cardId);
  if (!container || !card) return;
  
  if (!Array.isArray(data)) {
    card.style.display = "none";
    return;
  }
  
  let html = "";
  let validCount = 0;

  data.forEach((item) => {
    if (!item) return;

    let text = "";
    let iconSrc = "";

    if (typeof item === 'string') {
      text = item.trim();
    } else if (typeof item === 'object') {
      text = item.text ? item.text.trim() : "";
      if (item.icon && item.icon.trim()) {
        iconSrc = resolveIcon(item.icon);
      }
    }

    if (!text && !iconSrc) return;

    if (validCount > 0) html += `<div class="divider"></div>`;
    html += `
         <div class="warning-item">
          ${iconSrc ? `<div class="icon-box"><img src="${iconSrc}" alt="Warning Icon"></div>` : ""}
          ${text ? `<div class="text-box">${text}</div>` : ""}
         </div>
       `;
    validCount++;
  });

  container.innerHTML = html;
  card.style.display = validCount > 0 ? "block" : "none";
}

window.addEventListener('DOMContentLoaded', function(){
    updateHeaderClock();
    setInterval(updateHeaderClock, 1000);

    if (typeof TC_WARNING_DATA !== 'undefined') {
      renderTcForecastTable(TC_WARNING_DATA);
    }

    if (typeof alertipsText !== 'undefined') renderTextBox('alertBox', 'alertContent', alertipsText);
    if (typeof swtText !== 'undefined') renderTextBox('swtBox', 'swtContent', swtText);
    if (typeof tideText !== 'undefined') {
      renderTextBox('tideBox', 'tideContent', tideText);
    } else if (typeof TideText !== 'undefined') {
      renderTextBox('tideBox', 'tideContent', TideText);
    }

    if (typeof tcWarnings !== 'undefined') renderWarnings(tcWarnings, "tcContent", "tcCard");
    if (typeof warnWarnings !== 'undefined') renderWarnings(warnWarnings, "warnContent", "warnCard");
    if (typeof tcText !== 'undefined') renderWarnings(tcText, "tcNewsContent", "tcNewsCard");

    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabItems = document.querySelectorAll('.tab-content');
    tabBtns.forEach(btn => {
      btn.onclick = function(){
        tabBtns.forEach(b => b.classList.remove('active'));
        tabItems.forEach(c => c.classList.remove('active'));
        this.classList.add('active');
        let idx = this.dataset.index;
        document.getElementById('tab' + idx).classList.add('active');
      }
    });
});
</script>
