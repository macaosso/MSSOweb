<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<link rel="icon" type="image/png" href="icons/MSSO.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<title>澳門民間氣象台 - 熱帶氣旋資訊及GIS地圖</title>
<style>
/* ========== 1. 深太空 (Deep Space) 主題基礎 ========== */
:root {
  --bg-dark: #0b0f19;
  --card-bg: rgba(22, 30, 46, 0.75);
  --card-bg-light: rgba(255, 255, 255, 0.03);
  --card-border: rgba(255, 255, 255, 0.08);
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  
  --accent-blue: #38bdf8;
  --accent-teal: #2dd4bf;
  --accent-green: #34d399;
  --accent-yellow: #facc15;
  --accent-orange: #f59e0b;
  --accent-red: #ef4444;
  --accent-purple: #c084fc;

  --bg-red: rgba(239, 68, 68, 0.12);
  --border-red: rgba(239, 68, 68, 0.35);
  --bg-orange: rgba(245, 158, 11, 0.12);
  --border-orange: rgba(245, 158, 11, 0.35);
}

body.light-theme {
  --bg-dark: #f8fafc;
  --card-bg: rgba(255, 255, 255, 0.85);
  --card-bg-light: rgba(0, 0, 0, 0.04);
  --card-border: rgba(0, 0, 0, 0.12);
  --text-main: #0f172a;
  --text-muted: #64748b;

  --accent-blue: #0284c7;
  --accent-teal: #0d9488;
  --accent-green: #059669;
  --accent-yellow: #d97706;
  --accent-orange: #d97706;
  --accent-red: #dc2626;
  --accent-purple: #9333ea;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-main);
  line-height: 1.6;
  transition: background-color 0.3s ease, color 0.3s ease;
}

.page-wrapper {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 15px 40px 15px;
}

/* ========== Header & Navigation ========== */
.header-nav-container {
  position: sticky; top: 0; z-index: 3000;
  background: rgba(11, 15, 25, 0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--card-border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.75rem 1.5rem; margin-bottom: 20px;
}
body.light-theme .header-nav-container { background: rgba(248, 250, 252, 0.88); }

.header { display: flex; align-items: center; gap: 12px; }
.logo { height: 38px; width: auto; filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.3)); }
.title { font-size: 1.15rem; font-weight: 700; color: var(--accent-blue); display: flex; align-items: baseline; gap: 10px; }
.header-clock { font-size: 0.88rem; font-weight: 500; color: var(--accent-teal); font-variant-numeric: tabular-nums; }

.menu-container { display: flex; align-items: center; gap: 10px; }
.theme-toggle-btn {
  background: var(--card-bg-light); border: 1px solid var(--card-border);
  color: var(--text-main); padding: 8px 12px; border-radius: 20px;
  cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600;
}
.theme-toggle-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
.sun-icon { display: block; } .moon-icon { display: none; }
body.light-theme .sun-icon { display: none; } body.light-theme .moon-icon { display: block; }

.nav { display: flex; gap: 8px; align-items: center; }
.nav a { color: var(--text-muted); padding: 8px 14px; font-size: 0.92rem; font-weight: 500; text-decoration: none; border-radius: 20px; }
.nav a:hover, .nav a.active { color: var(--text-main); background: rgba(255, 255, 255, 0.08); }

/* Dropdown */
.dropdown { position: relative; display: inline-block; }
.dropdown-btn { background: transparent; border: none; color: var(--text-muted); padding: 8px 14px; font-size: 0.92rem; font-weight: 500; cursor: pointer; border-radius: 20px; }
.dropdown-content {
  position: absolute; top: 100%; left: 0; min-width: 190px;
  background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px);
  border: 1px solid var(--card-border); border-radius: 12px; padding: 6px;
  opacity: 0; visibility: hidden; transition: all 0.25s ease; z-index: 3100;
}
body.light-theme .dropdown-content { background: rgba(255, 255, 255, 0.98); }
.dropdown:hover .dropdown-content { opacity: 1; visibility: visible; }
.dropdown-content a { padding: 8px 12px; display: block; white-space: nowrap; font-size: 0.88rem; }

/* ========== Component Cards & Map ========== */
.card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
}

.card-title {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--accent-blue);
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 15px;
  border-bottom: 1px solid var(--card-border);
  padding-bottom: 10px;
}

#map-container {
  height: 520px;
  width: 100%;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--card-border);
  z-index: 10;
}

.tc-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

.tc-table th, .tc-table td {
  padding: 12px;
  text-align: left;
  border-bottom: 1px solid var(--card-border);
  font-size: 0.92rem;
}

.tc-table th {
  background: rgba(56, 189, 248, 0.1);
  color: var(--accent-blue);
  font-weight: 600;
}

.badge {
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 0.78rem;
  font-weight: 700;
  color: #fff;
  display: inline-block;
}

.badge-td { background-color: #38bdf8; }
.badge-ts { background-color: #34d399; }
.badge-sts { background-color: #facc15; color: #000; }
.badge-ty { background-color: #f59e0b; }
.badge-sty { background-color: #ef4444; }
.badge-super { background-color: #c084fc; }

.status-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.88rem;
  color: var(--text-muted);
}

.mode-btn {
  background: var(--card-bg-light);
  border: 1px solid var(--card-border);
  color: var(--text-main);
  padding: 4px 12px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 12px;
}
.mode-btn:hover { border-color: var(--accent-teal); color: var(--accent-teal); }

/* Custom Map Marker Popup Style */
.leaflet-popup-content-wrapper {
  background: rgba(15, 23, 42, 0.95) !important;
  color: #f1f5f9 !important;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 10px;
}
.leaflet-popup-tip { background: rgba(15, 23, 42, 0.95) !important; }
</style>
</head>

<body>

<div class="header-nav-container">
  <div class="header">
    <img src="icons/MSSO.png" class="logo" alt="MSSO Logo" onerror="this.style.display='none'">
    <div class="title">
      澳門民間氣象台 MSSO
      <span id="headerClock" class="header-clock"></span>
    </div>
  </div>

  <div class="menu-container">
    <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()">
      <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>

    <div class="nav">
      <a href="index.html">首頁</a>
      <div class="dropdown">
        <button class="dropdown-btn">熱帶氣旋 ▼</button>
        <div class="dropdown-content">
          <a href="tc.html" class="active">熱帶氣旋資訊及GIS</a>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="page-wrapper">

  <!-- GIS 地圖模組 -->
  <div class="card">
    <div class="card-title">
      <span>🌐 熱帶氣旋即時 GIS 路徑地圖</span>
      <div class="status-bar">
        <span id="dataStatus">數據更新中...</span>
        <button class="mode-btn" onclick="toggleDemoData()">切換模擬/實時模式</button>
      </div>
    </div>
    <div id="map-container"></div>
  </div>

  <!-- 熱帶氣旋詳細列表 -->
  <div class="card">
    <div class="card-title">
      <span>🌀 現時熱帶氣旋詳細資料 (香港天文台數據源)</span>
      <span id="lastUpdate" style="font-size: 0.85rem; font-weight: normal; color: var(--text-muted);"></span>
    </div>

    <div id="tcTableWrapper">
      <table class="tc-table">
        <thead>
          <tr>
            <th>熱帶氣旋名稱</th>
            <th>強度等級</th>
            <th>位置 (緯度/經度)</th>
            <th>中心最高風速</th>
            <th>中心氣壓</th>
            <th>移動方向及速度</th>
          </tr>
        </thead>
        <tbody id="tcTableBody">
          <tr>
            <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 20px;">
              正在載入熱帶氣旋數據...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
// 1. 全局變量與主題控制
let map;
let mapMarkers = [];
let mapPolyline = null;
let useDemoData = false;

function applyTheme(theme) {
  if (theme === 'light') document.body.classList.add('light-theme');
  else document.body.classList.remove('light-theme');
}

function toggleTheme() {
  const isLight = document.body.classList.contains('light-theme');
  const newTheme = isLight ? 'dark' : 'light';
  localStorage.setItem('msso_theme', newTheme);
  applyTheme(newTheme);
}

(function initTheme() {
  const saved = localStorage.getItem('msso_theme');
  if (saved === 'light') document.body.classList.add('light-theme');
})();

function updateHeaderClock() {
  const clockEl = document.getElementById('headerClock');
  if (clockEl) {
    const now = new Date();
    clockEl.textContent = ` ${now.getFullYear()}年${String(now.getMonth()+1).padStart(2,'0')}月${String(now.getDate()).padStart(2,'0')}日 ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')} MST`;
  }
}
setInterval(updateHeaderClock, 1000);
updateHeaderClock();

// 2. Leaflet GIS 地圖初始化
function initMap() {
  map = L.map('map-container').setView([18.0, 115.0], 5);
  
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    maxZoom: 18
  }).addTo(map);
}

// 3. 強度顏色與 Badge 標籤輔助函式
function getIntensityBadge(intensity) {
  if (!intensity) return `<span class="badge badge-td">熱帶低氣壓</span>`;
  if (intensity.includes('超強颱風')) return `<span class="badge badge-super">超強颱風</span>`;
  if (intensity.includes('強颱風')) return `<span class="badge badge-sty">強颱風</span>`;
  if (intensity.includes('颱風')) return `<span class="badge badge-ty">颱風</span>`;
  if (intensity.includes('強烈熱帶風暴')) return `<span class="badge badge-sts">強烈熱帶風暴</span>`;
  if (intensity.includes('熱帶風暴')) return `<span class="badge badge-ts">熱帶風暴</span>`;
  return `<span class="badge badge-td">${intensity}</span>`;
}

function getIntensityColor(intensity) {
  if (!intensity) return '#38bdf8';
  if (intensity.includes('超強颱風')) return '#c084fc';
  if (intensity.includes('強颱風')) return '#ef4444';
  if (intensity.includes('颱風')) return '#f59e0b';
  if (intensity.includes('強烈熱帶風暴')) return '#facc15';
  if (intensity.includes('熱帶風暴')) return '#34d399';
  return '#38bdf8';
}

// 4. 解析 HKO XML 數據與繪製 GIS
async function fetchTCData() {
  const statusEl = document.getElementById('dataStatus');
  const tableBody = document.getElementById('tcTableBody');
  const lastUpdateEl = document.getElementById('lastUpdate');

  if (useDemoData) {
    renderDemoData();
    return;
  }

  statusEl.textContent = "數據載入中...";
  const targetUrl = "https://www.weather.gov.hk/wxinfo/currwx/tc_list.xml";
  const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(targetUrl)}`;

  try {
    const res = await fetch(proxyUrl, { cache: 'no-store' });
    if (!res.ok) throw new Error("網絡請求失敗");
    
    const xmlText = await res.text();
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xmlText, "text/xml");
    
    const tcList = Array.from(xmlDoc.querySelectorAll("tropical_cyclone, cyclone, TC"));

    clearMap();

    if (tcList.length === 0) {
      statusEl.textContent = "當前無活躍熱帶氣旋";
      tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 20px;">當前西北太平洋及南海海域無活躍熱帶氣旋系統。</td></tr>`;
      lastUpdateEl.textContent = `發佈時間：${new Date().toLocaleTimeString()}`;
      return;
    }

    statusEl.textContent = `已成功讀取 ${tcList.length} 個熱帶氣旋`;
    tableBody.innerHTML = "";
    const trackPoints = [];

    tcList.forEach(tc => {
      const nameTc = tc.querySelector("name_tc, name_c, name")?.textContent || "未命名";
      const intensity = tc.querySelector("intensity_tc, intensity, category")?.textContent || "熱帶氣旋";
      const lat = parseFloat(tc.querySelector("lat, latitude")?.textContent || 0);
      const lon = parseFloat(tc.querySelector("lng, lon, longitude")?.textContent || 0);
      const wind = tc.querySelector("max_wind_kmh, max_wind, wind_speed")?.textContent || "--";
      const pressure = tc.querySelector("pressure, central_pressure")?.textContent || "--";
      const movement = tc.querySelector("movement, move_dir")?.textContent || "--";

      // 更新表格
      const row = document.createElement('tr');
      row.innerHTML = `
        <td><strong>${nameTc}</strong></td>
        <td>${getIntensityBadge(intensity)}</td>
        <td>${lat}°N, ${lon}°E</td>
        <td>${wind} km/h</td>
        <td>${pressure} hPa</td>
        <td>${movement}</td>
      `;
      tableBody.appendChild(row);

      // 更新 GIS 地圖 Marker
      if (lat && lon) {
        const color = getIntensityColor(intensity);
        const marker = L.circleMarker([lat, lon], {
          radius: 9,
          fillColor: color,
          color: '#ffffff',
          weight: 2,
          opacity: 1,
          fillOpacity: 0.85
        }).addTo(map);

        marker.bindPopup(`
          <div style="font-size:14px; line-height:1.5;">
            <b style="color:${color}; font-size:16px;">${nameTc} (${intensity})</b><br>
            <b>位置：</b>${lat}°N, ${lon}°E<br>
            <b>中心風速：</b>${wind} km/h<br>
            <b>中心氣壓：</b>${pressure} hPa<br>
            <b>動向：</b>${movement}
          </div>
        `);

        mapMarkers.push(marker);
        trackPoints.push([lat, lon]);
      }
    });

    if (trackPoints.length > 0) {
      map.panTo(trackPoints[0]);
    }

    lastUpdateEl.textContent = `更新時間：${new Date().toLocaleTimeString()}`;

  } catch (err) {
    console.error("TC XML Parse Error:", err);
    statusEl.textContent = "數據讀取失敗（可切換至模擬模式查看）";
    tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--accent-red); padding: 20px;">無法讀取即時數據，請稍後重試。</td></tr>`;
  }
}

function clearMap() {
  mapMarkers.forEach(m => map.removeLayer(m));
  mapMarkers = [];
  if (mapPolyline) {
    map.removeLayer(mapPolyline);
    mapPolyline = null;
  }
}

// 5. 模擬模式 (供無颱風季節時測試 GIS 地圖)
function toggleDemoData() {
  useDemoData = !useDemoData;
  fetchTCData();
}

function renderDemoData() {
  const statusEl = document.getElementById('dataStatus');
  const tableBody = document.getElementById('tcTableBody');
  const lastUpdateEl = document.getElementById('lastUpdate');

  statusEl.textContent = "當前為模擬測試模式";
  lastUpdateEl.textContent = "模擬數據發佈";

  clearMap();

  const demoPath = [
    { name: "颱風 桃芝 (Demo)", intensity: "熱帶風暴", lat: 15.2, lon: 124.0, wind: "75", pressure: "995", move: "向西北西移動約 22 公里/小時" },
    { name: "颱風 桃芝 (Demo)", intensity: "強烈熱帶風暴", lat: 17.0, lon: 120.5, wind: "105", pressure: "982", move: "向西北移動約 20 公里/小時" },
    { name: "颱風 桃芝 (Demo)", intensity: "颱風", lat: 19.5, lon: 116.8, wind: "130", pressure: "970", move: "向西北西移動約 15 公里/小時" },
    { name: "颱風 桃芝 (Demo)", intensity: "強颱風", lat: 21.2, lon: 114.2, wind: "155", pressure: "955", move: "減速向西北移動" }
  ];

  tableBody.innerHTML = "";
  const points = [];

  demoPath.forEach((pt, index) => {
    const isCurrent = index === demoPath.length - 1;
    if (isCurrent) {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td><strong>${pt.name}</strong></td>
        <td>${getIntensityBadge(pt.intensity)}</td>
        <td>${pt.lat}°N, ${pt.lon}°E</td>
        <td>${pt.wind} km/h</td>
        <td>${pt.pressure} hPa</td>
        <td>${pt.move}</td>
      `;
      tableBody.appendChild(row);
    }

    const latLng = [pt.lat, pt.lon];
    points.push(latLng);

    const marker = L.circleMarker(latLng, {
      radius: isCurrent ? 10 : 6,
      fillColor: getIntensityColor(pt.intensity),
      color: isCurrent ? '#ffffff' : '#888',
      weight: 2,
      fillOpacity: 0.9
    }).addTo(map);

    marker.bindPopup(`
      <b>${pt.name}</b> (${pt.intensity})<br>
      中心風速: ${pt.wind} km/h<br>
      氣壓: ${pt.pressure} hPa
    `);

    mapMarkers.push(marker);
  });

  mapPolyline = L.polyline(points, { color: '#38bdf8', weight: 3, dashArray: '6, 8' }).addTo(map);
  map.fitBounds(mapPolyline.getBounds().pad(0.2));
}

// 頁面初始化
window.addEventListener('DOMContentLoaded', () => {
  initMap();
  fetchTCData();
  setInterval(fetchTCData, 300000); // 每 5 分鐘自動刷新
});
</script>
</body>
</html>
