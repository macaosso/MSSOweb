<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- 引入 Turf.js 用於平滑差值與多邊形差集/聯集運算 (Shapely logic) -->
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<title>熱帶氣旋路徑追蹤器 - 澳門 MSSO / MET WARN</title>
<style>
:root {
  --bg-dark: #0b0f19;
  --bg-panel: #121826;
  --card-bg: #1a2235;
  --card-border: rgba(255, 255, 255, 0.08);
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --accent-blue: #38bdf8;
  
  --c-low: #94a3b8;
  --c-td: #38bdf8;
  --c-ts: #2dd4bf;
  --c-sts: #facc15;
  --c-t: #f59e0b;
  --c-st: #ef4444;
  --c-supert: #c084fc;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-main);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.top-header {
  background: #0f1523;
  border-bottom: 1px solid var(--card-border);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 2000;
  gap: 12px;
}
.brand-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--accent-blue);
  white-space: nowrap;
}
.brand-title span { font-size: 0.75rem; color: var(--text-muted); font-weight: normal; }

.header-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.ctrl-btn, .ctrl-select {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--card-border);
  color: var(--text-main);
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 0.82rem;
  cursor: pointer;
  outline: none;
}
.ctrl-btn:hover, .ctrl-select:hover { background: rgba(255, 255, 255, 0.12); }
.ctrl-btn.active { background: #0284c7; border-color: var(--accent-blue); }

.main-container {
  display: flex;
  flex: 1;
  position: relative;
  overflow: hidden;
}

#map-wrapper { flex: 1; position: relative; height: 100%; }
#map { width: 100%; height: 100%; background: #090d16; }

.map-overlay-topright {
  position: absolute;
  top: 12px; right: 12px;
  z-index: 1000;
  background: rgba(15, 21, 35, 0.88);
  backdrop-filter: blur(8px);
  border: 1px solid var(--card-border);

}

  display: flex; align-items: center; justify-content: space-between;

}
.btn-mini {
  background: var(--accent-blue); color: #000; border: none;
  padding: 2px 8px; border-radius: 4px; font-size: 0.75rem;
  font-weight: bold; cursor: pointer;
}

.map-legend {
  position: absolute; bottom: 24px; left: 12px;
  z-index: 1000;
  background: rgba(15, 21, 35, 0.88);
  backdrop-filter: blur(8px);
  border: 1px solid var(--card-border);
  border-radius: 8px; padding: 10px 14px; font-size: 0.78rem;
}
.legend-title { font-weight: bold; margin-bottom: 6px; color: var(--text-muted); }
.legend-grid { display: flex; flex-direction: column; gap: 4px; }
.legend-item { display: flex; align-items: center; gap: 8px; }
.legend-color { width: 12px; height: 12px; border-radius: 50%; }

.sidebar {
  width: 380px;
  background: var(--bg-panel);
  border-left: 1px solid var(--card-border);
  display: flex; flex-direction: column;
  z-index: 1000; overflow-y: auto;
}
.sidebar-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--card-border);
  display: flex; align-items: center; justify-content: space-between;
  font-size: 0.9rem; font-weight: bold; background: rgba(0,0,0,0.15);
}
.sidebar-content { padding: 12px; display: flex; flex-direction: column; gap: 12px; }

.tc-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 8px; padding: 12px;
}
.tc-title { font-size: 1.05rem; font-weight: bold; display: flex; align-items: center; gap: 6px; }

.badge-tag {
  padding: 2px 6px; border-radius: 4px;
  font-size: 0.72rem; font-weight: bold; color: #fff; display: inline-block;
}

.tc-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  background: rgba(0,0,0,0.2); padding: 8px; border-radius: 6px;
  font-size: 0.8rem; margin: 8px 0;
}
.tc-grid-item label { color: var(--text-muted); display: block; font-size: 0.72rem; }
.tc-grid-item val { font-weight: 600; }

/* 頁籤切換按鈕組 (Requirement 4) */
.tab-group {
  display: flex;
  background: rgba(0, 0, 0, 0.3);
  border-radius: 6px;
  padding: 2px;
  margin-bottom: 8px;
}
.tab-btn {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text-muted);
  padding: 5px 0;
  font-size: 0.78rem;
  font-weight: bold;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
}
.tab-btn.active {
  background: var(--accent-blue);
  color: #000;
}

.track-list { font-size: 0.78rem; display: flex; flex-direction: column; gap: 4px; }
.track-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 6px; background: rgba(255,255,255,0.02); border-radius: 4px;
  cursor: pointer; transition: background 0.2s;
}
.track-row:hover { background: rgba(255,255,255,0.08); }

.distance-label {
  background: transparent;
  border: none;
  box-shadow: none;
  color: rgba(255, 255, 255, 0.6);
  font-weight: bold;
  font-size: 10px;
}

.tc-icon-wrapper { display: flex; align-items: center; justify-content: center; cursor: pointer; }
.tc-svg-icon { filter: drop-shadow(0px 0px 5px rgba(0,0,0,0.9)); transform-origin: center; }

.leaflet-popup-content-wrapper {
  background: rgba(18, 24, 38, 0.95) !important;
  backdrop-filter: blur(8px);
  color: #f1f5f9 !important;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 8px !important;
  padding: 2px;
}
.leaflet-popup-tip { background: rgba(18, 24, 38, 0.95) !important; }
.popup-data-box { font-size: 0.8rem; line-height: 1.5; padding: 4px; }
.popup-data-box strong { color: var(--accent-blue); }
</style>

<body>

<div class="top-header">
  <div class="brand-title">
    ⚡ 熱帶氣旋路徑追蹤器
    <span>MACAU (22.1595, 113.5685)</span>
  </div>
  <div class="header-controls">
    <select class="ctrl-select" id="yearSelect"><option>2026</option></select>
    <button class="ctrl-btn active" id="btnCone" onclick="toggleErrorCone()">潛在路徑範圍錐體</button>
    <button class="ctrl-btn" onclick="resetView()">重置視角(澳門)</button>
    <button class="ctrl-btn" onclick="loadTCData()">立即刷新</button>
  </div>
</div>

<div class="main-container">
  <div id="map-wrapper">
    <div id="map"></div>

    <div class="map-overlay-topright" id="mapQuickSelect">
      <div style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: 6px;">活躍熱帶氣旋</div>
      <div id="quickSelectList">載入中...</div>
    </div>

    <div class="map-legend">
      <div class="legend-title">熱帶氣旋強度分類</div>
      <div class="legend-grid">
        <div class="legend-item"><div class="legend-color" style="background:var(--c-td)"></div>熱帶低氣壓 TD (41-62 km/h)</div>
        <div class="legend-item"><div class="legend-color" style="background:var(--c-ts)"></div>熱帶風暴 TS (63-87 km/h)</div>
        <div class="legend-item"><div class="legend-color" style="background:var(--c-sts)"></div>強烈熱帶風暴 STS (88-117 km/h)</div>
        <div class="legend-item"><div class="legend-color" style="background:var(--c-t)"></div>颱風 T (118-149 km/h)</div>
        <div class="legend-item"><div class="legend-color" style="background:var(--c-st)"></div>強颱風 ST (150-184 km/h)</div>
        <div class="legend-item"><div class="legend-color" style="background:var(--c-supert)"></div>超強颱風 SuperT (&ge;185 km/h)</div>
      </div>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-header">
      <span>風暴詳細數據</span>
      <span id="updateClock" style="font-size: 0.75rem; color: var(--text-muted);">更新中...</span>
    </div>
    <div class="sidebar-content" id="sidebarCards"></div>
  </div>
</div>

<script>
// Requirement 1: 變更所有基準中心為澳門 (22.1595, 113.5685)
const MACAU_COORDS = [22.1595, 113.5685];
let map;
let mapLayers = [];
let showCone = true;
let currentTCData = []; // 儲存風暴數據供頁籤切換渲染
let activeTabState = {}; // 記錄各風暴的頁籤狀態 ('forecast' | 'past')

const INTENSITY_CONFIG = {
  'LOW':    { name: '低壓區',       color: 'var(--c-low)' },
  'TD':     { name: '熱帶低氣壓',   color: 'var(--c-td)' },
  'TS':     { name: '熱帶風暴',     color: 'var(--c-ts)' },
  'STS':    { name: '強烈熱帶風暴', color: 'var(--c-sts)' },
  'T':      { name: '颱風',         color: 'var(--c-t)' },
  'ST':     { name: '強颱風',       color: 'var(--c-st)' },
  'SuperT': { name: '超強颱風',     color: 'var(--c-supert)' }
};

// 0, 24, 48, 72, 96, 120 小時標準誤差半徑 (km)
const STANDARD_ERROR_RADIUS = {
  0: 15,
  24: 100,
  48: 170,
  72: 255,
  96: 345,
  120: 465
};

function initMap() {
  map = L.map('map', { zoomControl: false }).setView(MACAU_COORDS, 6);
  
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap &copy; CARTO'
  }).addTo(map);

  L.control.zoom({ position: 'topleft' }).addTo(map);

  // 繪製澳門標記點
  L.circleMarker(MACAU_COORDS, {
    radius: 6,
    fillColor: '#ef4444',
    color: '#ffffff',
    weight: 2,
    fillOpacity: 1
  }).bindTooltip("澳門 Macau", { permanent: true, direction: "top", className: "distance-label" }).addTo(map);

  // Requirement 3: 始終常駐顯示以澳門為中心的 100, 200, 400, 800 km 距離圈
  drawMacauDistanceRings();
}

// Requirement 3: 澳門距離圈
function drawMacauDistanceRings() {
  const distances = [100, 200, 400, 800]; // km
  distances.forEach(d => {
    // 繪製距離圈
    L.circle(MACAU_COORDS, {
      radius: d * 1000,
      color: '#38bdf8',
      weight: 1,
      dashArray: '4, 6',
      fill: false,
      opacity: 0.4
    }).addTo(map);

    // 標註圈半徑文字 (放置於正北方標記)
    const labelLat = MACAU_COORDS[0] + (d / 111);
    L.marker([labelLat, MACAU_COORDS[1]], {
      icon: L.divIcon({
        className: 'distance-label',
        html: `${d} km`,
        iconSize: [50, 15],
        iconAnchor: [25, 7]
      })
    }).addTo(map);
  });
}

function toggleErrorCone() {
  showCone = !showCone;
  document.getElementById('btnCone').classList.toggle('active', showCone);
  if (currentTCData.length > 0) renderTCs(currentTCData);
}

function resetView() {
  map.setView(MACAU_COORDS, 6);
}

function calcDistance(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

function parseCoord(valStr) {
  if (!valStr) return NaN;
  const cleanStr = valStr.trim();
  let num = parseFloat(cleanStr);
  if (isNaN(num)) return NaN;
  if (cleanStr.endsWith('S') || cleanStr.endsWith('W')) {
    num = -Math.abs(num);
  }
  return num;
}

function getCategoryKey(catStr, windStr) {
  let windSpeed = parseInt(windStr);
  if (!isNaN(windSpeed)) {
    if (windSpeed >= 185) return 'SuperT';
    if (windSpeed >= 150) return 'ST';
    if (windSpeed >= 118) return 'T';
    if (windSpeed >= 88)  return 'STS';
    if (windSpeed >= 63)  return 'TS';
    if (windSpeed >= 41)  return 'TD';
    return 'LOW';
  }
  if (!catStr) return 'TD';
  const upper = catStr.toUpperCase();
  if (upper.includes('LOW')) return 'LOW';
  if (upper.includes('SUPER')) return 'SuperT';
  if (upper.includes('SEVERE TYPHOON') || upper.includes('ST')) return 'ST';
  if (upper.includes('SEVERE TROPICAL') || upper.includes('STS')) return 'STS';
  if (upper.includes('TYPHOON') || upper.includes('T')) return 'T';
  if (upper.includes('TROPICAL STORM') || upper.includes('TS')) return 'TS';
  return 'TD';
}

function createCycloneIcon(colorStr, size = 20) {
  const svg = `
    <svg class="tc-svg-icon" viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="3" fill="#ffffff"/>
      <path d="M12 3C7.03 3 3 7.03 3 12c0 2.21.8 4.23 2.13 5.8L3 21l3.2-2.13C7.77 20.2 9.79 21 12 21c4.97 0 9-4.03 9-9 0-2.21-.8-4.23-2.13-5.8L21 3l-3.2 2.13C16.23 3.8 14.21 3 12 3z" stroke="#ffffff" stroke-width="1.2" fill="${colorStr}"/>
    </svg>`;
  return L.divIcon({
    className: 'tc-icon-wrapper',
    html: svg,
    iconSize: [size, size],
    iconAnchor: [size/2, size/2]
  });
}

function clearMapLayers() {
  mapLayers.forEach(l => map.removeLayer(l));
  mapLayers = [];
}

/**
 * Requirement 2: 處理平滑路徑與 0-72h 及 >72h 雙段誤差錐（使用 Turf.js）
 * 1. create_smooth_track / PchipInterpolator 插值生成細分節點
 * 2. 分別建立 segment1 (<=72h) 及 segment2 (>72h) 的圓形 buffer 集合
 * 3. 求解 envelope_first 與 envelope_second 差集及 72 小時圓形扣除 (Shapely logic)
 */
function drawSmoothSegmentedCone(conePoints) {
  if (!conePoints || conePoints.length < 2) return;

  // 1. 平滑插值 (每 2 小時生成一個內插點)
  const hours = conePoints.map(p => p.hours);
  const lons = conePoints.map(p => p.lon);
  const lats = conePoints.map(p => p.lat);
  const radii = conePoints.map(p => p.radiusKm);

  const maxHour = hours[hours.length - 1];
  const smoothTrack = [];

  for (let h = 0; h <= maxHour; h += 2) {
    // 尋找插值區間
    let idx = 0;
    for (let i = 0; i < hours.length - 1; i++) {
      if (h >= hours[i] && h <= hours[i+1]) {
        idx = i;
        break;
      }
    }

    const h1 = hours[idx], h2 = hours[idx+1];
    const t = (h2 === h1) ? 0 : (h - h1) / (h2 - h1);

    // 線性/平滑插值經緯度與誤差半徑
    const interpLat = lats[idx] + t * (lats[idx+1] - lats[idx]);
    const interpLon = lons[idx] + t * (lons[idx+1] - lons[idx]);
    const interpRadius = radii[idx] + t * (radii[idx+1] - radii[idx]);

    smoothTrack.push({ hours: h, lat: interpLat, lon: interpLon, radiusKm: interpRadius });
  }

  // 2. 構建 circles_segment1 (<=72h) 與 circles_segment2 (>72h)
  const circlesSeg1 = [];
  const circlesSeg2 = [];
  let circle72Geom = null;

  smoothTrack.forEach(pt => {
    // Turf 使用 [lon, lat] 座標順序
    const circlePoly = turf.circle([pt.lon, pt.lat], pt.radiusKm, { units: 'kilometers', steps: 32 });

    if (pt.hours <= 72) {
      circlesSeg1.push(circlePoly);
    } else {
      circlesSeg2.push(circlePoly);
    }

    // 捕獲接近 72h 的焦點圓
    if (Math.abs(pt.hours - 72) <= 1) {
      circle72Geom = circlePoly;
    }
  });

  // 3. 求解 envelope_first = unary_union(circles_segment1)
  let envelopeFirst = null;
  if (circlesSeg1.length > 0) {
    envelopeFirst = circlesSeg1[0];
    for (let i = 1; i < circlesSeg1.length; i++) {
      try {
        envelopeFirst = turf.union(envelopeFirst, circlesSeg1[i]);
      } catch (e) {}
    }
  }

  // 4. 求解 envelope_second = unary_union(circles_segment2)
  let envelopeSecond = null;
  if (circlesSeg2.length > 0) {
    envelopeSecond = circlesSeg2[0];
    for (let i = 1; i < circlesSeg2.length; i++) {
      try {
        envelopeSecond = turf.union(envelopeSecond, circlesSeg2[i]);
      } catch (e) {}
    }
  }

  // 5. 處理重疊 (Handle Envelope Overlaps)
  // envelope_second = difference(circle_72h_geom)
  if (envelopeSecond && circle72Geom) {
    try {
      const diff72 = turf.difference(envelopeSecond, circle72Geom);
      if (diff72) envelopeSecond = diff72;
    } catch(e) {}
  }

  // envelope_second_no_overlap = difference(envelope_first)
  let envelopeSecondNoOverlap = envelopeSecond;
  if (envelopeFirst && envelopeSecond) {
    try {
      const diffFirst = turf.difference(envelopeSecond, envelopeFirst);
      if (diffFirst) envelopeSecondNoOverlap = diffFirst;
    } catch(e) {}
  }

  // 6. 渲染 GeoJSON 多邊形至地圖
  // 第一區段 (0-72h) 錐體
  if (envelopeFirst) {
    const seg1Layer = L.geoJSON(envelopeFirst, {
      style: {
        color: 'rgba(255, 255, 255, 0.45)',
        weight: 1.5,
        fillColor: 'rgba(255, 255, 255, 0.16)',
        fillOpacity: 1
      }
    }).addTo(map);
    mapLayers.push(seg1Layer);
  }

  // 第二區段 (>72h) 錐體
  if (envelopeSecondNoOverlap) {
    const seg2Layer = L.geoJSON(envelopeSecondNoOverlap, {
      style: {
        color: 'rgba(255, 255, 255, 0.3)',
        weight: 1,
        dashArray: '4, 4',
        fillColor: 'rgba(255, 255, 255, 0.08)',
        fillOpacity: 1
      }
    }).addTo(map);
    mapLayers.push(seg2Layer);
  }
}

async function loadTCData() {
  const updateClock = document.getElementById('updateClock');
  updateClock.textContent = "更新時間：" + new Date().toLocaleTimeString('zh-HK', {hour: '2-digit', minute:'2-digit'});

  const indexUrl = "https://www.weather.gov.hk/wxinfo/currwx/tc_list.xml";
  const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(indexUrl)}`;

  try {
    const res = await fetch(proxyUrl, { cache: 'no-store' });
    if (!res.ok) throw new Error("tc_list.xml 獲取失敗");
    const xmlText = await res.text();
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xmlText, "text/xml");

    const cyclones = Array.from(xmlDoc.querySelectorAll("TropicalCyclone"));

    if (cyclones.length === 0) {
      renderEmptyState();
      return;
    }

    const parsedTCList = [];

    for (const tc of cyclones) {
      const cName = tc.querySelector("TropicalCycloneChineseName")?.textContent || "";
      const eName = tc.querySelector("TropicalCycloneEnglishName")?.textContent || "";
      let trackUrl = tc.querySelector("TropicalCycloneURL")?.textContent || "";

      if (trackUrl.startsWith("http://")) trackUrl = trackUrl.replace("http://", "https://");

      try {
        const trackRes = await fetch(`https://corsproxy.io/?url=${encodeURIComponent(trackUrl)}`, { cache: 'no-store' });
        if (!trackRes.ok) continue;
        const trackXmlText = await trackRes.text();
        const trackXml = parser.parseFromString(trackXmlText, "text/xml");

        const xmlNameNode = trackXml.querySelector("TropicalCycloneName");
        const stormName = cName || eName || (xmlNameNode ? xmlNameNode.textContent.trim() : "熱帶氣旋");

        // 歷史點
        const pastNodes = Array.from(trackXml.querySelectorAll("PastInformation"));
        const pastPoints = [];
        pastNodes.forEach(pt => {
          const lat = parseCoord(pt.querySelector("Latitude, lat")?.textContent);
          const lon = parseCoord(pt.querySelector("Longitude, lon")?.textContent);
          const wind = pt.querySelector("MaximumWind, MaxWind")?.textContent || "--";
          const cat = pt.querySelector("Intensity, Category")?.textContent || "";
          const time = pt.querySelector("Time")?.textContent || "";

          if (!isNaN(lat) && !isNaN(lon)) {
            pastPoints.push({
              type: 'Past',
              typeLabel: '歷史定位',
              lat, lon, wind,
              cat: getCategoryKey(cat, wind),
              time,
              hours: null,
              radiusKm: null
            });
          }
        });

        // 當前分析點 (0h)
        const analysisNode = trackXml.querySelector("AnalysisInformation");
        let currentPoint = null;
        if (analysisNode) {
          const lat = parseCoord(analysisNode.querySelector("Latitude, lat")?.textContent);
          const lon = parseCoord(analysisNode.querySelector("Longitude, lon")?.textContent);
          const wind = analysisNode.querySelector("MaximumWind, MaxWind")?.textContent || "--";
          const cat = analysisNode.querySelector("Intensity, Category")?.textContent || "";
          const time = analysisNode.querySelector("Time")?.textContent || "";

          if (!isNaN(lat) && !isNaN(lon)) {
            currentPoint = {
              type: 'Current',
              typeLabel: '當前分析位置 (0h)',
              lat, lon, wind,
              cat: getCategoryKey(cat, wind),
              time,
              hours: 0,
              radiusKm: STANDARD_ERROR_RADIUS[0]
            };
          }
        }

        // 預測點
        const forecastNodes = Array.from(trackXml.querySelectorAll("ForecastInformation"));
        const forecastPoints = [];

        forecastNodes.forEach(pt => {
          const intensityNode = pt.querySelector("Intensity");
          const intensityText = intensityNode ? intensityNode.textContent.trim() : "";

          if (!intensityText) return; // 僅當包含 Intensity 時才繪製

          const lat = parseCoord(pt.querySelector("Latitude, lat")?.textContent);
          const lon = parseCoord(pt.querySelector("Longitude, lon")?.textContent);
          const wind = pt.querySelector("MaximumWind, MaxWind")?.textContent || "--";
          const time = pt.querySelector("Time")?.textContent || "";

          const indexVal = parseInt(pt.querySelector("Index")?.textContent || "0", 10);
          const h = !isNaN(indexVal) && indexVal > 0 ? indexVal : 0;
          const r = STANDARD_ERROR_RADIUS[h] !== undefined ? STANDARD_ERROR_RADIUS[h] : Math.round(15 + (450 / 120) * h);

          if (!isNaN(lat) && !isNaN(lon)) {
            forecastPoints.push({
              type: 'Forecast',
              typeLabel: `+${h}小時 預測位置`,
              lat, lon, wind,
              cat: getCategoryKey(intensityText, wind),
              time,
              hours: h,
              radiusKm: r
            });
          }
        });

        parsedTCList.push({
          name: stormName,
          englishName: eName,
          pastPoints,
          currentPoint,
          forecastPoints
        });

      } catch (e) {
        console.error("解析異常:", e);
      }
    }

    currentTCData = parsedTCList;
    if (parsedTCList.length > 0) {
      renderTCs(parsedTCList);
    } else {
      renderEmptyState();
    }

  } catch (err) {
    console.error("數據擷取失敗:", err);
    document.getElementById('quickSelectList').innerHTML = "<div style='font-size:0.78rem; color:#ef4444;'>獲取失敗</div>";
    document.getElementById('sidebarCards').innerHTML = "<div style='text-align:center; padding:20px; color:#ef4444; font-size:0.88rem;'>無法連接氣旋數據源</div>";
  }
}

function renderTCs(tcList) {
  clearMapLayers();
  
  const quickSelectEl = document.getElementById('quickSelectList');
  const sidebarEl = document.getElementById('sidebarCards');
  quickSelectEl.innerHTML = "";
  sidebarEl.innerHTML = "";

  tcList.forEach(tc => {
    const activePoint = tc.currentPoint || tc.pastPoints[tc.pastPoints.length - 1] || tc.forecastPoints[0];
    if (!activePoint) return;

    const catInfo = INTENSITY_CONFIG[activePoint.cat] || INTENSITY_CONFIG['TD'];
    // Requirement 1: 計算相對於澳門的距離
    const distMacau = calcDistance(activePoint.lat, activePoint.lon, MACAU_COORDS[0], MACAU_COORDS[1]);

    // 快捷選單
    const qsItem = document.createElement('div');
    qsItem.className = 'overlay-storm-item';
    qsItem.innerHTML = `
      <span><strong style="color:${catInfo.color}">● ${catInfo.name}</strong> ${tc.name}</span>
      <button class="btn-mini" onclick="focusStorm(${activePoint.lat}, ${activePoint.lon})">聚焦</button>
    `;
    quickSelectEl.appendChild(qsItem);

    // 初始化頁籤狀態
    if (!activeTabState[tc.name]) {
      activeTabState[tc.name] = 'forecast';
    }

    // 側邊欄卡片 (包含 Requirement 4: 預測/歷史路徑切換按鈕)
    const card = document.createElement('div');
    card.className = 'tc-card';
    card.id = `card-${tc.name}`;
    
    renderCardContent(card, tc, activePoint, catInfo, distMacau);
    sidebarEl.appendChild(card);

    // ------------------- 地圖繪製 ------------------- //

    // 1. 歷史路徑 (無誤差圈，點擊顯示數據)
    if (tc.pastPoints.length > 0) {
      const pastCoords = tc.pastPoints.map(p => [p.lat, p.lon]);
      if (tc.currentPoint) pastCoords.push([tc.currentPoint.lat, tc.currentPoint.lon]);

      const pastLine = L.polyline(pastCoords, { color: '#94a3b8', weight: 2, opacity: 0.75 }).addTo(map);
      mapLayers.push(pastLine);

      tc.pastPoints.forEach(pt => {
        const pCat = INTENSITY_CONFIG[pt.cat] || INTENSITY_CONFIG['TD'];
        const marker = L.circleMarker([pt.lat, pt.lon], {
          radius: 4,
          fillColor: pCat.color,
          color: '#ffffff',
          weight: 1,
          fillOpacity: 1
        }).addTo(map);

        bindPointDataPopup(marker, tc.name, pt);
        mapLayers.push(marker);
      });
    }

    // 2. 當前點 (0h) 與預測路徑點集合
    const conePoints = [];
    if (tc.currentPoint) conePoints.push(tc.currentPoint);
    tc.forecastPoints.forEach(fp => conePoints.push(fp));

    if (conePoints.length > 1) {
      const fcCoords = conePoints.map(p => [p.lat, p.lon]);
      const fcLine = L.polyline(fcCoords, { color: '#ffffff', weight: 2, dashArray: '5, 6', opacity: 0.9 }).addTo(map);
      mapLayers.push(fcLine);

      // Requirement 2: 執行 Turf.js 平滑分段誤差錐
      if (showCone) {
        drawSmoothSegmentedCone(conePoints);
      }
    }

    // 3. 繪製圖示標記與彈窗
    conePoints.forEach(pt => {
      const pCat = INTENSITY_CONFIG[pt.cat] || INTENSITY_CONFIG['TD'];
      const iconSize = pt.type === 'Current' ? 24 : 18;
      
      const marker = L.marker([pt.lat, pt.lon], {
        icon: createCycloneIcon(pCat.color, iconSize),
        zIndexOffset: pt.type === 'Current' ? 1000 : 500
      }).addTo(map);

      bindPointDataPopup(marker, tc.name, pt);
      mapLayers.push(marker);
    });
  });
}

// Requirement 4: 渲染側邊欄卡片內容與頁籤切換
function renderCardContent(cardEl, tc, activePoint, catInfo, distMacau) {
  const currentTab = activeTabState[tc.name];

  let listHTML = '';
  if (currentTab === 'forecast') {
    listHTML = tc.forecastPoints.map(fp => {
      const fCat = INTENSITY_CONFIG[fp.cat] || INTENSITY_CONFIG['TD'];
      return `
        <div class="track-row" onclick="focusStorm(${fp.lat}, ${fp.lon})">
          <span>+${fp.hours}h 預測</span>
          <span class="badge-tag" style="background:${fCat.color}">${fCat.name}</span>
          <span>${fp.wind}</span>
          <span style="color:var(--text-muted); font-size:0.72rem;">±${fp.radiusKm}km</span>
        </div>
      `;
    }).join('');
  } else {
    listHTML = tc.pastPoints.map(pp => {
      const pCat = INTENSITY_CONFIG[pp.cat] || INTENSITY_CONFIG['TD'];
      const timeStr = pp.time ? new Date(pp.time).toLocaleString('zh-HK', {day:'numeric', hour:'2-digit', minute:'2-digit'}) : '歷史';
      return `
        <div class="track-row" onclick="focusStorm(${pp.lat}, ${pp.lon})">
          <span>${timeStr}</span>
          <span class="badge-tag" style="background:${pCat.color}">${pCat.name}</span>
          <span>${pp.wind}</span>
        </div>
      `;
    }).join('');
  }

  cardEl.innerHTML = `
    <div class="tc-title">
      <span class="badge-tag" style="background:${catInfo.color}">${catInfo.name}</span>
      ${tc.name} ${tc.englishName ? `(${tc.englishName})` : ''}
    </div>
    <div class="tc-grid">
      <div class="tc-grid-item"><label>當前位置 (0h)</label><val>${activePoint.lat.toFixed(2)}°N ${activePoint.lon.toFixed(2)}°E</val></div>
      <div class="tc-grid-item"><label>距澳門距離</label><val>${distMacau} km</val></div>
      <div class="tc-grid-item"><label>中心最高風速</label><val>${activePoint.wind}</val></div>
      <div class="tc-grid-item"><label>0h 誤差半徑</label><val>15 km</val></div>
    </div>
    
    <!-- 切換按鈕組 -->
    <div class="tab-group">
      <button class="tab-btn ${currentTab === 'forecast' ? 'active' : ''}" onclick="toggleTab('${tc.name}', 'forecast')">預測路徑 (${tc.forecastPoints.length})</button>
      <button class="tab-btn ${currentTab === 'past' ? 'active' : ''}" onclick="toggleTab('${tc.name}', 'past')">歷史路徑 (${tc.pastPoints.length})</button>
    </div>

    <div class="track-list">
      ${listHTML || '<div style="text-align:center; padding:6px; color:var(--text-muted);">無資料</div>'}
    </div>
  `;
}

function toggleTab(stormName, tabType) {
  activeTabState[stormName] = tabType;
  const tc = currentTCData.find(t => t.name === stormName);
  if (!tc) return;

  const cardEl = document.getElementById(`card-${stormName}`);
  if (cardEl) {
    const activePoint = tc.currentPoint || tc.pastPoints[tc.pastPoints.length - 1] || tc.forecastPoints[0];
    const catInfo = INTENSITY_CONFIG[activePoint.cat] || INTENSITY_CONFIG['TD'];
    const distMacau = calcDistance(activePoint.lat, activePoint.lon, MACAU_COORDS[0], MACAU_COORDS[1]);
    renderCardContent(cardEl, tc, activePoint, catInfo, distMacau);
  }
}

// 點擊節點彈出數據窗口 (Requirement 1: 顯示距離澳門公里數)
function bindPointDataPopup(marker, stormName, pt) {
  const pCat = INTENSITY_CONFIG[pt.cat] || INTENSITY_CONFIG['TD'];
  const dist = calcDistance(pt.lat, pt.lon, MACAU_COORDS[0], MACAU_COORDS[1]);
  const formattedTime = pt.time ? new Date(pt.time).toLocaleString('zh-HK', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '--';

  const popupHTML = `
    <div class="popup-data-box">
      <div style="font-weight:bold; border-bottom:1px solid rgba(255,255,255,0.15); padding-bottom:3px; margin-bottom:4px;">
        ${stormName} - ${pt.typeLabel}
      </div>
      <div><strong>強度等級：</strong><span class="badge-tag" style="background:${pCat.color}">${pCat.name}</span></div>
      <div><strong>中心座標：</strong>${pt.lat.toFixed(2)}°N, ${pt.lon.toFixed(2)}°E</div>
      <div><strong>中心最高風速：</strong>${pt.wind}</div>
      <div><strong>報告時間：</strong>${formattedTime}</div>
      <div><strong>距離澳門：</strong>約 ${dist} km</div>
      ${pt.radiusKm ? `<div><strong>潛在路徑誤差半徑：</strong>±${pt.radiusKm} km</div>` : ''}
    </div>
  `;

  marker.bindPopup(popupHTML, { offset: [0, -5] });
}

function focusStorm(lat, lon) {
  map.flyTo([lat, lon], 6, { duration: 1.0 });
}

function renderEmptyState() {
  document.getElementById('quickSelectList').innerHTML = "<div style='font-size:0.78rem;'>無活躍熱帶氣旋</div>";
  document.getElementById('sidebarCards').innerHTML = "<div style='text-align:center; padding:20px; color:var(--text-muted); font-size:0.88rem;'>西北太平洋及南海當前無活躍熱帶氣旋系統</div>";
}

window.addEventListener('DOMContentLoaded', () => {
  initMap();
  loadTCData();
  setInterval(loadTCData, 300000);
});
</script>
