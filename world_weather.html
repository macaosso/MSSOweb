<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="icons/MSSO.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<title>澳門民間氣象台 - 世界城市天氣預報</title>
<style>
/* ========== 1. 深太空 全域主題基礎 ========== */
:root {
  --bg-dark: #0b0f19;
  --card-bg: rgba(22, 30, 46, 0.75);
  --card-bg-light: rgba(255, 255, 255, 0.03);
  --card-border: rgba(255, 255, 255, 0.08);
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  
  --accent-blue: #38bdf8;
  --accent-teal: #2dd4bf;
  --accent-green: #34d399;
  --accent-yellow: #facc15;
  --accent-orange: #f59e0b;
  --accent-red: #ef4444;
  --accent-purple: #c084fc;
}

body.light-theme {
  --bg-dark: #f8fafc;
  --card-bg: rgba(255, 255, 255, 0.85);
  --card-bg-light: rgba(0, 0, 0, 0.04);
  --card-border: rgba(0, 0, 0, 0.12);
  --text-main: #0f172a;
  --text-muted: #64748b;

  --accent-blue: #0284c7;
  --accent-teal: #0d9488;
  --accent-green: #059669;
  --accent-yellow: #d97706;
  --accent-orange: #d97706;
  --accent-red: #dc2626;
  --accent-purple: #9333ea;
}

html { scroll-behavior: smooth; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-main);
  line-height: 1.6;
  transition: background-color 0.3s ease, color 0.3s ease;
}

.page-wrapper {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 15px 40px 15px;
}

/* ========== 2. 頂欄導航 ========== */
.header-nav-container {
  position: sticky;
  top: 0;
  z-index: 3000;
  background: rgba(11, 15, 25, 0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--card-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 1.5rem;
  margin-bottom: 20px;
  transition: background 0.3s ease;
}
body.light-theme .header-nav-container { background: rgba(248, 250, 252, 0.88); }

.header { display: flex; align-items: center; gap: 12px; }
.logo { height: 38px; width: auto; filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.3)); }
.title {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--accent-blue);
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.header-clock {
  font-size: 0.88rem;
  font-weight: 500;
  color: var(--accent-teal);
  font-variant-numeric: tabular-nums;
}

.menu-container { position: relative; display: flex; align-items: center; gap: 10px; }

.theme-toggle-btn {
  background: var(--card-bg-light);
  border: 1px solid var(--card-border);
  color: var(--text-main);
  padding: 8px 12px;
  border-radius: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.25s ease;
}
.theme-toggle-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
.sun-icon { display: block; }
.moon-icon { display: none; }
body.light-theme .sun-icon { display: none; }
body.light-theme .moon-icon { display: block; }

.menu-toggle {
  display: none;
  font-size: 22px;
  padding: 6px 12px;
  cursor: pointer;
  background: var(--card-bg-light);
  border: 1px solid var(--card-border);
  color: var(--text-main);
  border-radius: 8px;
}

.nav { display: flex; gap: 8px; align-items: center; }
.nav a {
  color: var(--text-muted);
  padding: 8px 14px;
  font-size: 0.92rem;
  font-weight: 500;
  text-decoration: none;
  border-radius: 20px;
  transition: all 0.2s ease;
}
.nav a:hover, .nav a.active { color: var(--text-main); background: rgba(255, 255, 255, 0.08); }

/* 下拉選單 */
.dropdown { position: relative; display: inline-block; }
.dropdown-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  padding: 8px 14px;
  font-size: 0.92rem;
  font-weight: 500;
  border-radius: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}
.dropdown-content {
  position: absolute;
  top: 100%;
  left: 0;
  min-width: 190px;
  background: rgba(15, 23, 42, 0.95);
  backdrop-filter: blur(16px);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 6px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.25s ease, visibility 0s linear 0.25s;
  z-index: 3100;
}
body.light-theme .dropdown-content { background: rgba(255, 255, 255, 0.98); }
.dropdown:hover .dropdown-content { opacity: 1; visibility: visible; transition-delay: 0s; }
.dropdown-content a { display: block; padding: 8px 12px; border-radius: 8px; white-space: nowrap; }

/* ========== 3. 世界天氣主控面板 ========== */
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 12px;
}
.section-title {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--accent-blue);
  display: flex;
  align-items: center;
  gap: 8px;
}

.controls-bar {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
}

.region-tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.tab-chip {
  background: var(--card-bg-light);
  border: 1px solid var(--card-border);
  color: var(--text-muted);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}
.tab-chip:hover { border-color: var(--accent-blue); color: var(--text-main); }
.tab-chip.active {
  background: var(--accent-blue);
  color: #fff;
  border-color: var(--accent-blue);
  box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
}

.search-box-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  max-width: 320px;
  min-width: 200px;
}
.search-input {
  width: 100%;
  background: var(--card-bg-light);
  border: 1px solid var(--card-border);
  color: var(--text-main);
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 13.5px;
  outline: none;
  transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--accent-blue); }

.auto-update-status {
  font-size: 12px;
  color: var(--accent-teal);
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 500;
}
.refresh-btn {
  background: rgba(45, 212, 191, 0.15);
  border: 1px solid rgba(45, 212, 191, 0.3);
  color: var(--accent-teal);
  padding: 4px 10px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: all 0.2s;
}
.refresh-btn:hover { background: var(--accent-teal); color: #fff; }

/* ========== 4. 地圖容器 ========== */
.map-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  margin-bottom: 24px;
}
#worldMap {
  height: 480px;
  width: 100%;
  z-index: 100;
}

/* Custom Popup Style */
.custom-popup .leaflet-popup-content-wrapper {
  background: rgba(15, 23, 42, 0.92);
  backdrop-filter: blur(10px);
  color: #f1f5f9;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 12px;
  padding: 4px;
}
body.light-theme .custom-popup .leaflet-popup-content-wrapper {
  background: rgba(255, 255, 255, 0.95);
  color: #0f172a;
  border-color: rgba(0, 0, 0, 0.12);
}
.custom-popup .leaflet-popup-tip {
  background: rgba(15, 23, 42, 0.92);
}
body.light-theme .custom-popup .leaflet-popup-tip {
  background: rgba(255, 255, 255, 0.95);
}
.popup-content { text-align: center; padding: 6px 10px; }
.popup-city { font-size: 15px; font-weight: 700; color: var(--accent-blue); margin-bottom: 4px; }
.popup-temp { font-size: 20px; font-weight: 800; color: var(--accent-yellow); margin: 4px 0; }
.popup-desc { font-size: 13px; color: var(--text-muted); }

/* ========== 5. 天氣列表表格 ========== */
.table-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
}
.table-header-row {
  padding: 16px 20px;
  border-bottom: 1px solid var(--card-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.table-responsive {
  width: 100%;
  overflow-x: auto;
}
.weather-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 14px;
}
.weather-table th {
  background: rgba(0, 0, 0, 0.2);
  color: var(--text-muted);
  font-weight: 600;
  padding: 12px 16px;
  border-bottom: 1px solid var(--card-border);
  white-space: nowrap;
}
body.light-theme .weather-table th { background: rgba(0, 0, 0, 0.03); }
.weather-table td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--card-border);
  color: var(--text-main);
  vertical-align: middle;
  white-space: nowrap;
}
.weather-table tr:hover {
  background: rgba(56, 189, 248, 0.05);
}
.city-name-td {
  font-weight: 700;
  color: var(--accent-blue);
}
.temp-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 6px;
  background: rgba(56, 189, 248, 0.15);
  color: var(--accent-blue);
  font-weight: 700;
}
.region-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
  background: var(--card-bg-light);
  border: 1px solid var(--card-border);
  color: var(--accent-teal);
}

.weather-icon-inline {
  width: 28px;
  height: 28px;
  vertical-align: middle;
  margin-right: 6px;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
}

#statusMsg {
  text-align: center;
  padding: 30px;
  color: var(--text-muted);
  font-size: 14px;
}

@media (max-width: 768px) {
  .menu-toggle { display: block; }
  .nav {
    display: none;
    flex-direction: column;
    width: 230px;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 10px;
  }
  .nav.active { display: flex; }
  .controls-bar { flex-direction: column; align-items: stretch; }
  .search-box-wrap { max-width: 100%; }
  #worldMap { height: 360px; }
}
</style>
</head>

<div class="page-wrapper">

  </div>

</div>

  "紐約": [40.7128, -74.0060], "洛杉磯": [34.0522, -118.2437], "芝加哥": [41.8781, -87.6298], "舊金山": [37.7749, -122.4194],
  "多倫多": [43.6532, -79.3832], "溫哥華": [49.2827, -123.1207], "墨西哥城": [19.4326, -99.1332],

  // 南美洲
  "聖保羅": [-23.5505, -46.6333], "里約熱內盧": [-22.9068, -43.1729], "布宜諾斯艾利斯": [-34.6037, -58.3816], "波哥大": [4.7110, -74.0721],
  "利馬": [-12.0463, -77.0428], "聖地亞哥": [-33.4489, -70.6693]
};

/* ========== 2. 數據源 URL 清單 ========== */
const XML_SOURCES = [
  { region: "china", name: "中國主要城市", url: "https://xml.smg.gov.mo/c_china.xml" },
  { region: "gdcity", name: "廣東省城市", url: "https://xml.smg.gov.mo/c_gdcity.xml" },
  { region: "asia", name: "亞洲", url: "https://xml.smg.gov.mo/c_asia.xml" },
  { region: "europe", name: "歐洲", url: "https://xml.smg.gov.mo/c_europe.xml" },
  { region: "africa", name: "非洲", url: "https://xml.smg.gov.mo/c_africa.xml" },
  { region: "australia", name: "澳洲及大洋洲", url: "https://xml.smg.gov.mo/c_australia.xml" },
  { region: "namerica", name: "北美洲", url: "https://xml.smg.gov.mo/c_namerica.xml" },
  { region: "samerica", name: "南美洲", url: "https://xml.smg.gov.mo/c_samerica.xml" }
];

let allWeatherData = [];
let currentRegionFilter = "ALL";
let currentSearchQuery = "";
let map, markersGroup;
let tileLayerDark, tileLayerLight;
let refreshTimerSec = 300;
let timerInterval = null;

/* ========== 3. 地圖與主題初始化 ========== */
function initMap() {
  map = L.map('worldMap', {
    center: [20, 10],
    zoom: 2,
    zoomControl: true
  });

  tileLayerDark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    maxZoom: 18
  });

  tileLayerLight = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    maxZoom: 18
  });

  const isLight = document.body.classList.contains('light-theme');
  if (isLight) tileLayerLight.addTo(map);
  else tileLayerDark.addTo(map);

  markersGroup = L.layerGroup().addTo(map);
}

function updateMapTiles() {
  const isLight = document.body.classList.contains('light-theme');
  if (isLight) {
    if (map.hasLayer(tileLayerDark)) map.removeLayer(tileLayerDark);
    tileLayerLight.addTo(map);
  } else {
    if (map.hasLayer(tileLayerLight)) map.removeLayer(tileLayerLight);
    tileLayerDark.addTo(map);
  }
}

function applyTheme(theme) {
  if (theme === 'light') {
    document.body.classList.add('light-theme');
  } else {
    document.body.classList.remove('light-theme');
  }
  updateMapTiles();
}

function toggleTheme() {
  const isLight = document.body.classList.contains('light-theme');
  const newTheme = isLight ? 'dark' : 'light';
  localStorage.setItem('msso_theme', newTheme);
  applyTheme(newTheme);
}

(function initTheme() {
  const savedTheme = localStorage.getItem('msso_theme');
  if (savedTheme === 'light') document.body.classList.add('light-theme');
})();

function toggleMenu() {
  const nav = document.getElementById("navMenu");
  nav.classList.toggle("active");
}

function updateHeaderClock() {
  const clockEl = document.getElementById('headerClock');
  if (clockEl) {
    const now = new Date();
    const hrs = String(now.getHours()).padStart(2, '0');
    const mins = String(now.getMinutes()).padStart(2, '0');
    const secs = String(now.getSeconds()).padStart(2, '0');
    clockEl.textContent = ` ${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${hrs}:${mins}:${secs}`;
  }
}

/* ========== 4. 多源 XML 通用強健解析邏輯 ========== */
async function fetchSingleFeed(source) {
  const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(source.url)}`;
  try {
    const response = await fetch(proxyUrl, { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
    const xmlText = await response.text();
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xmlText, "text/xml");

    const pubDate = xmlDoc.querySelector("SysPubdate")?.textContent?.trim() || 
                    xmlDoc.querySelector("PubDate")?.textContent?.trim() || "";

    // 獲取所有可能的城市標籤節點
    const cityNodes = Array.from(xmlDoc.querySelectorAll("City, WeatherCity, CityForecast, Item, Record, CityData, Weather"));
    
    let items = [];
    cityNodes.forEach(node => {
      const allEls = Array.from(node.getElementsByTagName("*"));
      
      let cityName = "";
      let weatherDesc = "";
      let iconUrl = "";
      let tempMin = null, tempMax = null, tempVal = "";

      // 解析城市名稱
      for (let el of allEls) {
        const tag = el.nodeName.toLowerCase();
        if (tag.includes("cityname") || tag.includes("c_name") || tag === "city" || tag === "name") {
          cityName = el.textContent.trim();
          if (cityName) break;
        }
      }
      if (!cityName && node.getAttribute("name")) cityName = node.getAttribute("name");

      // 解析天氣狀況描述
      for (let el of allEls) {
        const tag = el.nodeName.toLowerCase();
        if (tag.includes("weather") || tag.includes("desc") || tag.includes("summary")) {
          weatherDesc = el.textContent.trim();
          if (weatherDesc && !/^\d+$/.test(weatherDesc)) break;
        }
      }

      // 解析天氣圖標
      for (let el of allEls) {
        const tag = el.nodeName.toLowerCase();
        if (tag.includes("icon")) {
          const txt = el.textContent.trim();
          if (txt) {
            iconUrl = txt.startsWith("http") ? txt : `https://www.smg.gov.mo/${txt.replace(/^\//, '')}`;
            break;
          }
        }
      }

      // 解析氣溫數字
      let nums = [];
      for (let el of allEls) {
        const tag = el.nodeName.toLowerCase();
        if (tag.includes("temp") || tag.includes("temperature")) {
          const m = el.textContent.match(/-?\d+(\.\d+)?/g);
          if (m) {
            m.forEach(v => {
              const n = parseFloat(v);
              if (!isNaN(n) && n >= -60 && n <= 60) nums.push(n);
            });
          }
        }
      }
      nums = [...new Set(nums)];
      if (nums.length >= 2) {
        tempMin = Math.min(...nums);
        tempMax = Math.max(...nums);
        tempVal = `${tempMin} ~ ${tempMax} °C`;
      } else if (nums.length === 1) {
        tempVal = `${nums[0]} °C`;
      }

      // 解析經緯度
      let lat = null, lon = null;
      for (let el of allEls) {
        const tag = el.nodeName.toLowerCase();
        if (tag.includes("lat")) lat = parseFloat(el.textContent);
        if (tag.includes("lon") || tag.includes("lng")) lon = parseFloat(el.textContent);
      }

      if (cityName && (weatherDesc || tempVal)) {
        items.push({
          regionKey: source.region,
          regionName: source.name,
          city: cityName,
          weather: weatherDesc || "多雲",
          tempDisplay: tempVal || "-- °C",
          tempMin: tempMin,
          tempMax: tempMax,
          iconUrl: iconUrl,
          pubDate: pubDate,
          coords: (lat && lon) ? [lat, lon] : (CITY_COORDS[cityName] || null)
        });
      }
    });

    return items;
  } catch (err) {
    console.warn(`[SMG XML] 載入 ${source.name} 失敗:`, err);
    return [];
  }
}

async function fetchAllFeeds() {
  const statusEl = document.getElementById("statusMsg");
  statusEl.innerText = "正在從澳門氣象局載入最新天氣數據...";
  statusEl.style.display = "block";

  const promises = XML_SOURCES.map(source => fetchSingleFeed(source));
  const results = await Promise.all(promises);
  
  allWeatherData = results.flat();

  if (allWeatherData.length === 0) {
    statusEl.innerText = "數據載入失敗，請稍後重試。";
  } else {
    statusEl.style.display = "none";
    const now = new Date();
    document.getElementById("pubTimeBadge").innerText = `最後更新時間：${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
  }

  renderData();
  resetTimer();
}

/* ========== 5. 地圖與表格渲染引擎 ========== */
function getFilteredData() {
  return allWeatherData.filter(item => {
    const matchRegion = (currentRegionFilter === "ALL" || item.regionKey === currentRegionFilter);
    const matchSearch = !currentSearchQuery || 
      item.city.toLowerCase().includes(currentSearchQuery) || 
      item.weather.toLowerCase().includes(currentSearchQuery) ||
      item.regionName.toLowerCase().includes(currentSearchQuery);
    return matchRegion && matchSearch;
  });
}

function renderData() {
  const filtered = getFilteredData();
  
  // 1. 渲染表格
  const tbody = document.getElementById("weatherTableBody");
  tbody.innerHTML = "";

  if (filtered.length === 0) {
    document.getElementById("statusMsg").innerText = "沒有符合條件的城市天氣數據。";
    document.getElementById("statusMsg").style.display = "block";
  } else {
    document.getElementById("statusMsg").style.display = "none";
  }

  filtered.forEach(item => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><span class="region-badge">${item.regionName}</span></td>
      <td class="city-name-td">${item.city}</td>
      <td>
        ${item.iconUrl ? `<img src="${item.iconUrl}" class="weather-icon-inline" alt="icon" onerror="this.style.display='none'">` : ''}
        ${item.weather}
      </td>
      <td><span class="temp-badge">${item.tempDisplay}</span></td>
      <td>${item.tempMin !== null ? `${item.tempMin}℃` : '--'} / ${item.tempMax !== null ? `${item.tempMax}℃` : '--'}</td>
      <td style="font-size:12px; color:var(--text-muted);">${item.pubDate || '實時'}</td>
    `;
    tbody.appendChild(tr);
  });

  // 2. 渲染地圖 Marker
  markersGroup.clearLayers();
  const validBounds = [];

  filtered.forEach(item => {
    if (item.coords) {
      const marker = L.circleMarker(item.coords, {
        radius: 7,
        fillColor: "#38bdf8",
        color: "#ffffff",
        weight: 2,
        opacity: 0.9,
        fillOpacity: 0.8
      });

      const popupHtml = `
        <div class="popup-content">
          <div class="popup-city">${item.city} <span style="font-size:11px; opacity:0.8;">(${item.regionName})</span></div>
          ${item.iconUrl ? `<img src="${item.iconUrl}" style="width:36px;height:36px;" alt="weather icon">` : ''}
          <div class="popup-temp">${item.tempDisplay}</div>
          <div class="popup-desc">${item.weather}</div>
        </div>
      `;

      marker.bindPopup(popupHtml, { className: 'custom-popup' });
      markersGroup.addLayer(marker);
      validBounds.push(item.coords);
    }
  });

  if (validBounds.length > 0 && currentRegionFilter !== "ALL") {
    map.fitBounds(validBounds, { padding: [40, 40], maxZoom: 6 });
  } else if (currentRegionFilter === "ALL") {
    map.setView([20, 10], 2);
  }
}

/* ========== 6. 自動定時器與事件處理 ========== */
function resetTimer() {
  refreshTimerSec = 300;
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    refreshTimerSec--;
    document.getElementById("updateTimer").innerText = `自動更新：${refreshTimerSec}s`;
    if (refreshTimerSec <= 0) {
      fetchAllFeeds();
    }
  }, 1000);
}

document.addEventListener("DOMContentLoaded", () => {
  updateHeaderClock();
  setInterval(updateHeaderClock, 1000);
  initMap();

  // 區域切換
  document.getElementById("regionTabs").addEventListener("click", (e) => {
    if (e.target.classList.contains("tab-chip")) {
      document.querySelectorAll(".tab-chip").forEach(c => c.classList.remove("active"));
      e.target.classList.add("active");
      currentRegionFilter = e.target.dataset.region;
      renderData();
    }
  });

  // 即時搜尋
  document.getElementById("searchInput").addEventListener("input", (e) => {
    currentSearchQuery = e.target.value.trim().toLowerCase();
    renderData();
  });

  // 載入 XML 數據
  fetchAllFeeds();
});
</script>
