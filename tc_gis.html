<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MSSO-GIS熱帶氣旋路徑預測 | 澳門民間氣象台 MSSO</title>
<link rel="icon" type="image/png" href="icons/MSSO.png">

<!-- Leaflet & Turf Libraries -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-curve/leaflet.curve.js"></script>

<style>
/* ========== 全域深色 Dashboard 基底 ========== */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background-color: #0f172a;
  color: #f8fafc;
  box-sizing: border-box;
}
* {
  box-sizing: border-box;
}

/* ========== 地圖容器 ========== */
#map {
  position: absolute;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 1;
  background: #0b0f19;
}

/* ========== 玻璃擬態 (Glassmorphism) ========== */
.glass-panel {
  background: rgba(15, 23, 42, 0.85);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}

/* ========== 頂部 Header ========== */
.header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 2000;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}
.logo {
  height: 34px;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
}
.title {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #f8fafc;
  white-space: nowrap;
}

/* ========== 熱帶氣旋切換器 ========== */
.tc-selector-container {
  margin-left: 15px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tc-select-label {
  font-size: 13px;
  color: #94a3b8;
  white-space: nowrap;
}
.tc-select {
  background: rgba(30, 41, 59, 0.85);
  color: #38bdf8;
  border: 1px solid rgba(56, 189, 248, 0.4);
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  outline: none;
  cursor: pointer;
  transition: all 0.2s ease;
}
.tc-select:hover, .tc-select:focus {
  border-color: #38bdf8;
  box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
}

/* ========== 導航選單 (與 index.html 同步) ========== */
.menu-container {
  position: relative;
  z-index: 3000;
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}
.menu-toggle {
  display: none;
  font-size: 20px;
  padding: 6px 12px;
  cursor: pointer;
  background: rgba(255,255,255,0.05);
  color: white;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.2);
  transition: background 0.3s;
}
.menu-toggle:hover {
  background: rgba(255,255,255,0.15);
}
.nav {
  display: flex;
  gap: 6px;
  align-items: center;
}
.nav a {
  color: #cbd5e1;
  padding: 8px 14px;
  font-size: 0.92rem;
  font-weight: 500;
  text-decoration: none;
  border-radius: 20px;
  transition: all 0.2s ease;
  display: block;
}
.nav a:hover, .nav a.active {
  background: rgba(56, 189, 248, 0.15);
  color: #38bdf8;
}

/* 下拉選單樣式 */
.dropdown {
  position: relative;
  display: inline-block;
}
.dropdown-btn {
  background: transparent;
  border: none;
  color: #cbd5e1;
  padding: 8px 14px;
  font-size: 0.92rem;
  font-weight: 500;
  font-family: inherit;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 6px;
}
.dropdown-btn .arrow {
  font-size: 0.7rem;
  transition: transform 0.2s ease;
}
.dropdown:hover .dropdown-btn,
.dropdown.active .dropdown-btn {
  color: #f8fafc;
  background: rgba(255, 255, 255, 0.08);
}
.dropdown:hover .arrow,
.dropdown.active .arrow {
  transform: rotate(180deg);
}
.dropdown-content {
  position: absolute;
  top: 100%;
  left: 0;
  min-width: 190px;
  background: rgba(15, 23, 42, 0.95);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  padding: 6px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  z-index: 3100;
  margin-top: 4px;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.25s ease, visibility 0s linear 0.4s;
}
.dropdown:hover .dropdown-content,
.dropdown.active .dropdown-content {
  opacity: 1;
  visibility: visible;
  transition: opacity 0.25s ease, visibility 0s linear 0s;
}
.dropdown-content a {
  padding: 8px 12px;
  border-radius: 8px;
  white-space: nowrap;
  font-size: 0.88rem;
}

/* ========== 桌面端面板容器與佈局 ========== */
.mobile-panels-container {
  display: contents; /* 桌面端解包，維持各自定位 */
}

/* 左下角 TC 資訊面板 */
.tc-info-box {
  position: fixed;
  left: 20px;
  bottom: 55px;
  width: 270px;
  padding: 16px;
  border-radius: 14px;
  font-size: 13px;
  z-index: 1000;
  line-height: 1.6;
  max-height: 50vh;
  overflow-y: auto;
  transition: all 0.3s ease;
}
.tc-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 10px;
  color: #38bdf8;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  padding-bottom: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.tc-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
  color: #94a3b8;
}
.tc-row span {
  color: #f8fafc;
  font-weight: 500;
}

/* 右下角圖例面板 */
.legend {
  position: fixed;
  z-index: 1000;
  right: 20px;
  bottom: 24px;
  width: 270px;
  max-height: 60vh;
  overflow-y: auto;
  padding: 14px 16px;
  border-radius: 14px;
  font-size: 12px;
  color: #cbd5e1;
  transition: all 0.3s ease;
}
.legend b {
  color: #f8fafc;
  display: block;
  margin-top: 8px;
  margin-bottom: 8px;
  font-size: 13px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  padding-bottom: 4px;
}
.legend b:first-child { margin-top: 0; }
.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px 12px;
  margin-bottom: 6px;
}
.legend-grid div, .legend-list div {
  display: flex;
  align-items: center;
  white-space: nowrap;
  font-size: 12px;
  line-height: 1.4;
}
.legend-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* 圖例標記 */
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }
.line { display: inline-block; width: 18px; height: 0; margin-right: 8px; flex-shrink: 0; }
.line.past { border-top: 2.5px solid #ffffff; opacity: 0.85; }
.line.forecast { border-top: 2.5px dashed #ffffff; }
.box { display: inline-block; width: 12px; height: 12px; background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 3px; margin-right: 8px; flex-shrink: 0; }
.macau-legend { display: inline-block; width: 10px; height: 10px; background: #ffffff; border-radius: 2px; margin-right: 8px; flex-shrink: 0; }
.wind { display: inline-block; width: 14px; height: 10px; margin-right: 8px; border-radius: 2px; flex-shrink: 0; }
.wind.yellow { border: 1.5px solid #FFD700; background: rgba(255, 215, 0, 0.3); }
.wind.red { border: 1.5px solid #FF3B30; background: rgba(255, 59, 48, 0.3); }

/* 更新時間 */
#updateTime {
  position: fixed;
  left: 20px;
  bottom: 18px;
  font-size: 11px;
  z-index: 1005;
  padding: 5px 12px;
  border-radius: 20px;
  color: #94a3b8;
}

/* 移動端按鈕 */
.mobile-toggle-btn {
  display: none;
  position: fixed;
  bottom: 18px;
  right: 18px;
  z-index: 1100;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 600;
  color: #38bdf8;
  border-radius: 20px;
  cursor: pointer;
  border: 1px solid rgba(56, 189, 248, 0.3);
}

/* ========== 移動端 RWD 響應式佈局 ========== */
@media (max-width: 768px) {
  .header { padding: 8px 14px; gap: 8px; }
  .title { font-size: 14px; }
  .logo { height: 28px; }
  .tc-selector-container { margin-left: auto; }
  .tc-select { padding: 4px 8px; font-size: 12px; }
  .tc-select-label { display: none; }

  .menu-toggle { display: block; }
  .nav {
    display: none;
    flex-direction: column;
    width: 210px;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    align-items: stretch;
  }
  .nav.active { display: flex; }
  .nav a { width: 100%; padding: 10px 14px; border-radius: 8px; }

  /* 行動端下拉選單展開機制 */
  .dropdown { width: 100%; }
  .dropdown-btn { width: 100%; justify-content: space-between; padding: 10px 14px; border-radius: 8px; }
  .dropdown-content {
    position: static;
    display: none;
    opacity: 1;
    visibility: visible;
    box-shadow: none;
    border: none;
    background: rgba(255, 255, 255, 0.03);
    margin-top: 4px;
    padding-left: 10px;
    border-left: 2px solid #38bdf8;
    border-radius: 0 8px 8px 0;
    transition: none;
  }
  .dropdown.active .dropdown-content { display: block; }

  /* 2. 手機版兩大面板垂直堆疊 (Stacking) */
  .mobile-toggle-btn { display: block; }

  .mobile-panels-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: fixed;
    left: 14px;
    right: 14px;
    bottom: 65px;
    max-height: 65vh;
    overflow-y: auto;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(20px);
    transition: all 0.3s ease;
  }
  .mobile-panels-container.mobile-show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0);
  }

  .tc-info-box, .legend {
    position: static;
    width: 100%;
    max-width: 100%;
    max-height: none;
  }

  #updateTime {
    left: 14px;
    bottom: 18px;
    background: rgba(15, 23, 42, 0.7);
  }
}
</style>
</head>

<script>
// 選單與切換控制邏輯
function toggleMenu() {
  const nav = document.getElementById("navMenu");
  const btn = document.querySelector(".menu-toggle");
  nav.classList.toggle("active");
  btn.innerHTML = nav.classList.contains("active") ? "✕" : "☰";
}

// 點擊「氣旋資訊 / 圖例」開關堆疊面板
function toggleMobilePanel() {
  const container = document.getElementById("mobilePanels");
  container.classList.toggle("mobile-show");
}

// 行動端下拉選單點擊支持
document.addEventListener('DOMContentLoaded', () => {
  const dropdownBtns = document.querySelectorAll('.dropdown-btn');
  dropdownBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const currentDropdown = btn.parentElement;
      document.querySelectorAll('.dropdown').forEach(d => {
        if (d !== currentDropdown) d.classList.remove('active');
      });
      currentDropdown.classList.toggle('active');
    });
  });
  document.addEventListener('click', () => {
    document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('active'));
  });
});

// 模擬更新時間賦值（請在讀取到 TC 數據時呼叫此方法，例如：updateLastTime("2026-08-21 20:00")）
function updateLastTime(timeStr) {
  const el = document.getElementById("updateTime");
  if (el) el.innerText = "更新時間: " + (timeStr || "--");
}

// 地圖初始化與畫圖邏輯維持原樣...
</script>
