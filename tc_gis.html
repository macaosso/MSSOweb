<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>熱帶氣旋 GIS 追蹤地圖</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
      overflow: hidden;
    }
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Selector Control Bar */
    .tc-selector-container {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 14px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .tc-select-label {
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
    }
    .tc-select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }
    .tc-select:hover {
      border-color: #38bdf8;
    }

    /* Info Overlay Box */
    .info-box {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 14px 18px;
      border-radius: 10px;
      min-width: 240px;
      max-width: 300px;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .tc-title {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .tc-row {
      font-size: 13px;
      margin: 4px 0;
      color: #cbd5e1;
    }
    .tc-row span {
      color: #f8fafc;
      font-weight: 600;
    }

    /* Bottom Update Time Badge */
    .update-time-box {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      color: #94a3b8;
    }

    /* Leaflet Time Labels */
    .time-label {
      background: rgba(15, 23, 42, 0.85) !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      color: #f8fafc !important;
      font-size: 11px !important;
      font-weight: 600 !important;
      border-radius: 4px !important;
      padding: 1px 5px !important;
      box-shadow: none !important;
    }
    .time-label::before {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Selector Container -->
  <div class="tc-selector-container">
    <span class="tc-select-label">選擇氣旋:</span>
    <select id="tcSelect" class="tc-select" onchange="onTCChange(this.value)">
      <option value="all">全部熱帶氣旋</option>
    </select>
  </div>

  <!-- Information Panel -->
  <div id="tcInfoBox" class="info-box">
    <div class="tc-title">載入數據中...</div>
  </div>

  <!-- Update Time -->
  <div id="updateTime" class="update-time-box">更新時間: --</div>

  <!-- Map Div -->
  <div id="map"></div>

  <!-- Leaflet JS & Curve Plugin -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet-curve@1.0.0/leaflet.curve.min.js"></script>

  <script>
    // ================= Map Initialization =================
    const macauCoords = [22.1987, 113.5439];
    const isMobile = window.innerWidth <= 768;

    const map = L.map('map', {
      center: [19.5, 116.0],
      zoom: 6,
      zoomControl: false
    });

    // Dark Map Tile Layer
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Custom Layer Panes for Visual Ordering
    map.createPane('conePane');
    map.getPane('conePane').style.zIndex = 350;

    map.createPane('wind41Pane');
    map.getPane('wind41Pane').style.zIndex = 380;

    map.createPane('wind88Pane');
    map.getPane('wind88Pane').style.zIndex = 390;

    const tcLayersGroup = L.layerGroup().addTo(map);

    // Macau Marker
    L.circleMarker(macauCoords, {
      radius: 6,
      color: '#00f0ff',
      fillColor: '#00f0ff',
      fillOpacity: 0.8
    }).addTo(map).bindPopup('<b>澳門特別行政區</b>');

    // ================= Global Data State =================
    const tcKeys = ['A', 'B', 'C', 'D', 'E'];
    let loadedTCs = {};

    // ================= Initialization Logic =================
    async function initTCDropdown() {
      const selectEl = document.getElementById("tcSelect");
      selectEl.innerHTML = '<option value="all">全部熱帶氣旋</option>';

      // Fetch CSVs dynamically
      const fetchPromises = tcKeys.map(async (key) => {
        try {
          const res = await fetch(`tc_${key}.csv`, { cache: "no-cache" });
          if (!res.ok) return null;

          const text = await res.text();
          const parsed = parseCSVToTCData(text);

          // Check requirement: Skip if empty or contains no valid points
          if (parsed && (parsed.forecastPoints.length > 0 || parsed.pastPoints.length > 0)) {
            return { key, data: parsed };
          }
        } catch (e) {
          return null;
        }
        return null;
      });

      const results = await Promise.all(fetchPromises);

      // Populate options with actual TC Names
      results.forEach(item => {
        if (item) {
          loadedTCs[item.key] = item.data;
          const opt = document.createElement("option");
          opt.value = item.key;
          const tcName = item.data.tcInfo.name || `熱帶氣旋 ${item.key}`;
          opt.textContent = `${tcName} (tc_${item.key}.csv)`;
          selectEl.appendChild(opt);
        }
      });

      // Default selection renders all loaded TCs
      onTCChange("all");
    }

    // ================= Change Event Handler =================
    function onTCChange(val) {
      if (val === "all") {
        renderAllTCs();
      } else if (loadedTCs[val]) {
        renderTCData(loadedTCs[val]);
      }
    }

    // ================= Single TC Renderer =================
    function renderTCData(data) {
      tcLayersGroup.clearLayers();
      const pts = drawTCLayers(data);

      document.getElementById("updateTime").innerHTML = "更新時間: " + (data.forecastInfo ? data.forecastInfo.updated : "--");

      const p0 = data.forecastPoints[0];
      if (data.tcInfo && p0) {
        const p1 = data.forecastPoints[1] || p0;
        const dist = getDistance(macauCoords[0], macauCoords[1], p0.lat, p0.lon).toFixed(0);
        const dir = getDirection(macauCoords[0], macauCoords[1], p0.lat, p0.lon);
        const moveDir = getDirection(p0.lat, p0.lon, p1.lat, p1.lon);
        const speed = getSpeed(p0, p1).toFixed(0);
        const type = getTypeFromWind(p0.wind);

        document.getElementById("tcInfoBox").innerHTML = `
          <div class="tc-title">${getTypeName(type)} ${data.tcInfo.name}</div>
          <div class="tc-row">中心風力: <span>${data.tcInfo.wind || p0.wind} km/h</span></div>
          <div class="tc-row">中心氣壓: <span>${data.tcInfo.pressure || '--'} hPa</span></div>
          <div class="tc-row">目前位置: <span>${p0.lat.toFixed(1)}°N, ${p0.lon.toFixed(1)}°E</span></div>
          <div class="tc-row">距離澳門: <span>${dir} ${dist} km</span></div>
          <div class="tc-row">預估移動: <span>${moveDir}, ${speed} km/h</span></div>
        `;
      }

      if (pts.length > 0) {
        map.fitBounds([macauCoords, ...pts], { padding: [50, 50] });
      }
    }

    // ================= ALL TCs Renderer =================
    function renderAllTCs() {
      tcLayersGroup.clearLayers();
      let allPts = [macauCoords];
      let activeCount = Object.keys(loadedTCs).length;

      if (activeCount === 0) {
        document.getElementById("tcInfoBox").innerHTML = `<div class="tc-title">無作用中熱帶氣旋</div>`;
        document.getElementById("updateTime").innerHTML = "更新時間: --";
        return;
      }

      let summaryHtml = `<div class="tc-title">全部熱帶氣旋 (${activeCount})</div>`;
      let latestUpdate = "--";

      Object.keys(loadedTCs).forEach(key => {
        const data = loadedTCs[key];
        const pts = drawTCLayers(data);
        allPts.push(...pts);

        if (data.forecastInfo && data.forecastInfo.updated !== "--") {
          latestUpdate = data.forecastInfo.updated;
        }

        const p0 = data.forecastPoints[0];
        if (p0) {
          const dist = getDistance(macauCoords[0], macauCoords[1], p0.lat, p0.lon).toFixed(0);
          const dir = getDirection(macauCoords[0], macauCoords[1], p0.lat, p0.lon);
          const type = getTypeFromWind(p0.wind);

          summaryHtml += `
            <div style="border-bottom: 1px dashed rgba(255,255,255,0.15); padding: 6px 0; margin-bottom: 4px;">
              <div style="font-weight:700; color:#38bdf8;">${getTypeName(type)} ${data.tcInfo.name}</div>
              <div class="tc-row" style="margin:0;">風力: <span>${p0.wind} km/h</span> | 距澳: <span>${dir} ${dist} km</span></div>
            </div>
          `;
        }
      });

      document.getElementById("updateTime").innerHTML = "更新時間: " + latestUpdate;
      document.getElementById("tcInfoBox").innerHTML = summaryHtml;

      if (allPts.length > 1) {
        map.fitBounds(allPts, { padding: [50, 50] });
      }
    }

    // ================= Draw TC Geometry & Layers =================
    function drawTCLayers(data) {
      const { forecastPoints, pastPoints, hours, radii } = data;
      const tcPts = [];

      // 1. Past Track
      if (pastPoints && pastPoints.length > 0) {
        const pastPolyline = L.polyline(pastPoints.map(p => [p.lat, p.lon]), {
          color: "rgba(255, 255, 255, 0.7)",
          weight: 2,
          dashArray: "4,4"
        });
        tcLayersGroup.addLayer(pastPolyline);

        pastPoints.forEach(p => {
          tcPts.push([p.lat, p.lon]);
          const type = getTypeFromWind(p.wind);
          const marker = L.circleMarker([p.lat, p.lon], {
            radius: 3.5,
            color: "#0f141c",
            weight: 1.5,
            fillColor: getColor(type),
            fillOpacity: 0.9
          });
          marker.bindPopup(`
            <b>${data.tcInfo.name} (歷史位置)</b><br>
            時間: ${p.time}<br>
            位置: ${p.lat.toFixed(1)}°N, ${p.lon.toFixed(1)}°E<br>
            強度: ${getTypeName(type)} (${p.wind || '--'} km/h)
          `);
          tcLayersGroup.addLayer(marker);
        });
      }

      // 2. Forecast Cone
      if (forecastPoints && forecastPoints.length > 1 && hours && radii) {
        const cones = makeSplitCone(forecastPoints, hours, radii);
        if (cones.first) {
          tcLayersGroup.addLayer(L.geoJSON(cones.first, {
            pane: 'conePane', style: { fillColor: "#ffffff", fillOpacity: 0.12, stroke: false }
          }));
        }
        if (cones.second) {
          tcLayersGroup.addLayer(L.geoJSON(cones.second, {
            pane: 'conePane', style: { fillColor: "#ffffff", fillOpacity: 0.05, stroke: false }
          }));
        }
      }

      // 3. Forecast Track Line
      if (forecastPoints && forecastPoints.length > 1) {
        const trackLine = L.curve(catmullRom2bezier(forecastPoints), {
          color: "#ffffff", weight: 2.5, dashArray: "8,6"
        });
        tcLayersGroup.addLayer(trackLine);
      }

      // 4. Forecast Markers
      forecastPoints.forEach(p => {
        tcPts.push([p.lat, p.lon]);
        const type = getTypeFromWind(p.wind);
        const marker = L.circleMarker([p.lat, p.lon], {
          radius: 5.5,
          color: "#ffffff",
          weight: 1.5,
          fillColor: getColor(type),
          fillOpacity: 1
        });

        marker.bindPopup(`
          <b>${data.tcInfo.name} (預報位置)</b><br>
          時間: ${p.time}<br>
          位置: ${p.lat.toFixed(1)}°N, ${p.lon.toFixed(1)}°E<br>
          強度: ${getTypeName(type)} (${p.wind || '--'} km/h)
        `);

        marker.bindTooltip(p.time, {
          permanent: true, direction: "right", offset: [8, 0], className: "time-label"
        });

        tcLayersGroup.addLayer(marker);
      });

      // 5. Wind Radii
      const p0 = forecastPoints[0];
      if (p0 && p0.wind41) {
        tcLayersGroup.addLayer(L.geoJSON(createWindRadii(p0.lat, p0.lon, p0.wind41), {
          pane: 'wind41Pane', style: { color: "#FFD700", weight: 1.2, fillColor: "#FFD700", fillOpacity: 0.15 }
        }));
      }

      return tcPts;
    }

    // ================= CSV Parser Function =================
    function parseCSVToTCData(csvText) {
      const lines = csvText.split('\n');
      let forecastPoints = [];
      let pastPoints = [];
      let hours = [];
      let tcInfo = { name: "未知", wind: "--", pressure: "--" };
      let forecastInfo = { updated: "--" };

      const defaultRadiiMap = { 0: 0, 12: 50, 24: 90, 36: 140, 48: 180, 72: 250, 96: 320, 120: 400 };

      lines.forEach((line) => {
        const rawLine = line.trim();
        if (!rawLine) return;

        const cols = rawLine.split(',').map(c => c.trim());
        if (cols.every(c => c === "")) return;

        const category = cols[0].toLowerCase();
        if (category === "category") return;

        if (category === "tc_info") {
          tcInfo.name = cols[2] || cols[1] || "熱帶氣旋";
          tcInfo.wind = cols[5] || cols[4] || "--";
          tcInfo.pressure = cols[6] || cols[5] || "--";
          forecastInfo.updated = cols[3] || cols[2] || "--";
        } 
        else if (category === "forecast") {
          const lat = parseFloat(cols[3]);
          const lon = parseFloat(cols[4]);
          if (isNaN(lat) || isNaN(lon)) return; // Skip empty coordinates

          const hourStr = cols[1] || "0";
          const hourVal = parseInt(hourStr.replace(/[^0-9]/g, ""), 10) || 0;
          const time = cols[2];
          const wind = cols[5] ? parseFloat(cols[5]) : null;

          let wind41 = null;
          if (cols[7] && cols[8] && cols[9] && cols[10] && cols[7] !== "") {
            wind41 = {
              ne: parseFloat(cols[7]) || 0,
              se: parseFloat(cols[8]) || 0,
              sw: parseFloat(cols[9]) || 0,
              nw: parseFloat(cols[10]) || 0
            };
          }

          forecastPoints.push({ time, lat, lon, wind, wind41, hour: hourVal });
          hours.push(hourVal);
        } 
        else if (category === "past") {
          const lat = parseFloat(cols[3]);
          const lon = parseFloat(cols[4]);
          if (isNaN(lat) || isNaN(lon)) return;

          pastPoints.push({
            time: cols[2], lat, lon,
            wind: cols[5] ? parseFloat(cols[5]) : null
          });
        }
      });

      const radii = hours.map(h => defaultRadiiMap[h] !== undefined ? defaultRadiiMap[h] : Math.round(h * 3.33));

      return {
        forecastPoints,
        pastPoints,
        hours: hours.length > 0 ? hours : [0, 12, 24, 48, 72, 96, 120],
        radii: radii.length > 0 ? radii : [0, 50, 90, 180, 250, 320, 400],
        tcInfo,
        forecastInfo
      };
    }

    // ================= Math & Spatial Helpers =================
    function getTypeFromWind(w) {
      if (!w || w < 41) return "TD";
      if (w < 63) return "TD";
      if (w < 88) return "TS";
      if (w < 118) return "STS";
      if (w < 150) return "TY";
      if (w < 185) return "STY";
      return "SuperTY";
    }

    function getTypeName(type) {
      const names = {
        "TD": "熱帶低氣壓", "TS": "熱帶風暴", "STS": "強烈熱帶風暴",
        "TY": "颱風", "STY": "強颱風", "SuperTY": "超強颱風"
      };
      return names[type] || "熱帶氣旋";
    }

    function getColor(type) {
      const colors = {
        "TD": "#4ade80", "TS": "#38bdf8", "STS": "#facc15",
        "TY": "#fb923c", "STY": "#f87171", "SuperTY": "#e879f9"
      };
      return colors[type] || "#ffffff";
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function getDirection(lat1, lon1, lat2, lon2) {
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
      const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) - Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
      let brng = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
      const dirs = ["北", "東北偏北", "東北", "東北偏東", "東", "東南偏東", "東南", "東南偏南", "南", "西南偏南", "西南", "西南偏西", "西", "西北偏西", "西北", "西北偏北"];
      return dirs[Math.round(brng / 22.5) % 16];
    }

    function getSpeed(p1, p2) {
      if (!p1 || !p2) return 0;
      const dist = getDistance(p1.lat, p1.lon, p2.lat, p2.lon);
      const dt = (p2.hour !== undefined && p1.hour !== undefined && p2.hour > p1.hour) ? (p2.hour - p1.hour) : 12;
      return dt > 0 ? (dist / dt) : 0;
    }

    // Geometry Generator for Asymmetric Wind Radii
    function createWindRadii(lat, lon, r) {
      const coords = [];
      const quads = [
        { start: 0, end: 90, radius: r.ne },
        { start: 90, end: 180, radius: r.se },
        { start: 180, end: 270, radius: r.sw },
        { start: 270, end: 360, radius: r.nw }
      ];

      quads.forEach(q => {
        for (let deg = q.start; deg <= q.end; deg += 5) {
          const rad = deg * Math.PI / 180;
          const dLat = (q.radius / 111) * Math.cos(rad);
          const dLon = (q.radius / (111 * Math.cos(lat * Math.PI / 180))) * Math.sin(rad);
          coords.push([lon + dLon, lat + dLat]);
        }
      });
      coords.push(coords[0]);

      return {
        type: "Feature",
        geometry: { type: "Polygon", coordinates: [coords] }
      };
    }

    // Error Cone Polygon Generator
    function makeSplitCone(points, hours, radii) {
      if (points.length < 2) return { first: null, second: null };

      const leftBoundary = [];
      const rightBoundary = [];

      points.forEach((p, idx) => {
        const r = radii[idx] || 0;
        const lat = p.lat;
        const lon = p.lon;

        let angle = 0;
        if (idx < points.length - 1) {
          angle = Math.atan2(points[idx + 1].lon - lon, points[idx + 1].lat - lat);
        } else {
          angle = Math.atan2(lon - points[idx - 1].lon, lat - points[idx - 1].lat);
        }

        const leftAngle = angle - Math.PI / 2;
        const rightAngle = angle + Math.PI / 2;

        const leftLat = lat + (r / 111) * Math.cos(leftAngle);
        const leftLon = lon + (r / (111 * Math.cos(lat * Math.PI / 180))) * Math.sin(leftAngle);

        const rightLat = lat + (r / 111) * Math.cos(rightAngle);
        const rightLon = lon + (r / (111 * Math.cos(lat * Math.PI / 180))) * Math.sin(rightAngle);

        leftBoundary.push([leftLon, leftLat]);
        rightBoundary.push([rightLon, rightLat]);
      });

      const coneCoords = [...leftBoundary, ...rightBoundary.reverse(), leftBoundary[0]];

      return {
        first: {
          type: "Feature",
          geometry: { type: "Polygon", coordinates: [coneCoords] }
        },
        second: null
      };
    }

    // Leaflet Curve Control Points Conversion
    function catmullRom2bezier(pts) {
      const path = ['M', [pts[0].lat, pts[0].lon]];
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[i === 0 ? i : i - 1];
        const p1 = pts[i];
        const p2 = pts[i + 1];
        const p3 = pts[i + 2 < pts.length ? i + 2 : i + 1];

        const cp1x = p1.lat + (p2.lat - p0.lat) / 6;
        const cp1y = p1.lon + (p2.lon - p0.lon) / 6;
        const cp2x = p2.lat - (p3.lat - p1.lat) / 6;
        const cp2y = p2.lon - (p3.lon - p1.lon) / 6;

        path.push('C', [cp1x, cp1y], [cp2x, cp2y], [p2.lat, p2.lon]);
      }
      return path;
    }

    // Initialize application on page load
    window.addEventListener("DOMContentLoaded", () => {
      initTCDropdown();
    });
  </script>
</body>
</html>
