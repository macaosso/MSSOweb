<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>熱帶氣旋消息生成器</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b0f19;
    color: #f1f5f9;
    padding: 20px;
    max-width: 800px;
    margin: 0 auto;
  }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    background: rgba(22, 30, 46, 0.75);
    padding: 20px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .field-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  label {
    font-size: 0.85rem;
    color: #38bdf8;
    font-weight: 600;
  }
  input {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 0.95rem;
  }
  input:focus {
    outline: none;
    border-color: #38bdf8;
  }
  .result-box {
    margin-top: 20px;
    background: rgba(56, 189, 248, 0.08);
    border: 1px solid #38bdf8;
    border-radius: 12px;
    padding: 20px;
  }
  .result-text {
    font-size: 1.05rem;
    line-height: 1.8;
    min-height: 60px;
    white-space: pre-wrap;
  }
  button {
    margin-top: 15px;
    background: #38bdf8;
    color: #0b0f19;
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover {
    background: #7dd3fc;
  }
</style>
</head>
<body>

<h2>🌀 熱帶氣旋消息生成器</h2>

<div class="form-grid">
  <div class="field-group">
    <label>時間</label>
    <input type="text" id="time" placeholder="20:00" oninput="generateText()">
  </div>
  <div class="field-group">
    <label>氣旋名稱 / 強度</label>
    <input type="text" id="tcName" placeholder="強烈熱帶風暴「瑪莉亞」" oninput="generateText()">
  </div>
  <div class="field-group">
    <label>方位</label>
    <input type="text" id="direction" placeholder="東南偏南" oninput="generateText()">
  </div>
  <div class="field-group">
    <label>距離 (公里)</label>
    <input type="text" id="distance" placeholder="380" oninput="generateText()">
  </div>
  <div class="field-group">
    <label>北緯 (度)</label>
    <input type="text" id="lat" placeholder="19.5" oninput="generateText()">
  </div>
  <div class="field-group">
    <label>東經 (度)</label>
    <input type="text" id="lng" placeholder="114.2" oninput="generateText()">
  </div>
  <div class="field-group">
    <label>最高風速 (km/h)</label>
    <input type="text" id="windSpeed" placeholder="105" oninput="generateText()">
  </div>
  <div class="field-group">
    <label>移動方向</label>
    <input type="text" id="moveDir" placeholder="西北偏西" oninput="generateText()">
  </div>
  <div class="field-group">
    <label>移動時速 (km/h)</label>
    <input type="text" id="moveSpeed" placeholder="18" oninput="generateText()">
  </div>
  <div class="field-group" style="grid-column: 1 / -1;">
    <label>動向 / 趨勢備註</label>
    <input type="text" id="remark" placeholder="大致趨向廣東西部沿岸" oninput="generateText()">
  </div>
</div>

<div class="result-box">
  <div class="result-text" id="output">填寫上方表格以生成內文...</div>
  <button onclick="copyToClipboard()">複製文字</button>
</div>

<script>
function generateText() {
  const time = document.getElementById('time').value || '____';
  const name = document.getElementById('tcName').value || '________';
  const dir = document.getElementById('direction').value || '____';
  const dist = document.getElementById('distance').value || '____';
  const lat = document.getElementById('lat').value || '____';
  const lng = document.getElementById('lng').value || '____';
  const wind = document.getElementById('windSpeed').value || '____';
  const moveDir = document.getElementById('moveDir').value || '____';
  const moveSpeed = document.getElementById('moveSpeed').value || '____';
  const remark = document.getElementById('remark').value || '____';

  const text = `在 ${time} 時，${name}集結在澳門${dir}約 ${dist} 公里，即在北緯 ${lat} 度，東經 ${lng} 度附近，其中心附近最高持續風速約為每小時 ${wind} 公里，向 ${moveDir} 移動，時速 ${moveSpeed} 公里，${remark}。`;

  document.getElementById('output').innerText = text;
}

function copyToClipboard() {
  const text = document.getElementById('output').innerText;
  navigator.clipboard.writeText(text);
  alert('已成功複製到剪貼簿！');
}
</script>

</body>
</html>
