<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>澳門地球物理氣象局 (SMG) 氣象警告監測</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --nav-bg: #111827;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-color: #38bdf8;
      --border-color: #334155;
      --error-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* 導航欄 Menu Bar */
    .menu-bar {
      background-color: var(--nav-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .menu-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent-color);
    }

    .menu-info {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    /* 主容器 swtBox */
    .swtBox {
      max-width: 1280px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .swtGrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }

    /* 卡片 warning-card */
    .warning-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .warning-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .warning-card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .warning-card-time {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .warning-card-body {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #cbd5e1;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 48px;
    }

    .error-msg {
      color: var(--error-color);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- Menu Bar -->
  <header class="menu-bar">
    <div class="menu-brand">
      <span class="menu-title">澳門氣象局 (SMG) 警告監測面板</span>
    </div>
    <div class="menu-info">
      最後自動更新：<span id="last-updated">讀取中...</span>
    </div>
  </header>

  <!-- swtBox Main Area -->
  <main class="swtBox">
    <div class="swtGrid" id="warning-grid"></div>
  </main>

  <script>
    const SOURCES = [
      { id: 'specInfo', title: '特別天氣訊息', url: 'https://www.smg.gov.mo/smg/xml/specInfo.xml' },
      { id: 'typhoon', title: '熱帶氣旋信號', url: 'https://xml.smg.gov.mo/c_typhoon.xml' },
      { id: 'rainstorm', title: '暴雨警告', url: 'https://xml.smg.gov.mo/c_rainstorm.xml' },
      { id: 'stormsurge', title: '風暴潮警告', url: 'https://xml.smg.gov.mo/c_stormsurge.xml' },
      { id: 'thunderstorm', title: '雷暴警告', url: 'https://xml.smg.gov.mo/c_thunderstorm.xml' },
      { id: 'monsoon', title: '強烈季候風警告', url: 'https://xml.smg.gov.mo/c_monsoon.xml' },
      { id: 'tsunami', title: '海嘯警告信號', url: 'https://xml.smg.gov.mo/c_tsunami.xml' }
    ];

    const PROXY = 'https://corsproxy.io/?';

    function initLayout() {
      const grid = document.getElementById('warning-grid');
      grid.innerHTML = SOURCES.map(src => `
        <div class="warning-card" id="card-${src.id}">
          <div class="warning-card-header">
            <span class="warning-card-title">${src.title}</span>
            <span class="warning-card-time" id="time-${src.id}">--:--</span>
          </div>
          <div class="warning-card-body" id="body-${src.id}">資料載入中...</div>
        </div>
      `).join('');
    }

    async function fetchXML(url) {
      const response = await fetch(PROXY + encodeURIComponent(url));
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const xmlText = await response.text();
      const parser = new DOMParser();
      return parser.parseFromString(xmlText, 'text/xml');
    }

    function parseSMGData(xmlDoc) {
      // 專門提煉中文主要欄位
      const contentNodes = Array.from(xmlDoc.querySelectorAll('C_Content, Content, C_Remark, Remark, C_Name, description'));
      const timeNode = xmlDoc.querySelector('IssueTime, pubDate, Date, Time');
      
      const issueTime = timeNode ? timeNode.textContent.trim() : '';

      // 清理與過濾無用雜訊（0, NIL, SMG, 網址等）
      const extractedTexts = contentNodes
        .map(node => node.textContent.trim())
        .filter(text => {
          if (!text) return false;
          if (/^(0|NIL|SMG|SMG-CPT|WARNING|RAINSTORM|THUNDERSTORM|TSUNAMI)$/i.test(text)) return false;
          if (text.startsWith('http://') || text.startsWith('https://')) return false;
          return true;
        });

      // 去除重複內容
      const uniqueTexts = [...new Set(extractedTexts)];

      return {
        time: issueTime,
        content: uniqueTexts.length > 0 ? uniqueTexts.join('\n\n') : '現時沒有相關警告信號。'
      };
    }

    async function updateData() {
      for (const src of SOURCES) {
        const bodyEl = document.getElementById(`body-${src.id}`);
        const timeEl = document.getElementById(`time-${src.id}`);

        try {
          const xmlDoc = await fetchXML(src.url);
          const { time, content } = parseSMGData(xmlDoc);

          bodyEl.textContent = content;
          bodyEl.classList.remove('error-msg');
          timeEl.textContent = time ? time.split(' ')[0] : '實時';
        } catch (err) {
          bodyEl.textContent = `無法載入資料 (${err.message})`;
          bodyEl.classList.add('error-msg');
          timeEl.textContent = '錯誤';
        }
      }

      const now = new Date();
      document.getElementById('last-updated').textContent = now.toLocaleTimeString('zh-HK');
    }

    // 初始化與 60 秒定時刷新
    initLayout();
    updateData();
    setInterval(updateData, 60000);
  </script>
</body>
</html>
