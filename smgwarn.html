<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="icons/MSSO.png">
<title>澳門氣象局 (SMG) 氣象警告監測 - 澳門民間氣象台</title>
<style>
/* ========== 1. 深太空 (Deep Space) 全域主題基礎 ========== */
:root {
  --bg-dark: #0b0f19;
  --card-bg: rgba(22, 30, 46, 0.75);
  --card-bg-light: rgba(255, 255, 255, 0.03);
  --card-border: rgba(255, 255, 255, 0.08);
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  
  --accent-blue: #38bdf8;
  --accent-teal: #2dd4bf;
  --accent-green: #34d399;
  --accent-yellow: #facc15;
  --accent-orange: #f59e0b;
  --accent-red: #ef4444;
  --accent-purple: #c084fc;

  --bg-red: rgba(239, 68, 68, 0.12);
  --border-red: rgba(239, 68, 68, 0.35);
  --bg-orange: rgba(245, 158, 11, 0.12);
  --border-orange: rgba(245, 158, 11, 0.35);
}

/* ========== 明亮主題 (Light Theme) ========== */
body.light-theme {
  --bg-dark: #f8fafc;
  --card-bg: rgba(255, 255, 255, 0.85);
  --card-bg-light: rgba(0, 0, 0, 0.04);
  --card-border: rgba(0, 0, 0, 0.12);
  --text-main: #0f172a;
  --text-muted: #64748b;

  --accent-blue: #0284c7;
  --accent-teal: #0d9488;
  --accent-green: #059669;
  --accent-yellow: #d97706;
  --accent-orange: #d97706;
  --accent-red: #dc2626;
  --accent-purple: #9333ea;

  --bg-red: rgba(239, 68, 68, 0.08);
  --border-red: rgba(239, 68, 68, 0.25);
  --bg-orange: rgba(245, 158, 11, 0.08);
  --border-orange: rgba(245, 158, 11, 0.25);
}

html {
  scroll-behavior: smooth;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-main);
  line-height: 1.6;
  transition: background-color 0.3s ease, color 0.3s ease;
}

/* 頁面最大寬度容器 */
.page-wrapper {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 15px 40px 15px;
}

/* ========== 2. 頁頭 Header & 頂欄導航 ========== */
.header-nav-container {
  position: sticky;
  top: 0;
  z-index: 3000;
  background: rgba(11, 15, 25, 0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--card-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 1.5rem;
  margin-bottom: 20px;
  transition: background 0.3s ease;
}
body.light-theme .header-nav-container {
  background: rgba(248, 250, 252, 0.88);
}

.header {
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo {
  height: 38px;
  width: auto;
  filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.3));
}
.title {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--accent-blue);
  letter-spacing: 0.5px;
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.header-clock {
  font-size: 0.88rem;
  font-weight: 500;
  color: var(--accent-teal);
  font-variant-numeric: tabular-nums;
  opacity: 0.9;
}

.menu-container {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* 主題切換按鈕 */
.theme-toggle-btn {
  background: var(--card-bg-light);
  border: 1px solid var(--card-border);
  color: var(--text-main);
  padding: 8px 12px;
  border-radius: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.25s ease;
  outline: none;
}
.theme-toggle-btn:hover {
  border-color: var(--accent-blue);
  color: var(--accent-blue);
  transform: translateY(-1px);
}
.sun-icon {
  display: block;
}
.moon-icon {
  display: none;
}
body.light-theme .sun-icon {
  display: none;
}
body.light-theme .moon-icon {
  display: block;
}

.menu-toggle {
  display: none;
  font-size: 22px;
  padding: 6px 12px;
  cursor: pointer;
  background: var(--card-bg-light);
  border: 1px solid var(--card-border);
  color: var(--text-main);
  border-radius: 8px;
  transition: all 0.2s;
}
.menu-toggle:hover {
  border-color: var(--accent-blue);
}
.menu-toggle.active {
  border-color: var(--accent-blue);
  background: rgba(56, 189, 248, 0.12);
}

.nav {
  display: flex;
  gap: 8px;
  align-items: center;
}
.nav a {
  color: var(--text-muted);
  padding: 8px 14px;
  font-size: 0.92rem;
  font-weight: 500;
  text-decoration: none;
  border-radius: 20px;
  transition: all 0.2s ease;
  display: block;
}
.nav a:hover, .nav a.active {
  color: var(--text-main);
  background: rgba(255, 255, 255, 0.05);
}
body.light-theme .nav a:hover, body.light-theme .nav a.active {
  background: rgba(0, 0, 0, 0.05);
}

/* ========== 下拉選單樣式 ========== */
.dropdown {
  position: relative;
  display: inline-block;
}

.dropdown-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  padding: 8px 14px;
  font-size: 0.92rem;
  font-weight: 500;
  font-family: inherit;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 6px;
}

.dropdown-btn .arrow {
  font-size: 0.7rem;
  transition: transform 0.2s ease;
}

.dropdown:hover .dropdown-btn,
.dropdown.active .dropdown-btn {
  color: var(--text-main);
  background: rgba(255, 255, 255, 0.05);
}
body.light-theme .dropdown:hover .dropdown-btn,
body.light-theme .dropdown.active .dropdown-btn {
  background: rgba(0, 0, 0, 0.05);
}

.dropdown:hover .arrow,
.dropdown.active .arrow {
  transform: rotate(180deg);
}

.dropdown-content {
  position: absolute;
  top: 100%;
  left: 0;
  min-width: 190px;
  background: rgba(15, 23, 42, 0.95);
  backdrop-filter: blur(16px);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 6px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  z-index: 3100;
  margin-top: 4px;

  opacity: 0;
  visibility: hidden;
  transition: opacity 0.25s ease, visibility 0s linear 0.4s;
}

.dropdown-content::before {
  content: "";
  position: absolute;
  top: -8px;
  left: 0;
  width: 100%;
  height: 8px;
}

body.light-theme .dropdown-content {
  background: rgba(255, 255, 255, 0.98);
}

.dropdown:hover .dropdown-content,
.dropdown.active .dropdown-content {
  opacity: 1;
  visibility: visible;
  transition: opacity 0.25s ease, visibility 0s linear 0s;
}

.dropdown-content a {
  padding: 8px 12px;
  border-radius: 8px;
  white-space: nowrap;
  font-size: 0.88rem;
}

/* ========== 3. 橙色提示框 (swtBox 風格) ========== */
.box {
  margin: 20px 0;
  border-radius: 16px;
  background: var(--bg-orange);
  border: 1px solid var(--border-orange);
  box-shadow: 0 6px 20px rgba(245, 158, 11, 0.08);
  overflow: hidden;
}
.header-orange {
  background: rgba(245, 158, 11, 0.25);
  color: var(--accent-yellow);
  padding: 14px 20px;
  font-size: 16px;
  font-weight: 700;
  border-bottom: 1px solid var(--border-orange);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
body.light-theme .header-orange {
  color: #9a3412;
  background: rgba(245, 158, 11, 0.15);
}
.header-title-group {
  display: flex;
  align-items: center;
  gap: 8px;
}
.content-yellow {
  padding: 18px 20px;
  font-size: 14.5px;
  line-height: 1.7;
  color: #fef08a;
}
body.light-theme .content-yellow {
  color: #78350f;
}

/* ========== 4. 警告卡片 (warning-card) 網格 ========== */
.warning-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 16px;
  margin: 20px 0;
}

.warning-card {
  border-radius: 16px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: transform 0.25s ease, border-color 0.25s ease;
}

.warning-card:hover {
  transform: translateY(-2px);
  border-color: rgba(56, 189, 248, 0.3);
}

.warning-header {
  background: rgba(255, 255, 255, 0.03);
  color: var(--accent-blue);
  padding: 14px 18px;
  font-size: 15px;
  font-weight: 700;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--card-border);
}
body.light-theme .warning-header {
  background: rgba(0, 0, 0, 0.02);
}

.warning-title-text {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.tc-update-time {
  font-size: 12.5px;
  font-weight: normal;
  color: var(--text-muted);
}

.warning-item-body {
  padding: 18px;
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-main);
  white-space: pre-wrap;
  word-break: break-word;
  flex: 1;
}

.error-msg {
  color: var(--accent-red) !important;
}

/* ========== 響應式適配 ========== */
@media (max-width: 768px) {
  .header-nav-container {
    padding: 0.75rem 1rem;
  }
  .menu-toggle {
    display: block;
  }
  .nav {
    display: none;
    flex-direction: column;
    width: 230px;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    align-items: stretch;
  }
  body.light-theme .nav {
    background: rgba(255, 255, 255, 0.98);
  }
  .nav a {
    width: 100%;
    padding: 10px 14px;
    border-radius: 8px;
  }
  .nav.active {
    display: flex;
  }

  .dropdown {
    width: 100%;
  }
  .dropdown-btn {
    width: 100%;
    justify-content: space-between;
    padding: 10px 14px;
    border-radius: 8px;
  }
  .dropdown-content {
    position: static;
    display: none;
    opacity: 1;
    visibility: visible;
    box-shadow: none;
    border: none;
    background: rgba(255, 255, 255, 0.03);
    margin-top: 4px;
    padding-left: 10px;
    border-left: 2px solid var(--accent-blue);
    border-radius: 0 8px 8px 0;
    transition: none;
  }
  body.light-theme .dropdown-content {
    background: rgba(0, 0, 0, 0.03);
  }

  .dropdown.active .dropdown-content {
    display: block;
  }
  
  .warning-grid {
    grid-template-columns: 1fr;
  }
}

@media (min-width: 769px) {
  .nav {
    display: flex !important;
  }
  .menu-toggle {
    display: none !important;
  }
}
</style>
</head>

<script>
/* ========== 1. 主題切換與基礎邏輯 ========== */
function applyTheme(theme) {
  if (theme === 'light') {
    document.body.classList.add('light-theme');
  } else {
    document.body.classList.remove('light-theme');
  }
}

function toggleTheme() {
  const isLight = document.body.classList.contains('light-theme');
  const newTheme = isLight ? 'dark' : 'light';
  localStorage.setItem('msso_theme', newTheme);
  applyTheme(newTheme);
}

(function initTheme() {
  const savedTheme = localStorage.getItem('msso_theme');
  if (savedTheme) {
    if (savedTheme === 'light') document.body.classList.add('light-theme');
  } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
    document.body.classList.add('light-theme');
  }
})();

function toggleMenu() {
  const nav = document.getElementById("navMenu");
  const btn = document.querySelector(".menu-toggle");
  nav.classList.toggle("active");
  btn.innerHTML = nav.classList.contains("active") ? "✕" : "☰";
}

function updateHeaderClock() {
  const clockEl = document.getElementById('headerClock');
  if (clockEl) {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const date = String(now.getDate()).padStart(2, '0');
    const hrs = String(now.getHours()).padStart(2, '0');
    const mins = String(now.getMinutes()).padStart(2, '0');
    const secs = String(now.getSeconds()).padStart(2, '0');
    clockEl.textContent = ` ${year}年${month}月${date}日 ${hrs}:${mins}:${secs} MST`;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  updateHeaderClock();
  setInterval(updateHeaderClock, 1000);

  const dropdownBtns = document.querySelectorAll('.dropdown-btn');
  dropdownBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const currentDropdown = btn.parentElement;
      document.querySelectorAll('.dropdown').forEach(d => {
        if (d !== currentDropdown) d.classList.remove('active');
      });
      currentDropdown.classList.toggle('active');
    });
  });

  document.addEventListener('click', () => {
    document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('active'));
  });
});

/* ========== 2. SMG XML 警告抓取與過濾邏輯 ========== */
const SOURCES = [
  { id: 'specInfo', title: '特別天氣訊息', url: 'https://www.smg.gov.mo/smg/xml/specInfo.xml' },
  { id: 'typhoon', title: '熱帶氣旋信號', url: 'https://xml.smg.gov.mo/c_typhoon.xml' },
  { id: 'rainstorm', title: '暴雨警告', url: 'https://xml.smg.gov.mo/c_rainstorm.xml' },
  { id: 'stormsurge', title: '風暴潮警告', url: 'https://xml.smg.gov.mo/c_stormsurge.xml' },
  { id: 'thunderstorm', title: '雷暴警告', url: 'https://xml.smg.gov.mo/c_thunderstorm.xml' },
  { id: 'monsoon', title: '強烈季候風警告', url: 'https://xml.smg.gov.mo/c_monsoon.xml' },
  { id: 'tsunami', title: '海嘯警告信號', url: 'https://xml.smg.gov.mo/c_tsunami.xml' }
];

const PROXY = 'https://corsproxy.io/?';

function initLayout() {
  const grid = document.getElementById('warning-grid');
  grid.innerHTML = SOURCES.map(src => `
    <div class="warning-card" id="card-${src.id}">
      <div class="warning-header">
        <span class="warning-title-text">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          ${src.title}
        </span>
        <span class="tc-update-time" id="time-${src.id}">--:--</span>
      </div>
      <div class="warning-item-body" id="body-${src.id}">資料載入中...</div>
    </div>
  `).join('');
}

async function fetchXML(url) {
  const response = await fetch(PROXY + encodeURIComponent(url), { cache: 'no-store' });
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  const xmlText = await response.text();
  const parser = new DOMParser();
  return parser.parseFromString(xmlText, 'text/xml');
}

function parseSMGData(xmlDoc) {
  // 精確提取繁體中文欄位
  const contentNodes = Array.from(xmlDoc.querySelectorAll('C_Content, Content, C_Remark, Remark, C_Name, description'));
  const timeNode = xmlDoc.querySelector('IssueTime, pubDate, Date, Time, SysPubdate');
  
  const issueTime = timeNode ? timeNode.textContent.trim() : '';

  // 主動過濾雜訊 (0, NIL, SMG 標籤, 網址及重複項目)
  const extractedTexts = contentNodes
    .map(node => node.textContent.trim())
    .filter(text => {
      if (!text) return false;
      if (/^(0|NIL|SMG|SMG-CPT|WARNING|RAINSTORM|THUNDERSTORM|TSUNAMI)$/i.test(text)) return false;
      if (text.startsWith('http://') || text.startsWith('https://')) return false;
      return true;
    });

  const uniqueTexts = [...new Set(extractedTexts)];

  return {
    time: issueTime,
    content: uniqueTexts.length > 0 ? uniqueTexts.join('\n\n') : '現時沒有相關警告信號。'
  };
}

async function updateData() {
  for (const src of SOURCES) {
    const bodyEl = document.getElementById(`body-${src.id}`);
    const timeEl = document.getElementById(`time-${src.id}`);

    try {
      const xmlDoc = await fetchXML(src.url);
      const { time, content } = parseSMGData(xmlDoc);

      bodyEl.textContent = content;
      bodyEl.classList.remove('error-msg');
      timeEl.textContent = time ? time.split(' ')[0] : '實時';
    } catch (err) {
      bodyEl.textContent = `無法載入數據 (${err.message})`;
      bodyEl.classList.add('error-msg');
      timeEl.textContent = '錯誤';
    }
  }

  const now = new Date();
  const hrs = String(now.getHours()).padStart(2, '0');
  const mins = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('last-updated').textContent = `最後自動同步：${hrs}:${mins}`;
}

// 初始化與 60 秒刷新
window.addEventListener('DOMContentLoaded', () => {
  initLayout();
  updateData();
  setInterval(updateData, 60000);
});
</script>
