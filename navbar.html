<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<link rel="icon" type="image/png" href="icons/MSSO.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<title>澳門民間氣象台 - 首頁</title>
<style>
/* ========== 1. 深太空 (Deep Space) 全域主題基礎 ========== */
:root {
  --bg-dark: #0b0f19;
  --card-bg: rgba(22, 30, 46, 0.75);
  --card-bg-light: rgba(255, 255, 255, 0.03);
  --card-border: rgba(255, 255, 255, 0.08);
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  
  --accent-blue: #38bdf8;
  --accent-teal: #2dd4bf;
  --accent-green: #34d399;
  --accent-yellow: #facc15;
  --accent-orange: #f59e0b;
  --accent-red: #ef4444;
  --accent-purple: #a855f7;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
  background-color: var(--bg-dark);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  background: var(--card-bg);
  border-bottom: 1px solid var(--card-border);
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  backdrop-filter: blur(10px);
  position: sticky;
  top: 0;
  z-index: 1000;
}

.logo-area {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-area img {
  width: 36px;
  height: 36px;
  object-fit: contain;
}

.logo-area h1 {
  font-size: 1.25rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-teal));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

main {
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
  padding: 24px 16px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* ========== 2. 七日預報卡片專屬樣式 (依圖片格式優化) ========== */
.section-title {
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--text-main);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.forecast-container-7d {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 12px;
}

.forecast-card-mini {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 14px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  transition: transform 0.2s ease, border-color 0.2s ease;
  backdrop-filter: blur(8px);
}

.forecast-card-mini:hover {
  transform: translateY(-3px);
  border-color: var(--accent-blue);
}

.card-top {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.card-middle {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  width: 100%;
}

.card-icon-large {
  width: 48px;
  height: 48px;
  object-fit: contain;
  margin: 2px 0;
}

.card-condition {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-main);
  margin-bottom: 4px;
}

.temp-range-text {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--accent-blue);
}

.humid-range-text {
  font-size: 0.78rem;
  color: var(--text-muted);
}

.loading-state, .error-state {
  text-align: center;
  padding: 20px;
  color: var(--text-muted);
  font-size: 0.9rem;
  grid-column: 1 / -1;
}

.error-state {
  color: var(--accent-red);
  display: none;
}

/* ========== 3. 其他版面區塊 ========== */
.dashboard-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
}

@media(min-width: 768px) {
  .dashboard-grid {
    grid-template-columns: 1fr 1fr;
  }
}

.card-box {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 20px;
  backdrop-filter: blur(10px);
}

footer {
  text-align: center;
  padding: 20px;
  color: var(--text-muted);
  font-size: 0.8rem;
  border-top: 1px solid var(--card-border);
  margin-top: auto;
}
</style>
</head>
<body>

<header>
  <div class="logo-area">
    <img src="icons/MSSO.png" alt="Logo">
    <h1>澳門民間氣象台</h1>
  </div>
</header>

<main>
  <section class="card-box">
    <div class="section-title">📅 本地七日天氣預報</div>
    <div id="loading-7d" class="loading-state">正在載入七日天氣預報...</div>
    <div id="error-7d" class="error-state">無法載入預報資料，請稍後再試。</div>
    <div id="forecast-7d-container" class="forecast-container-7d"></div>
  </section>

  <div class="dashboard-grid">
    <div class="card-box">
      <div class="section-title">📊 溫度趨勢圖</div>
      <canvas id="tempTrendChart" height="150"></canvas>
    </div>
    <div class="card-box">
      <div class="section-title">🗺️ 氣象圖台</div>
      <div id="map" style="height: 220px; border-radius: 10px;"></div>
    </div>
  </div>
</main>

<footer>
  &copy; 2026 澳門民間氣象台 Macao Sky & Severe Weather Observation
</footer>

<script>
// 初始化 Leaflet 地圖
const map = L.map('map').setView([22.1987, 113.5439], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

// 輔助函數：Open-Meteo 天氣圖標對應
function getOpenMeteoIcon(code, isDay = 1) {
    // 簡易圖標對應範例
    return "icons/MSSO.png";
}

// 輔助函數：七日天氣狀況文字敘述
function generateSevenDayText(code, maxWind) {
    if (code === 0) return "晴朗";
    if (code >= 1 && code <= 3) return "多雲";
    if (code >= 51 && code <= 67) return "陣雨";
    if (code >= 95) return "雷陣雨";
    return "陰天";
}

// 載入七日預報數據
async function loadSevenDayForecast() {
    const containerEl = document.getElementById('forecast-7d-container');
    const loadingEl = document.getElementById('loading-7d');
    const errorEl = document.getElementById('error-7d');

    try {
        const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=22.1987&longitude=113.5439&daily=weather_code,temperature_2m_max,temperature_2m_min,relative_humidity_2m_max,relative_humidity_2m_min,wind_speed_10m_max&timezone=Asia%2FMacao');
        const data = await response.json();
        const daily = data.daily;

        let html = '';
        const dynamic7dLabels = [];
        const dynamic7dMax = [];
        const dynamic7dMin = [];

        for (let i = 0; i < 7; i++) {
            const dateObj = new Date(daily.time[i]);
            const labelStr = i === 0 ? '今天' : `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
            const chartLabel = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
            
            const maxT = Math.round(daily.temperature_2m_max[i]);
            const minT = Math.round(daily.temperature_2m_min[i]);
            const maxH = daily.relative_humidity_2m_max ? Math.round(daily.relative_humidity_2m_max[i]) : 90;
            const minH = daily.relative_humidity_2m_min ? Math.round(daily.relative_humidity_2m_min[i]) : 60;
            const code = daily.weather_code[i];
            const maxWind = daily.wind_speed_10m_max ? daily.wind_speed_10m_max[i] : 15;

            const conditionStr = generateSevenDayText(code, maxWind);
            const iconUrl = getOpenMeteoIcon(code, 12);

            dynamic7dLabels.push(chartLabel);
            dynamic7dMax.push(maxT);
            dynamic7dMin.push(minT);

            // 依照圖片格式重構卡片 HTML 結構：圖標 -> 天氣狀況 -> 溫度範圍 -> 濕度範圍
            html += `
                <div class="forecast-card-mini">
                    <div class="card-top">${labelStr}</div>
                    <div class="card-middle">
                        <img class="card-icon-large" src="${iconUrl}" alt="weather-icon">
                        <div class="card-condition">${conditionStr}</div>
                        <div class="temp-range-text">${minT} - ${maxT} °C</div>
                        <div class="humid-range-text">${minH} - ${maxH} %</div>
                    </div>
                </div>
            `;
        }

        if (loadingEl) loadingEl.style.display = 'none';
        containerEl.innerHTML = html;

        // 初始化溫度趨勢圖
        const ctx = document.getElementById('tempTrendChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: dynamic7dLabels,
                datasets: [
                    {
                        label: '最高溫 (°C)',
                        data: dynamic7dMax,
                        borderColor: '#f59e0b',
                        backgroundColor: '#f59e0b',
                        tension: 0.3
                    },
                    {
                        label: '最低溫 (°C)',
                        data: dynamic7dMin,
                        borderColor: '#38bdf8',
                        backgroundColor: '#38bdf8',
                        tension: 0.3
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { labels: { color: '#f1f5f9' } }
                },
                scales: {
                    x: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                    y: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                }
            }
        });

    } catch (err) {
        console.error("7日預報讀取錯誤：", err);
        if (loadingEl) loadingEl.style.display = 'none';
        if (errorEl) errorEl.style.display = 'block';
    }
}

// 頁面載入後自動執行
window.addEventListener('DOMContentLoaded', () => {
    loadSevenDayForecast();
});
</script>

</body>
</html>
