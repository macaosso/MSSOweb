<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<link rel="icon" type="image/png" href="icons/MSSO.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<title>澳門民間氣象台 - 首頁</title>
<style>
/* ========== 1. 深太空 (Deep Space) 全域主題基礎 ========== */
:root {
  --bg-dark: #0b0f19;
  --card-bg: rgba(22, 30, 46, 0.75);
  --card-bg-light: rgba(255, 255, 255, 0.03);
  --card-border: rgba(255, 255, 255, 0.08);
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  
  --accent-blue: #38bdf8;
  --accent-teal: #2dd4bf;
  --accent-green: #34d399;
  --accent-yellow: #facc15;
  --accent-orange: #f59e0b;
  --accent-red: #ef4444;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

body {
  background-color: var(--bg-dark);
  color: var(--text-main);
  min-height: 100vh;
  padding: 20px;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--card-border);
  padding-bottom: 16px;
}

h1 {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--accent-blue);
}

.section-title {
  font-size: 1.2rem;
  font-weight: 600;
  margin-bottom: 16px;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ========== 2. 七日天氣預報卡片樣式 (對應圖片格式) ========== */
.forecast-container {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 12px;
  margin-bottom: 32px;
  scrollbar-width: thin;
  scrollbar-color: var(--accent-blue) var(--card-bg);
}

.forecast-container::-webkit-scrollbar {
  height: 6px;
}

.forecast-container::-webkit-scrollbar-track {
  background: var(--card-bg);
  border-radius: 4px;
}

.forecast-container::-webkit-scrollbar-thumb {
  background: var(--accent-blue);
  border-radius: 4px;
}

.forecast-card-mini {
  flex: 0 0 140px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  text-align: center;
  backdrop-filter: blur(10px);
  transition: transform 0.2s ease, border-color 0.2s ease;
}

.forecast-card-mini:hover {
  transform: translateY(-4px);
  border-color: var(--accent-blue);
}

.card-top {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--accent-blue);
  margin-bottom: 8px;
}

.card-middle {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  margin: 4px 0;
}

.card-icon-large {
  width: 48px;
  height: 48px;
  object-fit: contain;
}

.temp-range-text {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text-main);
}

.humid-range-text {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.card-bottom {
  margin-top: 8px;
  border-top: 1px solid var(--card-border);
  padding-top: 8px;
  width: 100%;
}

.card-condition {
  font-size: 0.8rem;
  color: var(--text-muted);
  line-height: 1.2;
}

/* 其他通用元件 */
.loading, .error-msg {
  text-align: center;
  color: var(--text-muted);
  padding: 20px;
  font-size: 0.9rem;
}

.error-msg {
  color: var(--accent-red);
  display: none;
}
</style>
</head>
<body>

<div class="container">
    <header>
        <h1>澳門民間氣象台</h1>
        <div id="current-time" style="font-size: 0.85rem; color: var(--text-muted);"></div>
    </header>

    <main>
        <div class="section-title">📅 七日天氣預報</div>
        <div id="forecast-loading" class="loading">正在載入七日預報...</div>
        <div id="forecast-error" class="error-msg">無法載入七日天氣預報數據</div>
        <div id="forecast-7d-container" class="forecast-container"></div>
    </main>
</div>

<script>
// 時間顯示
function updateClock() {
    const now = new Date();
    const timeStr = now.toLocaleString('zh-TW', { hour12: false });
    const el = document.getElementById('current-time');
    if (el) el.textContent = timeStr;
}
setInterval(updateClock, 1000);
updateClock();

// 天氣圖示對應
function getOpenMeteoIcon(code, isDay = 1) {
    // 簡單圖示映射範例
    if (code === 0) return isDay ? 'icons/sunny.png' : 'icons/clear_night.png';
    if ([1, 2, 3].includes(code)) return 'icons/cloudy.png';
    if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return 'icons/rain.png';
    return 'icons/cloudy.png';
}

function generateSevenDayText(code, maxWind) {
    if (code === 0) return '晴朗';
    if ([1, 2].includes(code)) return '多雲';
    if (code === 3) return '陰天';
    if ([51, 53, 55, 61, 63].includes(code)) return '有雨';
    if (maxWind > 30) return '風勢較大';
    return '天氣平穩';
}

// 載入七日預報數據
async function loadSevenDayForecast() {
    const containerEl = document.getElementById('forecast-7d-container');
    const loadingEl = document.getElementById('forecast-loading');
    const errorEl = document.getElementById('forecast-error');

    try {
        // 以澳門為例坐標：22.1987, 113.5439
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=22.1987&longitude=113.5439&daily=weather_code,temperature_2m_max,temperature_2m_min,relative_humidity_2m_max,relative_humidity_2m_min,wind_speed_10m_max&timezone=Asia%2FMacao');
        const data = await res.json();
        const daily = data.daily;

        let html = '';
        const dynamic7dLabels = [];
        const dynamic7dMax = [];
        const dynamic7dMin = [];

        for (let i = 0; i < 7; i++) {
            const dateObj = new Date(daily.time[i]);
            const month = dateObj.getMonth() + 1;
            const day = dateObj.getDate();
            const weekdays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
            const weekday = weekdays[dateObj.getDay()];

            let labelStr = `${month}/${day} (${weekday})`;
            if (i === 0) labelStr = '今天';
            if (i === 1) labelStr = '明天';

            const maxT = Math.round(daily.temperature_2m_max[i]);
            const minT = Math.round(daily.temperature_2m_min[i]);
            const maxH = daily.relative_humidity_2m_max ? Math.round(daily.relative_humidity_2m_max[i]) : 85;
            const minH = daily.relative_humidity_2m_min ? Math.round(daily.relative_humidity_2m_min[i]) : 60;
            const code = daily.weather_code[i];
            const maxWind = daily.wind_speed_10m_max ? daily.wind_speed_10m_max[i] : 15;

            const conditionStr = generateSevenDayText(code, maxWind);
            const iconUrl = getOpenMeteoIcon(code, 12);

            dynamic7dLabels.push(labelStr);
            dynamic7dMax.push(maxT);
            dynamic7dMin.push(minT);

            html += `
                <div class="forecast-card-mini">
                    <div class="card-top">${labelStr}</div>
                    <div class="card-middle">
                        <img class="card-icon-large" src="${iconUrl}" alt="weather-icon">
                        <div class="temp-range-text">${minT} - ${maxT} °C</div>
                        <div class="humid-range-text">${minH} - ${maxH} %</div>
                    </div>
                    <div class="card-bottom">
                        <div class="card-condition">${conditionStr}</div>
                    </div>
                </div>
            `;
        }

        if (loadingEl) loadingEl.style.display = 'none';
        containerEl.innerHTML = html;

    } catch (err) {
        console.error("7日預報讀取錯誤：", err);
        if (loadingEl) loadingEl.style.display = 'none';
        if (errorEl) errorEl.style.display = 'block';
    }
}

document.addEventListener('DOMContentLoaded', () => {
    loadSevenDayForecast();
});
</script>

</body>
</html>
