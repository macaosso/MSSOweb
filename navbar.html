<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7-Day Weather Forecast</title>
  <style>
    :root {
      --bg-color: #f7f8fa;
      --card-bg: #ffffff;
      --text-main: #1f2329;
      --text-sub: #8f959e;
      --border-color: #f0f1f3;
      --bar-bg: #e5e8ef;
      --bar-fill: #f5a623;
      --header-icon-bg: #fdf3e7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .weather-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
    }

    /* Header Styling */
    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .header-icon {
      width: 44px;
      height: 44px;
      background-color: var(--header-icon-bg);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-icon svg {
      width: 24px;
      height: 24px;
      fill: #f5a623;
    }

    .header-text .title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .header-text .subtitle {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    /* List Layout */
    .forecast-list {
      display: flex;
      flex-direction: column;
    }

    .forecast-row {
      display: grid;
      grid-template-columns: 110px 48px 48px 36px 1fr 36px;
      align-items: center;
      padding: 18px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .forecast-row:last-child {
      border-bottom: none;
    }

    /* Row Content */
    .date-group {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }

    .weather-icon, .rain-chance {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rain-chance {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }

    .drop-icon {
      width: 12px;
      height: 14px;
      fill: var(--text-main);
    }

    .temp-low, .temp-high {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
    }

    /* Temperature Range Bar */
    .bar-container {
      padding: 0 8px;
    }

    .bar-bg {
      height: 6px;
      background-color: var(--bar-bg);
      border-radius: 3px;
      position: relative;
      overflow: hidden;
    }

    .bar-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      background-color: var(--bar-fill);
      border-radius: 3px;
    }
  </style>
</head>
<body>
