  <style>
  /* ========== 1. 深太空 (Deep Space) 全域主題基礎 ========== */
  :root {
    --bg-dark: #0b0f19;
    --card-bg: rgba(22, 30, 46, 0.75);
    --card-bg-light: rgba(255, 255, 255, 0.03);
    --card-border: rgba(255, 255, 255, 0.08);
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    
    --accent-blue: #38bdf8;
    --accent-teal: #2dd4bf;
    --accent-green: #34d399;
    --accent-yellow: #facc15;
    --accent-orange: #f59e0b;
    --accent-red: #ef4444;
    --accent-purple: #c084fc;
  
    --bg-red: rgba(239, 68, 68, 0.12);
    --border-red: rgba(239, 68, 68, 0.35);
    --bg-orange: rgba(245, 158, 11, 0.12);
    --border-orange: rgba(245, 158, 11, 0.35);
  }
  
  /* ========== 明亮主題 (Light Theme) ========== */
  body.light-theme {
    --bg-dark: #f8fafc;
    --card-bg: rgba(255, 255, 255, 0.85);
    --card-bg-light: rgba(0, 0, 0, 0.04);
    --card-border: rgba(0, 0, 0, 0.12);
    --text-main: #0f172a;
    --text-muted: #64748b;
  
    --accent-blue: #0284c7;
    --accent-teal: #0d9488;
    --accent-green: #059669;
    --accent-yellow: #d97706;
    --accent-orange: #d97706;
    --accent-red: #dc2626;
    --accent-purple: #9333ea;
  
    --bg-red: rgba(239, 68, 68, 0.08);
    --border-red: rgba(239, 68, 68, 0.25);
    --bg-orange: rgba(245, 158, 11, 0.08);
    --border-orange: rgba(245, 158, 11, 0.25);
  }
  
  html {
    scroll-behavior: smooth;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-main);
    line-height: 1.6;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  
  /* 頁面最大寬度容器 */
  .page-wrapper {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 15px 80px 15px;
  }
  
  /* ========== 2. 頁頭 Header & 頂欄導航 ========== */
  .header-nav-container {
    position: sticky;
    top: 0;
    z-index: 3000;
    background: rgba(11, 15, 25, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--card-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 1.5rem;
    margin-bottom: 20px;
    transition: background 0.3s ease;
  }
  body.light-theme .header-nav-container {
    background: rgba(248, 250, 252, 0.88);
  }
  
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    height: 38px;
    width: auto;
    filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.3));
  }
  .title {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--accent-blue);
    letter-spacing: 0.5px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .header-clock {
    font-size: 0.88rem;
    font-weight: 500;
    color: var(--accent-teal);
    font-variant-numeric: tabular-nums;
    opacity: 0.9;
  }
  
  .menu-container {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  /* 主題切換按鈕 */
  .theme-toggle-btn {
    background: var(--card-bg-light);
    border: 1px solid var(--card-border);
    color: var(--text-main);
    padding: 8px 12px;
    border-radius: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.25s ease;
    outline: none;
  }
  .theme-toggle-btn:hover {
    border-color: var(--accent-blue);
    color: var(--accent-blue);
    transform: translateY(-1px);
  }
  .sun-icon {
    display: block;
  }
  .moon-icon {
    display: none;
  }
  body.light-theme .sun-icon {
    display: none;
  }
  body.light-theme .moon-icon {
    display: block;
  }
  
  .menu-toggle {
    display: none;
    font-size: 22px;
    padding: 6px 12px;
    cursor: pointer;
    background: var(--card-bg-light);
    border: 1px solid var(--card-border);
    color: var(--text-main);
    border-radius: 8px;
    transition: all 0.2s;
  }
  .menu-toggle:hover {
    border-color: var(--accent-blue);
  }
  .menu-toggle.active {
    border-color: var(--accent-blue);
    background: rgba(56, 189, 248, 0.12);
  }
  
  .nav {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .nav a {
    color: var(--text-muted);
    padding: 8px 14px;
    font-size: 0.92rem;
    font-weight: 500;
    text-decoration: none;
    border-radius: 20px;
    transition: all 0.2s ease;
    display: block;
  }
  .nav a:hover {
    color: var(--text-main);
    background: rgba(255, 255, 255, 0.05);
  }
  body.light-theme .nav a:hover {
    background: rgba(0, 0, 0, 0.05);
  }
  
  /* ========== 下拉選單樣式 (Dropdown Style) ========== */
  .dropdown {
    position: relative;
    display: inline-block;
  }
  
  .dropdown-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 8px 14px;
    font-size: 0.92rem;
    font-weight: 500;
    font-family: inherit;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
  .dropdown-btn .arrow {
    font-size: 0.7rem;
    transition: transform 0.2s ease;
  }
  
  .dropdown:hover .dropdown-btn,
  .dropdown.active .dropdown-btn {
    color: var(--text-main);
    background: rgba(255, 255, 255, 0.05);
  }
  body.light-theme .dropdown:hover .dropdown-btn,
  body.light-theme .dropdown.active .dropdown-btn {
    background: rgba(0, 0, 0, 0.05);
  }
  
  .dropdown:hover .arrow,
  .dropdown.active .arrow {
    transform: rotate(180deg);
  }
  
  .dropdown-content {
    position: absolute;
    top: 100%;
    left: 0;
    min-width: 190px;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    z-index: 3100;
    margin-top: 4px;
  
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease, visibility 0s linear 0.4s;
  }
  
  .dropdown-content::before {
    content: "";
    position: absolute;
    top: -8px;
    left: 0;
    width: 100%;
    height: 8px;
  }
  
  body.light-theme .dropdown-content {
    background: rgba(255, 255, 255, 0.98);
  }
  
  .dropdown:hover .dropdown-content,
  .dropdown.active .dropdown-content {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.25s ease, visibility 0s linear 0s;
  }
  
  .dropdown-content a {
    padding: 8px 12px;
    border-radius: 8px;
    white-space: nowrap;
    font-size: 0.88rem;
  }
    /* Main Page Content Layout */
    .page-wrapper {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 15px 80px 15px;
    }
    .main-title {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--text-main);
    }

    /* Variable Selector Bar Style */
    .variable-section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-main);
    }
    .variable-pills-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }
    .var-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .var-pill:hover {
      border-color: var(--accent-blue);
      color: var(--text-main);
    }
    .var-pill.active {
      background: var(--accent-blue);
      color: #fff;
      border-color: var(--accent-blue);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    /* Category Cards Grid */
    .category-box {
      margin-bottom: 24px;
    }
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 768px) {
      .content-grid { grid-template-columns: 1fr; }
    }

    /* 地圖與標記 CSS */
    .wbgt-map-wrapper {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background-color: #a0c2e7;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      border: 1px solid var(--card-border);
    }
    .map-image-container {
      position: relative;
      width: 100%;
    }
    .map-base-img {
      width: 100%;
      height: auto;
      display: block;
    }
    .map-pin {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 10;
      cursor: pointer;
      transition: transform 0.2s ease, z-index 0.2s;
    }
    .map-pin:hover {
      transform: translate(-50%, -50%) scale(1.18);
      z-index: 25;
    }
    .pin-badge {
      padding: 4px 8px;
      border-radius: 6px;
      color: #ffffff;
      font-weight: bold;
      font-size: 0.92rem;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      position: relative;
      border: 1px solid rgba(255,255,255,0.4);
      text-align: center;
    }

    /* ========== 9. 底部固定導航欄 (Bottom Fixed Bar) ========== */
    .bottom-fixed-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(11, 15, 25, 0.9);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 0;
      z-index: 2999;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
    }
    body.light-theme .bottom-fixed-bar {
      background: rgba(248, 250, 252, 0.92);
    }
    .bottom-bar-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      flex: 1;
      padding: 4px;
      outline: none;
    }
    .bottom-bar-btn svg {
      width: 20px;
      height: 20px;
    }
    .bottom-bar-btn:hover,
    .bottom-bar-btn.active {
      color: var(--accent-blue);
    }

    /* Legend Box Overlay inside Map */
    .map-legend {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 6px;
      padding: 8px 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      font-size: 12px;
      color: #1e293b;
      z-index: 20;
    }
    body:not(.light-theme) .map-legend {
      background: rgba(30, 41, 59, 0.9);
      color: #f8fafc;
      border: 1px solid var(--card-border);
    }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 3px 0;
    }
    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    /* Table Box Style */
    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      backdrop-filter: blur(12px);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 14px;
    }
    th, td {
      border: 1px solid var(--card-border);
      padding: 10px 8px;
      vertical-align: middle;
      color: var(--text-main);
    }
    th {
      background: var(--card-bg-light);
      font-weight: 700;
    }
    .status-pill {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      color: #fff;
    }
    .update-time-footer {
      text-align: right;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 12px;
    }

    /* Forecast Section Below */
    .forecast-section {
      margin-top: 32px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(12px);
    }
    .forecast-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text-main);
    }
  </style>
</head>

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z"/></svg>
        <span>天氣實況</span>
      </a>
      <a href="https://macaosso.github.io/MSSOweb/tc.html" class="bottom-bar-btn" style="text-decoration: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2a10 10 0 0 1 7.07 17.07"/><path d="M12 6a6 6 0 0 0-4.24 10.24"/></svg>
        <span>熱帶氣旋</span>
      </a>
      <a href="https://macaosso.github.io/MSSOweb/your-page.html" class="bottom-bar-btn" style="text-decoration: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span>天氣預報</span>
      </a>
      <a href="https://macaosso.github.io/MSSOweb/AQImap.html" class="bottom-bar-btn active" style="text-decoration: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19 12H2"/></svg>
        <span>空氣質素</span>
      </a>
    </div>
  </div>

  <script>
    const WAQI_TOKEN = "12bb8b9424111ee0791c1492f0b3f346667737e2";
    
    const stationsConfig = [
      { name: "荷蘭園", slug: "calcada-do-poco", category: "路邊", top: "35%", left: "37%" },
      { name: "九澳", slug: "ka-ho", category: "路邊", top: "75%", left: "78%" },
      { name: "台山", slug: "subestacao-macau-norte", category: "高密度住宅區", top: "18%", left: "30%" },
      { name: "氹仔中心區", slug: "parque-central-da-taipa", category: "高密度住宅區", top: "54%", left: "32%" },
      { name: "大潭山", slug: "taipa-grande", category: "一般性", top: "53%", left: "62%" },
      { name: "石排灣", slug: "coloane", category: "一般性", top: "80%", left: "22%" }
    ];

    let globalFetchedData = [];
    let globalForecastData = null;
    let currentSelectedVar = 'aqi';

    function getAQIStyle(aqi) {
      if (aqi <= 50) return { color: '#10b981', label: '良好', text: 'var(--accent-green)', bg: 'var(--bg-red)', border: 'var(--border-red)' };
      if (aqi <= 100) return { color: '#eab308', label: '普通', text: 'var(--accent-yellow)', bg: 'var(--bg-orange)', border: 'var(--border-orange)' };
      if (aqi <= 200) return { color: '#f97316', label: '不良', text: 'var(--accent-orange)', bg: 'var(--bg-orange)', border: 'var(--border-orange)' };
      if (aqi <= 300) return { color: '#ef4444', label: '非常不良', text: 'var(--accent-red)', bg: 'var(--bg-red)', border: 'var(--border-red)' };
      if (aqi <= 400) return { color: '#a855f7', label: '嚴重', text: 'var(--accent-purple)', bg: 'var(--bg-red)', border: 'var(--border-red)' };
      return { color: '#9f1239', label: '有害', text: 'var(--accent-red)', bg: 'var(--bg-red)', border: 'var(--border-red)' };
    }

    function toggleMenu() {
      const nav = document.getElementById('navMenu');
      nav.classList.toggle('show');
    }

    function toggleDropdown(e) {
      if (window.innerWidth <= 900) {
        e.stopPropagation();
        const dropdown = e.currentTarget;
        dropdown.classList.toggle('active');
      }
    }

    function toggleTheme() {
      document.body.classList.toggle('light-theme');
      const isLight = document.body.classList.contains('light-theme');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
      renderView(document.getElementById('updateTimeFooter').textContent.replace('更新時間: ', ''));
    }

    // Initialize state on load
    if (localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light-theme');
    } else {
      document.body.classList.remove('light-theme');
    }

    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleString('zh-Hant', { hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const clockEl = document.getElementById('headerClock');
      if (clockEl) clockEl.textContent = timeStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function fetchAirQualityData() {
      let fetchedResults = [];
      let latestTimeString = '';
      let sampleForecast = null;

      for (const st of stationsConfig) {
        try {
          const res = await fetch(`https://api.waqi.info/feed/macau/${st.slug}/?token=${WAQI_TOKEN}`);
          const json = await res.json();
          if (json.status === "ok" && json.data) {
            const timeStr = json.data.time && json.data.time.s ? json.data.time.s : '';
            if (timeStr && (!latestTimeString || timeStr > latestTimeString)) {
              latestTimeString = timeStr;
            }
            if (!sampleForecast && json.data.forecast && json.data.forecast.daily) {
              sampleForecast = json.data.forecast.daily;
            }

            const iaqi = json.data.iaqi || {};
            fetchedResults.push({
              ...st,
              aqi: json.data.aqi ?? 0,
              pm25: iaqi.pm25 ? iaqi.pm25.v : '--',
              pm10: iaqi.pm10 ? iaqi.pm10.v : '--',
              no2: iaqi.no2 ? iaqi.no2.v : '--',
              o3: iaqi.o3 ? iaqi.o3.v : '--',
              so2: iaqi.so2 ? iaqi.so2.v : '--',
              co: iaqi.co ? iaqi.co.v : '--',
              time: timeStr
            });
          }
        } catch (err) {
          console.error(`Error fetching station ${st.name}:`, err);
        }
      }

      globalFetchedData = fetchedResults;
      globalForecastData = sampleForecast;

      renderView(latestTimeString);
    }

    function renderCategoryCards(summaryTime) {
      const box = document.getElementById('categoryBox');
      const grid = document.getElementById('categoryGrid');
      const timeEl = document.getElementById('aqiUpdateTime');
      if (!grid) return;
      if (box) box.style.display = 'block';

      const categories = {
        "路邊": globalFetchedData.filter(s => s.category === "路邊"),
        "高密度住宅區": globalFetchedData.filter(s => s.category === "高密度住宅區"),
        "一般性": globalFetchedData.filter(s => s.category === "一般性")
      };

      grid.innerHTML = '';
      if (summaryTime) {
        timeEl.textContent = `(更新時間: ${summaryTime})`;
      }

      const order = ['路邊', '高密度住宅區', '一般性'];
      for (const catName of order) {
        const stations = categories[catName];
        if (!stations || stations.length === 0) continue;

        const sorted = [...stations].sort((a, b) => a.aqi - b.aqi);
        const low = sorted[0];
        const high = sorted[sorted.length - 1];
        const statusStyle = getAQIStyle(high.aqi);

        const card = document.createElement('div');
        card.style.cssText = `
          background: var(--card-bg);
          border: 1px solid var(--card-border);
          border-radius: 12px;
          padding: 12px;
          backdrop-filter: blur(12px);
        `;
        card.innerHTML = `
          <div style="font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 10px;">${catName}</div>
          <div style="font-size: 24px; font-weight: 800; color: var(--text-main); line-height: 1.2;">
            ${low.aqi} <span style="font-size: 14px; color: var(--text-muted); font-weight: 400;">~</span> ${high.aqi}
          </div>
          <div style="display: inline-block; margin-top: 6px; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; color: ${statusStyle.text}; background: ${statusStyle.bg}; border: 1px solid ${statusStyle.border};">
            ${statusStyle.label}
          </div>
          <div style="font-size: 11px; color: var(--text-muted); margin-top: 8px;">
            ${low.name} ${low.aqi} <br> ${high.name} ${high.aqi}
          </div>
        `;
        grid.appendChild(card);
      }
    }
    function applyTheme(theme) {
      if (theme === 'light') {
        document.body.classList.add('light-theme');
      } else {
        document.body.classList.remove('light-theme');
      }
      updateChartColors();
    }
    
    function toggleTheme() {
      const isLight = document.body.classList.contains('light-theme');
      const newTheme = isLight ? 'dark' : 'light';
      localStorage.setItem('msso_theme', newTheme);
      applyTheme(newTheme);
    }
    
    (function initTheme() {
      const savedTheme = localStorage.getItem('msso_theme');
      if (savedTheme) {
        if (savedTheme === 'light') document.body.classList.add('light-theme');
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.body.classList.add('light-theme');
      }
    })();
    
    function renderView(latestTimeString) {
      const mapContainer = document.getElementById('mapContainer');
      const tableBody = document.getElementById('aqiTableBody');
      const mainTitle = document.getElementById('mainTitle');
      const updateTimeFooter = document.getElementById('updateTimeFooter');
      const tableHeaderValue = document.getElementById('tableHeaderValue');
      const forecastTableBody = document.getElementById('forecastTableBody');

      const legendHTML = mapContainer.querySelector('.map-legend').outerHTML;
      mapContainer.innerHTML = legendHTML;

      if (globalFetchedData.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="4" style="padding: 20px; color: var(--text-muted);">無法載入空氣質素數據，請稍後再試。</td></tr>`;
        return;
      }

      let titleDateStr = '';
      if (latestTimeString) {
        const d = new Date(latestTimeString);
        if (!isNaN(d)) {
          titleDateStr = `${d.getFullYear()}年 ${String(d.getMonth()+1).padStart(2,'0')}月 ${String(d.getDate()).padStart(2,'0')}日 ${String(d.getHours()).padStart(2,'0')}時`;
          updateTimeFooter.textContent = `更新時間: ${latestTimeString}`;
        } else {
          titleDateStr = latestTimeString;
          updateTimeFooter.textContent = `更新時間: ${latestTimeString}`;
        }
      } else {
        const now = new Date();
        titleDateStr = `${now.getFullYear()}年 ${String(now.getMonth()+1).padStart(2,'0')}月 ${String(now.getDate()).padStart(2,'0')}日 ${String(now.getHours()).padStart(2,'0')}時`;
        updateTimeFooter.textContent = `更新時間: ${now.toISOString().slice(0, 19).replace('T', ' ')}`;
      }
      mainTitle.textContent = `即時空氣質量水平（${titleDateStr}）`;

      renderCategoryCards(latestTimeString);

      const varNames = {
        aqi: '指數',
        pm25: 'PM2.5 (μg/m³)',
        pm10: 'PM10 (μg/m³)',
        no2: 'NO2 (μg/m³)',
        o3: 'O3 (μg/m³)',
        so2: 'SO2 (μg/m³)',
        co: 'CO (mg/m³)'
      };
      tableHeaderValue.textContent = varNames[currentSelectedVar];

      const categories = ['路邊', '高密度住宅區', '一般性'];
      tableBody.innerHTML = '';

      categories.forEach(catName => {
        const catStations = globalFetchedData.filter(s => s.category === catName);
        catStations.forEach((st, index) => {
          const val = st[currentSelectedVar];
          const numericVal = typeof val === 'number' ? val : 0;
          const styleInfo = getAQIStyle(currentSelectedVar === 'aqi' ? numericVal : (numericVal <= 50 ? 30 : numericVal <= 100 ? 80 : 150));

          const marker = document.createElement('div');
          marker.className = 'station-marker';
          marker.style.top = st.top;
          marker.style.left = st.left;
          marker.innerHTML = `
            <div class="station-badge" style="background-color: ${styleInfo.color};">${val}</div>
            <div class="station-label">${st.name}</div>
          `;
          mapContainer.appendChild(marker);

          const tr = document.createElement('tr');
          let typeCellHtml = '';
          if (index === 0) {
            typeCellHtml = `<td rowspan="${catStations.length}" style="font-weight: 700;">${catName}</td>`;
          }
          tr.innerHTML = `
            ${typeCellHtml}
            <td>${st.name}</td>
            <td><span class="status-pill" style="background-color: ${styleInfo.color};">${styleInfo.label}</span></td>
            <td style="font-weight: 700; font-size: 16px;">${val}</td>
          `;
          tableBody.appendChild(tr);
        });
      });

      if (globalForecastData) {
        forecastTableBody.innerHTML = '';
        const pm25Days = globalForecastData.pm25 || [];
        const pm10Days = globalForecastData.pm10 || [];
        const o3Days = globalForecastData.o3 || [];

        const maxDays = Math.max(pm25Days.length, pm10Days.length, o3Days.length);
        for (let i = 0; i < Math.min(maxDays, 5); i++) {
          const dayItem = pm25Days[i] || pm10Days[i] || o3Days[i];
          const dateStr = dayItem ? dayItem.day : `預測日 ${i+1}`;
          const p25Avg = pm25Days[i] ? pm25Days[i].avg : '--';
          const p10Avg = pm10Days[i] ? pm10Days[i].avg : '--';
          const o3Avg = o3Days[i] ? o3Days[i].avg : '--';

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="font-weight: 700;">${dateStr}</td>
            <td>${p25Avg}</td>
            <td>${p10Avg}</td>
            <td>${o3Avg}</td>
          `;
          forecastTableBody.appendChild(tr);
        }
      } else {
        forecastTableBody.innerHTML = `<tr><td colspan="4" style="padding: 20px; color: var(--text-muted);">暫無可用的預測數據變數。</td></tr>`;
      }
    }

    document.querySelectorAll('.var-pill').forEach(pill => {
      pill.addEventListener('click', (e) => {
        document.querySelectorAll('.var-pill').forEach(p => p.classList.remove('active'));
        e.currentTarget.classList.add('active');
        currentSelectedVar = e.currentTarget.getAttribute('data-var');
        renderView('');
      });
    });

    document.addEventListener('DOMContentLoaded', fetchAirQualityData);
  </script>
</body>
</html>
