<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>澳門空氣質素 - 實況與預報</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary-color: #3b82f6;
    }
    body.light-theme {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px 16px 80px 16px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin: 20px 0 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #categoryGrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }
    .forecast-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
    }
    /* 底部固定導航欄 (Bottom Fixed Bar) */
    .bottom-fixed-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: var(--card-bg);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      z-index: 1000;
    }
    .bottom-bar-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      text-decoration: none;
      cursor: pointer;
    }
    .bottom-bar-btn.active {
      color: var(--primary-color);
    }
  </style>
</head>
<body>

  <h1>澳門空氣質素監測</h1>

  <!-- 當前空氣質素分類極值區 -->
  <div id="categoryBox" style="display:none;">
    <div class="section-title">
      <span>各區空氣質素現況</span>
      <span id="aqiUpdateTime" style="font-size: 12px; font-weight: 400; color: var(--text-muted);"></span>
    </div>
    <div id="categoryGrid"></div>
  </div>

  <!-- 空氣質素預報區 -->
  <div class="section-title">空氣質素預報與趨勢</div>
  <div class="forecast-box">
    <div style="font-size: 14px; font-weight: 600; margin-bottom: 8px;">未來幾日預測展望</div>
    <div id="aqiForecastContent" style="font-size: 13px; color: var(--text-muted);">
      載入預報數據中...
    </div>
  </div>

  <!-- 底部固定導航欄 (Bottom Fixed Bar) -->
  <div class="bottom-fixed-bar">
    <a href="index.html" class="bottom-bar-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/></svg>
      <span>實況</span>
    </a>
    <a href="forecast.html" class="bottom-bar-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
      <span>預報</span>
    </a>
    <a href="sevenday.html" class="bottom-bar-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>七日</span>
    </a>
    <a href="airquality.html" class="bottom-bar-btn active">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.5 9h7a2.5 2.5 0 0 1 0 5H5.5a2.5 2.5 0 0 1 0-5h10"/></svg>
      <span>空氣質素</span>
    </a>
  </div>

  <script>
    const WAQI_TOKEN = "12bb8b9424111ee0791c1492f0b3f346667737e2";
    const categories = {
      "路邊": [
        { name: "荷蘭園", slug: "calcada-do-poco" },
        { name: "九澳", slug: "ka-ho" }
      ],
      "高密度住宅區": [
        { name: "台山", slug: "subestacao-macau-norte" },
        { name: "氹仔中心區", slug: "parque-central-da-taipa" }
      ],
      "一般性": [
        { name: "大潭山", slug: "taipa-grande" },
        { name: "石排灣", slug: "coloane" }
      ]
    };

    function getAQIStyle(aqi) {
      const isLight = document.body.classList.contains('light-theme');
      if (aqi <= 50) return { bg: isLight ? '#dcfce7' : 'rgba(16, 185, 129, 0.12)', border: 'rgba(16, 185, 129, 0.35)', text: isLight ? '#047857' : '#34d399', label: '良好' };
      if (aqi <= 100) return { bg: isLight ? '#fef9c3' : 'rgba(234, 179, 8, 0.12)', border: 'rgba(234, 179, 8, 0.35)', text: isLight ? '#a16207' : '#facc15', label: '普通' };
      if (aqi <= 200) return { bg: isLight ? '#ffedd5' : 'rgba(249, 115, 22, 0.12)', border: 'rgba(249, 115, 22, 0.35)', text: isLight ? '#c2410c' : '#fb923c', label: '不良' };
      if (aqi <= 300) return { bg: isLight ? '#fee2e2' : 'rgba(239, 68, 68, 0.12)', border: 'rgba(239, 68, 68, 0.35)', text: isLight ? '#b91c1c' : '#f87171', label: '非常不良' };
      if (aqi <= 400) return { bg: isLight ? '#f3e8ff' : 'rgba(168, 85, 247, 0.12)', border: 'rgba(168, 85, 247, 0.35)', text: isLight ? '#7e22ce' : '#c084fc', label: '嚴重' };
      return { bg: isLight ? '#ffe4e6' : 'rgba(159, 18, 57, 0.12)', border: 'rgba(159, 18, 57, 0.35)', text: isLight ? '#be123c' : '#fb7185', label: '有害' };
    }

    async function getCategoryExtremes() {
      const summary = {};
      let latestTime = null;
      let forecastDataSample = null;

      for (const [catName, stations] of Object.entries(categories)) {
        let fetchedData = [];
        for (const station of stations) {
          try {
            const res = await fetch(`https://api.waqi.info/feed/macau/${station.slug}/?token=${WAQI_TOKEN}`);
            const json = await res.json();
            if (json.status === "ok" && json.data && typeof json.data.aqi === 'number') {
              const stationTime = (json.data.time && json.data.time.s) ? json.data.time.s : null;
              if (stationTime && (!latestTime || stationTime > latestTime)) {
                latestTime = stationTime;
              }
              if (!forecastDataSample && json.data.forecast && json.data.forecast.daily) {
                forecastDataSample = json.data.forecast.daily;
              }
              fetchedData.push({
                name: station.name,
                aqi: json.data.aqi,
                pollutant: json.data.dominentpol || '--',
                time: stationTime
              });
            }
          } catch (err) {
            console.error(`Failed to fetch ${station.name}:`, err);
          }
        }
        if (fetchedData.length > 0) {
          fetchedData.sort((a, b) => a.aqi - b.aqi);
          summary[catName] = {
            lowest: fetchedData[0],
            highest: fetchedData[fetchedData.length - 1]
          };
        }
      }
      summary.fetchedAt = latestTime;
      summary.forecast = forecastDataSample;
      return summary;
    }

    function renderCategoryCards(summary) {
      const box = document.getElementById('categoryBox');
      const grid = document.getElementById('categoryGrid');
      const timeEl = document.getElementById('aqiUpdateTime');
      const forecastEl = document.getElementById('aqiForecastContent');

      if (!grid) return;
      if (box) box.style.display = 'block';

      const order = ['路邊', '高密度住宅區', '一般性'];
      grid.innerHTML = '';
      
      if (summary.fetchedAt) {
        timeEl.textContent = `(更新時間: ${summary.fetchedAt})`;
      } else {
        timeEl.textContent = '';
      }

      for (const catName of order) {
        const data = summary[catName];
        if (!data) continue;

        const low = data.lowest;
        const high = data.highest;
        const statusStyle = getAQIStyle(high.aqi);

        const card = document.createElement('div');
        card.style.cssText = `
          background: var(--card-bg);
          border: 1px solid var(--card-border);
          border-radius: 12px;
          padding: 12px;
        `;
        card.innerHTML = `
          <div style="font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 10px;">${catName}</div>
          <div style="font-size: 24px; font-weight: 800; color: var(--text-main); line-height: 1.2;">
            ${low.aqi} <span style="font-size: 14px; color: var(--text-muted); font-weight: 400;">~</span> ${high.aqi}
          </div>
          <div style="display: inline-block; margin-top: 6px; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; color: ${statusStyle.text}; background: ${statusStyle.bg}; border: 1px solid ${statusStyle.border};">
            ${statusStyle.label}
          </div>
          <div style="font-size: 11px; color: var(--text-muted); margin-top: 8px;">
            ${low.name} ${low.aqi} <br> ${high.name} ${high.aqi}
          </div>
        `;
        grid.appendChild(card);
      }

      if (summary.forecast && summary.forecast.pm25) {
        let forecastHtml = '<ul style="padding-left: 20px; margin: 0;">';
        const pm25Days = summary.forecast.pm25.slice(0, 3);
        pm25Days.forEach(day => {
          forecastHtml += `<li><strong>${day.day}</strong>: PM2.5 預測平均 AQI 約 ${day.avg} (範圍: ${day.min} - ${day.max})</li>`;
        });
        forecastHtml += '</ul>';
        forecastEl.innerHTML = forecastHtml;
      } else {
        forecastEl.textContent = '暫無詳細預報數據。';
      }
    }

    async function initAQI() {
      const summary = await getCategoryExtremes();
      renderCategoryCards(summary);
    }

    document.addEventListener('DOMContentLoaded', initAQI);
  </script>
</body>
</html>
