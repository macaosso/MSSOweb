<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HKO 網格雨量預報</title>

  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- CSV Parser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; overflow: hidden; }

    #map { width: 100vw; height: 100vh; background: #1a202c; }

    .glass-card {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      color: #fff;
    }

    .top-info {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1000;
      padding: 12px 18px;
    }

    .controls-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 90%;
      max-width: 550px;
    }

    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    .btn:hover { background: #0369a1; }

    .slider { flex: 1; accent-color: #38bdf8; cursor: pointer; }

    .grid-label {
      background: transparent;
      border: none;
      font-weight: 800;
      font-size: 11px;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    }

    .peak-dot {
      width: 8px;
      height: 8px;
      background-color: #ff2222;
      border: 1.5px solid #ffffff;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <div class="top-info glass-card">
    <div style="font-weight: bold; color: #38bdf8; font-size: 15px;">HKO 網格雨量預報 (Nowcast)</div>
    <div id="status" style="font-size: 12px; color: #94a3b8; margin-top: 2px;">直接讀取 HKO API 數據中...</div>
  </div>

  <div class="controls-bar glass-card">
    <button id="playBtn" class="btn" onclick="togglePlay()">播放 ▶</button>
    <input type="range" id="slider" class="slider" min="0" max="0" value="0" oninput="onSlider(this.value)">
  </div>

  <div id="map"></div>

<script>
  const CSV_URL = "https://data.weather.gov.hk/weatherAPI/hko_data/F3/Gridded_rainfall_nowcast_tc.csv";
  const MACAU_LAT = 22.1595, MACAU_LON = 113.5685, KM_PER_DEG = 111.32;

  const colors = ["#15438e", "#2fdbeb", "#0F9C5D", "#52ee27", "#ffdd00", "#ff0000", "#4a4747", "#6C074E"];
  function getColor(val) {
    if (val >= 100) return colors[7];
    if (val >= 80)  return colors[6];
    if (val >= 50)  return colors[5];
    if (val >= 20)  return colors[4];
    if (val >= 10)  return colors[3];
    if (val >= 5)   return colors[2];
    if (val >= 1)   return colors[1];
    if (val >= 0.1) return colors[0];
    return "transparent";
  }

  // Initialize Map
  const map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([22.15, 113.6], 10);
  L.control.zoom({ position: 'topright' }).addTo(map);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 18 }).addTo(map);

  // Macau Distance Rings
  [10, 25, 50, 100].forEach(km => {
    L.circle([MACAU_LAT, MACAU_LON], {
      radius: km * 1000, color: '#949494', weight: 1, dashArray: '4,6', fill: false, opacity: 0.5
    }).addTo(map);
  });
  L.circleMarker([MACAU_LAT, MACAU_LON], { radius: 4, color: '#fff', fillColor: '#fff', fillOpacity: 1 }).addTo(map);

  let timeFrames = [];
  let frameMap = {};
  let currentIdx = 0;
  let timer = null;
  let layerGroup = L.layerGroup().addTo(map);

  // Fetch CSV directly
  async function loadHKOData() {
    try {
      const res = await fetch(CSV_URL);
      const text = await res.text();
      
      Papa.parse(text, {
        header: true,
        skipEmptyLines: true,
        complete: (res) => processData(res.data)
      });
    } catch (err) {
      document.getElementById('status').textContent = "讀取數據失敗：" + err.message;
    }
  }

  function processData(rows) {
    if (!rows.length) return;

    const sample = rows[0];
    const latCol = Object.keys(sample).find(k => k.includes('緯度'));
    const lonCol = Object.keys(sample).find(k => k.includes('經度'));
    const rainCol = Object.keys(sample).find(k => k.includes('雨量'));
    const timeCol = Object.keys(sample).find(k => k.includes('時間') && (k.includes('完結') || k.includes('結束')));

    rows.forEach(r => {
      const time = r[timeCol]?.trim();
      const lat = parseFloat(r[latCol]);
      const lon = parseFloat(r[lonCol]);
      const rain = parseFloat(r[rainCol]);

      if (!time || isNaN(lat) || isNaN(lon) || isNaN(rain)) return;

      if (!frameMap[time]) frameMap[time] = [];
      if (rain >= 0.1) frameMap[time].push({ lat, lon, rain });
    });

    timeFrames = Object.keys(frameMap).sort().slice(0, 4);
    const slider = document.getElementById('slider');
    slider.max = timeFrames.length - 1;

    renderFrame(0);
  }

  function renderFrame(idx) {
    currentIdx = idx;
    document.getElementById('slider').value = idx;
    layerGroup.clearLayers();

    const timestamp = timeFrames[idx];
    const pts = frameMap[timestamp] || [];

    if (timestamp && timestamp.length === 12) {
      document.getElementById('status').textContent = 
        `預報時間: ${timestamp.slice(0,4)}-${timestamp.slice(4,6)}-${timestamp.slice(6,8)} ${timestamp.slice(8,10)}:${timestamp.slice(10,12)}`;
    }

    // Grid rendering
    pts.forEach(p => {
      L.rectangle([[p.lat - 0.006, p.lon - 0.006], [p.lat + 0.006, p.lon + 0.006]], {
        color: 'transparent', fillColor: getColor(p.rain), fillOpacity: 0.65, interactive: false
      }).addTo(layerGroup);
    });

    // Sample points for numbers
    samplePoints(pts, 0.02, 2.0).forEach(p => {
      L.marker([p.lat, p.lon], {
        icon: L.divIcon({ className: 'grid-label', html: `<span style="color:${getColor(p.rain)}">${Math.round(p.rain)}</span>` })
      }).addTo(layerGroup);
    });
  }

  function samplePoints(pts, minDist, minRain) {
    const selected = [];
    pts.filter(p => p.rain >= minRain).forEach(p => {
      if (!selected.some(s => Math.hypot(p.lon - s.lon, p.lat - s.lat) < minDist)) {
        selected.push(p);
      }
    });
    return selected;
  }

  function togglePlay() {
    const btn = document.getElementById('playBtn');
    if (timer) {
      clearInterval(timer);
      timer = null;
      btn.textContent = "播放 ▶";
    } else {
      btn.textContent = "暫停 ❚❚";
      timer = setInterval(() => {
        renderFrame((currentIdx + 1) % timeFrames.length);
      }, 800);
    }
  }

  function onSlider(v) {
    if (timer) togglePlay();
    renderFrame(parseInt(v));
  }

  loadHKOData();
</script>
</body>
</html>
