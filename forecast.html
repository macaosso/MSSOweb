<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<link rel="icon" type="image/png" href="icons/MSSO.png">
<title>澳門民間氣象台 - 天氣預報</title>
<style>
/* ========== 1. 深太空 (Deep Space) 全域主題基礎 ========== */
:root {
  --bg-dark: #0b0f19;
  --card-bg: rgba(22, 30, 46, 0.75);
  --card-bg-light: rgba(255, 255, 255, 0.03);
  --card-border: rgba(255, 255, 255, 0.08);
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  
  --accent-blue: #38bdf8;
  --accent-teal: #2dd4bf;
  --accent-green: #34d399;
  --accent-yellow: #facc15;
  --accent-orange: #f59e0b;
  --accent-red: #ef4444;
  --accent-purple: #c084fc;
}

body.light-theme {
  --bg-dark: #f8fafc;
  --card-bg: rgba(255, 255, 255, 0.85);
  --card-bg-light: rgba(0, 0, 0, 0.04);
  --card-border: rgba(0, 0, 0, 0.12);
  --text-main: #0f172a;
  --text-muted: #64748b;

  --accent-blue: #0284c7;
  --accent-teal: #0d9488;
  --accent-green: #059669;
  --accent-yellow: #d97706;
  --accent-orange: #d97706;
  --accent-red: #dc2626;
  --accent-purple: #9333ea;
}

html {
  scroll-behavior: smooth;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-main);
  line-height: 1.6;
  transition: background-color 0.3s ease, color 0.3s ease;
}

.page-wrapper {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 15px 80px 15px;
}

/* ========== 2. 頁頭 Header & 頂欄導航 ========== */
.header-nav-container {
  position: sticky;
  top: 0;
  z-index: 3000;
  background: rgba(11, 15, 25, 0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--card-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 1.5rem;
  margin-bottom: 20px;
  transition: background 0.3s ease;
}
body.light-theme .header-nav-container {
  background: rgba(248, 250, 252, 0.88);
}

.header {
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo {
  height: 38px;
  width: auto;
  filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.3));
}
.title {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--accent-blue);
  letter-spacing: 0.5px;
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.header-clock {
  font-size: 0.88rem;
  font-weight: 500;
  color: var(--accent-teal);
  font-variant-numeric: tabular-nums;
  opacity: 0.9;
}

.menu-container {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
}

.theme-toggle-btn {
  background: var(--card-bg-light);
  border: 1px solid var(--card-border);
  color: var(--text-main);
  padding: 8px 12px;
  border-radius: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.25s ease;
  outline: none;
}
.theme-toggle-btn:hover {
  border-color: var(--accent-blue);
  color: var(--accent-blue);
  transform: translateY(-1px);
}
.sun-icon { display: block; }
.moon-icon { display: none; }
body.light-theme .sun-icon { display: none; }
body.light-theme .moon-icon { display: block; }

.menu-toggle {
  display: none;
  font-size: 22px;
  padding: 6px 12px;
  cursor: pointer;
  background: var(--card-bg-light);
  border: 1px solid var(--card-border);
  color: var(--text-main);
  border-radius: 8px;
  transition: all 0.2s;
}

.nav {
  display: flex;
  gap: 8px;
  align-items: center;
}
.nav a {
  color: var(--text-muted);
  padding: 8px 14px;
  font-size: 0.92rem;
  font-weight: 500;
  text-decoration: none;
  border-radius: 20px;
  transition: all 0.2s ease;
  display: block;
}
.nav a:hover, .nav a.active {
  color: var(--text-main);
  background: rgba(255, 255, 255, 0.05);
}
body.light-theme .nav a:hover, body.light-theme .nav a.active {
  background: rgba(0, 0, 0, 0.05);
}

.dropdown {
  position: relative;
  display: inline-block;
}
.dropdown-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  padding: 8px 14px;
  font-size: 0.92rem;
  font-weight: 500;
  font-family: inherit;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 6px;
}
.dropdown-btn .arrow {
  font-size: 0.7rem;
  transition: transform 0.2s ease;
}
.dropdown:hover .dropdown-btn, .dropdown.active .dropdown-btn {
  color: var(--text-main);
  background: rgba(255, 255, 255, 0.05);
}
body.light-theme .dropdown:hover .dropdown-btn,
body.light-theme .dropdown.active .dropdown-btn {
  background: rgba(0, 0, 0, 0.05);
}
.dropdown:hover .arrow, .dropdown.active .arrow {
  transform: rotate(180deg);
}
.dropdown-content {
  position: absolute;
  top: 100%;
  left: 0;
  min-width: 190px;
  background: rgba(15, 23, 42, 0.95);
  backdrop-filter: blur(16px);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 6px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  z-index: 3100;
  margin-top: 4px;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.25s ease, visibility 0s linear 0.4s;
}
body.light-theme .dropdown-content {
  background: rgba(255, 255, 255, 0.98);
}
.dropdown:hover .dropdown-content, .dropdown.active .dropdown-content {
  opacity: 1;
  visibility: visible;
  transition: opacity 0.25s ease, visibility 0s linear 0s;
}
.dropdown-content a {
  padding: 8px 12px;
  border-radius: 8px;
  white-space: nowrap;
  font-size: 0.88rem;
}

/* ========== 天氣預報主面板樣式 ========== */
.forecast-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  margin-bottom: 25px;
}
.forecast-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--card-border);
  padding-bottom: 12px;
}
.forecast-title {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--accent-blue);
  display: flex;
  align-items: center;
  gap: 8px;
}
.forecast-meta {
  font-size: 0.88rem;
  color: var(--text-muted);
}

/* 變數切換按鈕群組 */
.variable-selectors {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.var-btn {
  background: var(--card-bg-light);
  border: 1px solid var(--card-border);
  color: var(--text-muted);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}
.var-btn:hover {
  border-color: var(--accent-blue);
  color: var(--text-main);
}
.var-btn.active {
  background: rgba(56, 189, 248, 0.15);
  border-color: var(--accent-blue);
  color: var(--accent-blue);
}

/* 數據表格容器 */
.forecast-table-container {
  overflow-x: auto;
}
.forecast-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.92rem;
  text-align: center;
}
.forecast-table th, .forecast-table td {
  padding: 12px 10px;
  border-bottom: 1px solid var(--card-border);
  white-space: nowrap;
}
.forecast-table th {
  background: rgba(56, 189, 248, 0.1);
  color: var(--accent-blue);
  font-weight: 600;
}
.forecast-table tr:hover {
  background: rgba(255, 255, 255, 0.02);
}
body.light-theme .forecast-table tr:hover {
  background: rgba(0, 0, 0, 0.02);
}

.loading-state, .error-state {
  text-align: center;
  padding: 40px;
  color: var(--text-muted);
  font-size: 1rem;
}

/* ========== 底部固定導航欄 ========== */
.bottom-fixed-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: rgba(11, 15, 25, 0.9);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--card-border);
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 8px 0;
  z-index: 2999;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
}
body.light-theme .bottom-fixed-bar {
  background: rgba(248, 250, 252, 0.92);
}
.bottom-bar-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  flex: 1;
  padding: 4px;
  text-decoration: none;
  outline: none;
}
.bottom-bar-btn svg {
  width: 20px;
  height: 20px;
}
.bottom-bar-btn:hover, .bottom-bar-btn.active {
  color: var(--accent-blue);
}

@media (max-width: 768px) {
  .menu-toggle { display: block; }
  .nav {
    display: none;
    flex-direction: column;
    width: 230px;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    align-items: stretch;
  }
  body.light-theme .nav { background: rgba(255, 255, 255, 0.98); }
  .nav a { width: 100%; padding: 10px 14px; border-radius: 8px; }
  .nav.active { display: flex; }
  .dropdown { width: 100%; }
  .dropdown-btn { width: 100%; justify-content: space-between; padding: 10px 14px; border-radius: 8px; }
  .dropdown-content {
    position: static;
    display: none;
    opacity: 1;
    visibility: visible;
    box-shadow: none;
    border: none;
    background: rgba(255, 255, 255, 0.03);
    margin-top: 4px;
    padding-left: 10px;
    border-left: 2px solid var(--accent-blue);
    border-radius: 0 8px 8px 0;
  }
  body.light-theme .dropdown-content { background: rgba(0, 0, 0, 0.03); }
  .dropdown.active .dropdown-content { display: block; }
}

@media (min-width: 769px) {
  .nav { display: flex !important; }
  .menu-toggle { display: none !important; }
}
</style>
</head>

<script>
let weatherDataCache = null;
let currentViewMode = 'all';

function applyTheme(theme) {
  if (theme === 'light') {
    document.body.classList.add('light-theme');
  } else {
    document.body.classList.remove('light-theme');
  }
}

function toggleTheme() {
  const isLight = document.body.classList.contains('light-theme');
  const newTheme = isLight ? 'dark' : 'light';
  localStorage.setItem('msso_theme', newTheme);
  applyTheme(newTheme);
}

(function initTheme() {
  const savedTheme = localStorage.getItem('msso_theme');
  if (savedTheme) {
    if (savedTheme === 'light') document.body.classList.add('light-theme');
  } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
    document.body.classList.add('light-theme');
  }
})();

function toggleMenu() {
  const nav = document.getElementById("navMenu");
  const btn = document.querySelector(".menu-toggle");
  nav.classList.toggle("active");
  btn.innerHTML = nav.classList.contains("active") ? "✕" : "☰";
}

function updateHeaderClock() {
  const clockEl = document.getElementById('headerClock');
  if (clockEl) {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const date = String(now.getDate()).padStart(2, '0');
    const hrs = String(now.getHours()).padStart(2, '0');
    const mins = String(now.getMinutes()).padStart(2, '0');
    const secs = String(now.getSeconds()).padStart(2, '0');
    clockEl.textContent = ` ${year}年${month}月${date}日 ${hrs}:${mins}:${secs} MST`;
  }
}

function getWindDirectionText(degrees) {
  if (degrees === undefined || degrees === null) return '-';
  const directions = ['北 (N)', '北東北 (NNE)', '東北 (NE)', '東北東 (ENE)', '東 (E)', '東南東 (ESE)', '東南 (SE)', '南東 (SSE)', '南 (S)', '南西南 (SSW)', '西南 (SW)', '西南西 (WSW)', '西 (W)', '西北西 (WNW)', '西北 (NW)', '北西北 (NNW)'];
  const val = Math.floor((degrees / 22.5) + 0.5);
  return directions[(val % 16)];
}

async function fetchWeatherData() {
  const statusEl = document.getElementById('updateStatus');
  const container = document.getElementById('forecastContainer');
  
  try {
    // Open-Meteo API: 22.1595, 113.5685, minutely_15 for 6 hours = 24 time steps
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=22.1595&longitude=113.5685&minutely_15=temperature_2m,wind_speed_10m,wind_direction_10m,precipitation,rain&hourly=precipitation_probability&forecast_minutely_15=24&timezone=auto';
    
    const response = await fetch(url);
    if (!response.ok) throw new Error('網絡請求失敗');
    const data = await response.json();
    
    weatherDataCache = data;
    renderWeatherData();
    
    if (statusEl) {
      const now = new Date();
      statusEl.textContent = `更新時間: ${now.toLocaleTimeString()} | 數據來源: Open-Meteo`;
    }
  } catch (err) {
    console.error(err);
    if (container) {
      container.innerHTML = `<div class="error-state">無法加載天氣數據，請檢查網絡連接或稍後再試。<br><small>${err.message}</small></div>`;
    }
    if (statusEl) statusEl.textContent = '更新失敗';
  }
}

function switchVariable(mode, btn) {
  currentViewMode = mode;
  document.querySelectorAll('.var-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderWeatherData();
}

function renderWeatherData() {
  const container = document.getElementById('forecastContainer');
  if (!weatherDataCache || !weatherDataCache.minutely_15) return;

  const m15 = weatherDataCache.minutely_15;
  const times = m15.time;
  const temps = m15.temperature_2m;
  const windSpeeds = m15.wind_speed_10m;
  const windDirs = m15.wind_direction_10m;
  const precip = m15.precipitation;
  const rain = m15.rain;

  const hourly = weatherDataCache.hourly || {};
  const hourlyProbs = hourly.precipitation_probability || [];
  const hourlyTimes = hourly.time || [];

  let html = `
    <table class="forecast-table">
      <thead>
        <tr>
          <th>時間 (15分鐘)</th>
  `;

  if (currentViewMode === 'all' || currentViewMode === 'temp') html += `<th>氣溫 (°C)</th>`;
  if (currentViewMode === 'all' || currentViewMode === 'wind') html += `<th>風速 (km/h)</th><th>風向</th>`;
  if (currentViewMode === 'all' || currentViewMode === 'prob') html += `<th>降雨機率 (%)</th>`;
  if (currentViewMode === 'all' || currentViewMode === 'rain') html += `<th>降雨量 (mm)</th>`;

  html += `
        </tr>
      </thead>
      <tbody>
  `;

  for (let i = 0; i < times.length; i++) {
    const timeStr = new Date(times[i]).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const temp = temps[i] !== undefined ? temps[i].toFixed(1) : '-';
    const ws = windSpeeds[i] !== undefined ? windSpeeds[i].toFixed(1) : '-';
    const wdDeg = windDirs[i];
    const wdText = getWindDirectionText(wdDeg);
    const r = rain[i] !== undefined ? rain[i].toFixed(2) : (precip[i] !== undefined ? precip[i].toFixed(2) : '0.00');

    let prob = '-';
    if (hourlyTimes.length > 0) {
      const tDate = new Date(times[i]);
      const hourKey = `${String(tDate.getHours()).padStart(2, '0')}:00`;
      const hIdx = hourlyTimes.findIndex(ht => ht.includes(hourKey) || new Date(ht).getHours() === tDate.getHours());
      if (hIdx !== -1 && hourlyProbs[hIdx] !== undefined) {
        prob = hourlyProbs[hIdx] + '%';
      } else {
        prob = '10%';
      }
    } else {
      prob = r > 0 ? '60%' : '10%';
    }

    html += `<tr>`;
    html += `<td><strong>${timeStr}</strong></td>`;

    if (currentViewMode === 'all' || currentViewMode === 'temp') html += `<td>${temp} °C</td>`;
    if (currentViewMode === 'all' || currentViewMode === 'wind') html += `<td>${ws} km/h</td><td>${wdText} (${wdDeg !== undefined ? Math.round(wdDeg) + '°' : '-'})</td>`;
    if (currentViewMode === 'all' || currentViewMode === 'prob') html += `<td>${prob}</td>`;
    if (currentViewMode === 'all' || currentViewMode === 'rain') html += `<td>${r} mm</td>`;

    html += `</tr>`;
  }

  html += `
      </tbody>
    </table>
  `;

  container.innerHTML = html;
}

window.addEventListener('DOMContentLoaded', function(){
    updateHeaderClock();
    setInterval(updateHeaderClock, 1000);
    fetchWeatherData();
    setInterval(fetchWeatherData, 600000);
});
</script>

</body>
</html>
