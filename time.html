<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界時區與各國時間 - 澳門民間氣象台 MSSO</title>
    <link rel="icon" type="image/png" href="icons/MSSO.png">
    
    <style>
        /* ========== 主題基礎變數 ========== */
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e2f;
            --card-bg-light: rgba(255, 255, 255, 0.05);
            --card-border: #2d2d50;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent-blue: #38bdf8;
            --accent-teal: #2dd4bf;
            --accent-red: #ef4444;
            --accent-gold: #f59e0b;
        }

        body.light-theme {
            --bg-dark: #f8fafc;
            --card-bg: #ffffff;
            --card-bg-light: rgba(0, 0, 0, 0.04);
            --card-border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-blue: #0284c7;
            --accent-teal: #0d9488;
            --accent-red: #dc2626;
            --accent-gold: #d97706;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 0 0 20px 0;
            font-size: 14px;
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ========== 頂欄導航 Navbar ========== */
        .header-nav-container {
            position: sticky;
            top: 0;
            z-index: 3000;
            background: rgba(18, 18, 18, 0.88);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.5rem;
            margin-bottom: 20px;
            transition: background 0.3s ease;
        }
        body.light-theme .header-nav-container {
            background: rgba(248, 250, 252, 0.88);
        }

        .header-logo-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo {
            height: 38px;
            width: auto;
            filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.3));
        }
        .title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-blue);
            letter-spacing: 0.5px;
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }
        .header-clock {
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--accent-teal);
            font-variant-numeric: tabular-nums;
            opacity: 0.9;
        }

        .menu-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-toggle-btn {
            background: var(--card-bg-light);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.25s ease;
            outline: none;
        }
        .theme-toggle-btn:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            transform: translateY(-1px);
        }
        .sun-icon { display: block; }
        .moon-icon { display: none; }
        body.light-theme .sun-icon { display: none; }
        body.light-theme .moon-icon { display: block; }

        .menu-toggle {
            display: none;
            font-size: 22px;
            padding: 6px 12px;
            cursor: pointer;
            background: var(--card-bg-light);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .nav a {
            color: var(--text-muted);
            padding: 8px 14px;
            font-size: 0.92rem;
            font-weight: 500;
            text-decoration: none;
            border-radius: 20px;
            transition: all 0.2s ease;
            display: block;
        }
        .nav a:hover, .nav a.active {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.08);
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 14px;
            font-size: 0.92rem;
            font-weight: 500;
            font-family: inherit;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            min-width: 190px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 6px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 3100;
        }
        .dropdown:hover .dropdown-content, .dropdown.active .dropdown-content {
            display: block;
        }
        .dropdown-content a {
            padding: 8px 12px;
            border-radius: 8px;
            white-space: nowrap;
        }

        /* Header Sub-bar */
        header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #f0f0f0;
            padding: 20px 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        body.light-theme header {
            background: linear-gradient(135deg, #e0f2fe, #bae6fd);
            color: #0f172a;
        }
        header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .meta-info {
            text-align: right;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* View Switch */
        .view-switch {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }
        .view-switch button {
            padding: 10px 18px;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.25s ease;
        }
        .view-switch button.active {
            background: #3b82f6;
            color: #fff;
            box-shadow: 0 3px 10px rgba(59, 130, 246, 0.3);
            border-color: #3b82f6;
        }
        .view-switch button:hover:not(.active) {
            background: var(--card-bg-light);
            color: var(--text-main);
        }

        /* ========== 世界時鐘 Grid ========== */
        .clock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .clock-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.25);
            transition: transform 0.25s ease, border-color 0.25s ease;
            position: relative;
            overflow: hidden;
        }
        .clock-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-blue);
        }
        .clock-card.home-city {
            border-left: 5px solid var(--accent-teal);
        }
        .clock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .city-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
        }
        .utc-badge {
            font-size: 0.78rem;
            padding: 3px 8px;
            border-radius: 12px;
            background: var(--card-bg-light);
            color: var(--accent-blue);
            border: 1px solid var(--card-border);
            font-weight: 600;
        }
        .clock-time {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-blue);
            font-variant-numeric: tabular-nums;
            margin-bottom: 4px;
        }
        .clock-date {
            font-size: 0.88rem;
            color: var(--text-muted);
        }
        .day-night-indicator {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.2rem;
            opacity: 0.8;
        }

        /* ========== 時區轉換器 Converter ========== */
        .converter-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .converter-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-main);
        }
        .converter-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            align-items: end;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-muted);
        }
        .form-control {
            background: var(--card-bg-light);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: var(--accent-blue);
        }
        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .result-item {
            background: var(--card-bg-light);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px 16px;
        }
        .result-city {
            font-weight: 600;
            color: var(--accent-teal);
        }
        .result-time {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
        }

        /* ========== 表格 Table ========== */
        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.3);
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.88rem;
            color: var(--text-main);
        }
        .data-table th, .data-table td {
            border: 1px solid var(--card-border);
            padding: 11px;
            text-align: center;
        }
        .data-table th {
            background: var(--card-bg-light);
            font-weight: 600;
        }
        .data-table tr:hover {
            background: var(--card-bg-light);
        }

        .search-box {
            width: 100%;
            max-width: 300px;
            margin-bottom: 15px;
        }

        .hide { display: none !important; }

        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .nav {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                right: 0;
                background: var(--card-bg);
                width: 200px;
                padding: 10px;
                border: 1px solid var(--card-border);
                border-radius: 12px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            }
            .nav.active { display: flex; }
        }
    </style>
</head>

<div class="container">
    <header>
        <div>
            <h1>世界時區與各國時間</h1>
            <small style="color: #2ecc71;">● 實時世界時鐘 | 快捷時區對照與換算</small>
        </div>
        <div class="meta-info">
            <div>基準時間：UTC / GMT</div>
            <div>自動秒級實時同步</div>
        </div>
    </header>

    <!-- 視圖切換按鈕 -->
    <div class="view-switch">
        <button id="btn-clock-view" class="active">世界時鐘</button>
        <button id="btn-converter-view">時區換算器</button>
        <button id="btn-table-view">時區列表</button>
    </div>

    <!-- 1. 世界時鐘視圖 -->
    <div id="clock-view">
        <div class="clock-grid" id="clockGrid">
            <!-- JavaScript 動態生成時鐘卡片 -->
        </div>
    </div>

    <!-- 2. 時區轉換器視圖 -->
    <div id="converter-view" class="hide">
        <div class="converter-card">
            <div class="converter-title">跨時區時間換算</div>
            <div class="converter-form">
                <div class="form-group">
                    <label for="sourceTime">選擇日期與時間</label>
                    <input type="datetime-local" id="sourceTime" class="form-control">
                </div>
                <div class="form-group">
                    <label for="sourceZone">來源時區</label>
                    <select id="sourceZone" class="form-control"></select>
                </div>
            </div>
            
            <div class="converter-title" style="font-size:1.1rem; margin-top:20px;">換算結果</div>
            <div class="result-grid" id="converterResults">
                <!-- 換算結果動態生成 -->
            </div>
        </div>
    </div>

    <!-- 3. 時區列表視圖 -->
    <div id="table-view" class="hide">
        <div class="table-container">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap:wrap; gap:10px;">
                <div style="font-size:1.1rem;font-weight:bold;">全球主要時區對照表</div>
                <input type="text" id="tableSearch" class="form-control search-box" placeholder="搜尋城市、國家或時區...">
            </div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>城市 / 地區</th>
                        <th>國家 / 區域</th>
                        <th>時區代碼</th>
                        <th>UTC 偏移量</th>
                        <th>當前時間</th>
                    </tr>
                </thead>
                <tbody id="timezoneTableBody">
                    <!-- 表格數據由 JS 填充 -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
// ========== 時區資料設定 ==========
const timezones = [
    { city: "澳門 / 香港 / 北京", country: "中國", zone: "Asia/Macau", code: "CST", isHome: true },
    { city: "東京", country: "日本", zone: "Asia/Tokyo", code: "JST" },
    { city: "首爾", country: "韓國", zone: "Asia/Seoul", code: "KST" },
    { city: "新加坡", country: "新加坡", zone: "Asia/Singapore", code: "SGT" },
    { city: "曼谷", country: "泰國", zone: "Asia/Bangkok", code: "ICT" },
    { city: "新德里", country: "印度", zone: "Asia/Kolkata", code: "IST" },
    { city: "杜拜", country: "阿聯酋", zone: "Asia/Dubai", code: "GST" },
    { city: "莫斯科", country: "俄羅斯", zone: "Europe/Moscow", code: "MSK" },
    { city: "開羅", country: "埃及", zone: "Africa/Cairo", code: "EEST" },
    { city: "巴黎 / 柏林", country: "歐洲", zone: "Europe/Paris", code: "CET/CEST" },
    { city: "倫敦", country: "英國", zone: "Europe/London", code: "GMT/BST" },
    { city: "紐約", country: "美國 (東部)", zone: "America/New_York", code: "EST/EDT" },
    { city: "芝加哥", country: "美國 (中部)", zone: "America/Chicago", code: "CST/CDT" },
    { city: "洛杉磯", country: "美國 (太平洋)", zone: "America/Los_Angeles", code: "PST/PDT" },
    { city: "檀香山", country: "夏威夷", zone: "Pacific/Honolulu", code: "HST" },
    { city: "雪梨 / 悉尼", country: "澳洲", zone: "Australia/Sydney", code: "AEST/AEDT" },
    { city: "奧克蘭", country: "紐西蘭", zone: "Pacific/Auckland", code: "NZST/NZDT" }
];

// ========== 1. 頁面初始化與視圖切換 ==========
document.getElementById('btn-clock-view').addEventListener('click', function() {
    switchView('clock-view', this);
});
document.getElementById('btn-converter-view').addEventListener('click', function() {
    switchView('converter-view', this);
});
document.getElementById('btn-table-view').addEventListener('click', function() {
    switchView('table-view', this);
});

function switchView(viewId, btnEl) {
    document.querySelectorAll('.view-switch button').forEach(b => b.classList.remove('active'));
    btnEl.classList.add('active');

    document.getElementById('clock-view').classList.add('hide');
    document.getElementById('converter-view').classList.add('hide');
    document.getElementById('table-view').classList.add('hide');

    document.getElementById(viewId).classList.remove('hide');
}

// ========== 2. 世界時鐘渲染與更新 ==========
function initClockGrid() {
    const grid = document.getElementById('clockGrid');
    grid.innerHTML = '';

    timezones.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = `clock-card ${item.isHome ? 'home-city' : ''}`;
        card.id = `clock-card-${index}`;

        card.innerHTML = `
            <div class="clock-header">
                <span class="city-name">${item.city}</span>
                <span class="utc-badge" id="utc-badge-${index}">UTC...</span>
            </div>
            <div class="clock-time" id="clock-time-${index}">00:00:00</div>
            <div class="clock-date" id="clock-date-${index}">載入中...</div>
        `;
        grid.appendChild(card);
    });
}

function updateClocks() {
    const now = new Date();

    timezones.forEach((item, index) => {
        try {
            const timeFormatter = new Intl.DateTimeFormat('zh-Hant', {
                timeZone: item.zone,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            const dateFormatter = new Intl.DateTimeFormat('zh-Hant', {
                timeZone: item.zone,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                weekday: 'short'
            });

            const offsetFormatter = new Intl.DateTimeFormat('en', {
                timeZone: item.zone,
                timeZoneName: 'shortOffset'
            });

            const parts = offsetFormatter.formatToParts(now);
            const offsetPart = parts.find(p => p.type === 'timeZoneName')?.value || '';

            const timeEl = document.getElementById(`clock-time-${index}`);
            const dateEl = document.getElementById(`clock-date-${index}`);
            const badgeEl = document.getElementById(`utc-badge-${index}`);

            if (timeEl) timeEl.textContent = timeFormatter.format(now);
            if (dateEl) dateEl.textContent = dateFormatter.format(now);
            if (badgeEl) badgeEl.textContent = offsetPart.replace('GMT', 'UTC');
        } catch (e) {
            console.error("時區解析錯誤: ", item.zone, e);
        }
    });
}

// ========== 3. 時區轉換器邏輯 ==========
function initConverter() {
    const sourceSelect = document.getElementById('sourceZone');
    const sourceTimeInput = document.getElementById('sourceTime');

    sourceSelect.innerHTML = '';
    timezones.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.zone;
        opt.textContent = `${item.city} (${item.country})`;
        if (item.isHome) opt.selected = true;
        sourceSelect.appendChild(opt);
    });

    // 預設當前當地時間
    const now = new Date();
    const tzOffset = now.getTimezoneOffset() * 60000;
    const localISOTime = (new Date(now.getTime() - tzOffset)).toISOString().slice(0, 16);
    sourceTimeInput.value = localISOTime;

    sourceTimeInput.addEventListener('input', calculateConversion);
    sourceSelect.addEventListener('change', calculateConversion);

    calculateConversion();
}

function calculateConversion() {
    const timeVal = document.getElementById('sourceTime').value;
    const sourceZone = document.getElementById('sourceZone').value;
    const container = document.getElementById('converterResults');
    if (!timeVal) return;

    // 解析選定輸入時間與時區
    const baseDate = new Date(timeVal);

    container.innerHTML = '';

    timezones.forEach(item => {
        try {
            const timeFormatter = new Intl.DateTimeFormat('zh-Hant', {
                timeZone: item.zone,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                weekday: 'short',
                hour12: false
            });

            const convertedStr = timeFormatter.format(baseDate);

            const div = document.createElement('div');
            div.className = 'result-item';
            div.innerHTML = `
                <div class="result-city">${item.city} <small style="color:var(--text-muted)">(${item.country})</small></div>
                <div class="result-time">${convertedStr}</div>
            `;
            container.appendChild(div);
        } catch (e) {}
    });
}

// ========== 4. 時區表格與搜尋 ==========
function initTimezoneTable() {
    const tbody = document.getElementById('timezoneTableBody');
    const now = new Date();

    tbody.innerHTML = '';
    timezones.forEach(item => {
        const tr = document.createElement('tr');

        let timeStr = '--';
        let offsetStr = '--';

        try {
            const timeFormatter = new Intl.DateTimeFormat('zh-Hant', {
                timeZone: item.zone,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
            const offsetFormatter = new Intl.DateTimeFormat('en', {
                timeZone: item.zone,
                timeZoneName: 'shortOffset'
            });

            timeStr = timeFormatter.format(now);
            const parts = offsetFormatter.formatToParts(now);
            offsetStr = (parts.find(p => p.type === 'timeZoneName')?.value || '').replace('GMT', 'UTC');
        } catch(e) {}

        tr.innerHTML = `
            <td><strong>${item.city}</strong></td>
            <td>${item.country}</td>
            <td>${item.code}</td>
            <td>${offsetStr}</td>
            <td>${timeStr}</td>
        `;
        tbody.appendChild(tr);
    });

    // 表格搜尋過濾
    document.getElementById('tableSearch').addEventListener('input', function() {
        const query = this.value.toLowerCase();
        const rows = tbody.querySelectorAll('tr');
        rows.forEach(row => {
            const text = row.textContent.toLowerCase();
            row.style.display = text.includes(query) ? '' : 'none';
        });
    });
}

// ========== 5. Theme & Header Navigation ==========
function applyTheme(theme) {
    if (theme === 'light') {
        document.body.classList.add('light-theme');
    } else {
        document.body.classList.remove('light-theme');
    }
}
function toggleTheme() {
    const isLight = document.body.classList.contains('light-theme');
    const newTheme = isLight ? 'dark' : 'light';
    localStorage.setItem('msso_theme', newTheme);
    applyTheme(newTheme);
}
(function initTheme() {
    const savedTheme = localStorage.getItem('msso_theme');
    if (savedTheme === 'light') document.body.classList.add('light-theme');
})();

function toggleMenu() {
    const nav = document.getElementById("navMenu");
    const btn = document.querySelector(".menu-toggle");
    nav.classList.toggle("active");
    btn.innerHTML = nav.classList.contains("active") ? "✕" : "☰";
}

function updateHeaderClock() {
    const clockEl = document.getElementById('headerClock');
    if (clockEl) {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const date = String(now.getDate()).padStart(2, '0');
        const hrs = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        const secs = String(now.getSeconds()).padStart(2, '0');
        clockEl.textContent = ` ${year}年${month}月${date}日 ${hrs}:${mins}:${secs} MST`;
    }
}

// ========== DOM Ready ==========
window.addEventListener('DOMContentLoaded', () => {
    updateHeaderClock();
    setInterval(updateHeaderClock, 1000);

    initClockGrid();
    updateClocks();
    setInterval(updateClocks, 1000);

    initConverter();
    initTimezoneTable();
});
