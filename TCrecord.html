    <style>
        :root {
            --bg-main: #0f1117;
            --bg-card: #171a23;
            --bg-sidebar: #11141b;
            --text-primary: #e6edf3;
            --text-secondary: #a1aebf;
            --border: #272c36;
            --accent: #2563eb;
            --warning-1: #5b635d; /* 注意警報 */
            --warning-2: #218d34; /* 戒備警報 */
            --warning-3: #157ba4; /* 強風警報 */
            --warning-4: #fbf205; /* 烈風預警 */
            --warning-5: #d6990a; /* 烈風警報(定向烈風) */
            --warning-6: #d76400; /* 暴風警報 */
            --warning-7: #d41111; /* 颶風警報 */
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif;
        }
        body {
            background: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
        }
        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar h1 {
            font-size: 18px;
            margin-bottom: 32px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .filter-group {
            margin-bottom: 24px;
        }
        .filter-group label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .filter-group input, .filter-group select {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
        }
        .filter-group input:focus, .filter-group select:focus {
            outline: none;
            border-color: var(--accent);
        }
        .legend {
            margin-top: 40px;
        }
        .legend h3 {
            font-size: 14px;
            margin-bottom: 12px;
            color: var(--text-secondary);
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .color-dot {
            width: 14px;
            height: 14px;
            border-radius: 4px;
        }
        /* Main Content */
        .main {
            margin-left: 260px;
            flex: 1;
            padding: 24px;
        }
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
        }
        .stat-card h4 {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .stat-card .num {
            font-size: 24px;
            font-weight: 600;
        }
        .tc-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .tc-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .tc-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tc-name {
            font-size: 16px;
            font-weight: 600;
        }
        .tc-meta {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .tc-max-level {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .alert-list {
            padding: 12px 18px;
        }
        .alert-row {
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 14px;
            display: grid;
            grid-template-columns: 160px 1fr 100px;
            gap: 12px;
        }
        .empty-tip {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 15px;
        }
        /* Alert Level Color Classes */
        .lv-注意警報 { background: rgba(91, 99, 93, 0.15); border-left: 3px solid var(--warning-1); }
        .lv-戒備警報 { background: rgba(33, 141, 52, 0.15); border-left: 3px solid var(--warning-2); }
        .lv-強風警報 { background: rgba(21, 123, 164, 0.15); border-left: 3px solid var(--warning-3); }
        .lv-烈風預警警報 { background: rgba(251, 242, 5, 0.15); border-left: 3px solid var(--warning-4); }
        .lv-東北烈風警報, .lv-東南烈風警報, .lv-西北烈風警報, .lv-西南烈風警報 { background: rgba(214, 153, 10, 0.15); border-left: 3px solid var(--warning-5); }
        .lv-暴風警報 { background: rgba(215, 100, 0, 0.15); border-left: 3px solid var(--warning-6); }
        .lv-颶風警報 { background: rgba(212, 17, 17, 0.2); border-left: 3px solid var(--warning-7); }

        .badge-注意警報 { background: var(--warning-1); color: #fff; }
        .badge-戒備警報 { background: var(--warning-2); color: #fff; }
        .badge-強風警報 { background: var(--warning-3); color: #fff; }
        .badge-烈風警報 { background: var(--warning-5); color: #000; }
        .badge-暴風警報 { background: var(--warning-6); color: #fff; }
        .badge-颶風警報 { background: var(--warning-7); color: #fff; }

        @media(max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: static; }
            .main { margin-left: 0; margin-top: 20px; }
        }
    </style>

        // Calculate max alert level per TC
        function enrichTC(tc) {
            let maxRank = 0;
            let maxType = "";
            tc.alerts.forEach(a => {
                const r = levelRank[a.type];
                if(r > maxRank) {
                    maxRank = r;
                    maxType = a.type;
                }
            });
            tc.maxRaw = maxType;
            tc.maxGroup = groupMap[maxType];
            return tc;
        }
        const dataset = rawData.map(enrichTC);

        // Render top statistics panel with all tier counters
        function renderStats(list) {
            document.getElementById("totalTC").textContent = dataset.length;
            document.getElementById("filteredTC").textContent = list.length;

            let hurricane = 0;
            let galeOrAbove = 0; // 烈風及以上：烈風預警、烈風警報、暴風、颶風
            list.forEach(tc => {
                if (!tc?.maxGroup) return;
                // 單獨統計颶風
                if(tc.maxGroup === "颶風警報") hurricane++;
                // 烈風及以上全部計入
                if(["烈風預警警報", "烈風警報", "暴風警報", "颶風警報"].includes(tc.maxGroup)) {
                    galeOrAbove++;
                }
            });

            document.getElementById("hurricaneCount").textContent = hurricane;
            document.getElementById("galeCount").textContent = galeOrAbove;
        }

        // Filter handler for Year / Name / Max Level
        function getFilteredList() {
            const yearVal = document.getElementById("yearFilter").value;
            const nameVal = document.getElementById("nameFilter").value.trim().toLowerCase();
            const levelVal = document.getElementById("levelFilter").value;

            return dataset.filter(tc => {
                if(yearVal && String(tc.year) !== yearVal) return false;
                if(nameVal && !tc.name.toLowerCase().includes(nameVal)) return false;
                if(levelVal) {
                    if(levelVal === "烈風警報") {
                        if(tc.maxGroup !== "烈風警報" && tc.maxGroup !== "烈風預警警報") return false;
                    } else if(tc.maxGroup !== levelVal) return false;
                }
                return true;
            });
        }

        // Render TC card list
        function renderList() {
            const container = document.getElementById("tcList");
            const filtered = getFilteredList();
            renderStats(filtered);

            if(filtered.length === 0) {
                container.innerHTML = `<div class="empty-tip">沒有符合篩選條件的熱帶氣旋記錄</div>`;
                return;
            }

            let html = "";
            filtered.forEach(tc => {
                const badgeCls = badgeClassMap[tc.maxGroup];
                let alertRows = "";
                tc.alerts.forEach(alert => {
                    const rowCls = `lv-${alert.type}`;
                    alertRows += `
                    <div class="alert-row ${rowCls}">
                        <span>${alert.type}</span>
                        <span>${alert.start} ～ ${alert.end}</span>
                        <span></span>
                    </div>
                    `;
                });

                html += `
                <div class="tc-card">
                    <div class="tc-header">
                        <div>
                            <div class="tc-name">${tc.name}</div>
                            <div class="tc-meta">年份：${tc.year}｜總警報時長：${tc.totalH}</div>
                        </div>
                        <span class="tc-max-level ${badgeCls}">最高：${tc.maxGroup}</span>
                    </div>
                    <div class="alert-list">
                        ${alertRows}
                    </div>
                </div>
                `;
            });
            container.innerHTML = html;
        }

        // Bind filter events
        document.getElementById("yearFilter").addEventListener("change", renderList);
        document.getElementById("nameFilter").addEventListener("input", renderList);
        document.getElementById("levelFilter").addEventListener("change", renderList);

        // Initialize page load
        window.addEventListener("DOMContentLoaded", renderList);
    </script>
